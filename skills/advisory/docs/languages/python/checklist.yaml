# Python Code Review Security Checklist
# Based on: OWASP ASVS Level 2, CWE Top 25, Python Security Best Practices

checklist:
  authentication:
    required: true
    items:
      - id: AUTH-01
        check: "Password hashing uses bcrypt, argon2, or PBKDF2 (not MD5/SHA1)"
        severity: CRITICAL
        cwe: 327
        patterns_to_check: ["PY-327-001"]
        references:
          - "OWASP ASVS V2.4.1"
          - "https://docs.python.org/3/library/hashlib.html"

      - id: AUTH-02
        check: "No hardcoded credentials in source code"
        severity: CRITICAL
        cwe: 798
        patterns_to_check: ["PY-798-001", "PY-798-002"]
        references:
          - "OWASP ASVS V2.10.1"

      - id: AUTH-03
        check: "Session tokens generated with secrets module (not random)"
        severity: HIGH
        cwe: 330
        patterns_to_check: ["PY-330-001"]
        references:
          - "OWASP ASVS V3.2.1"

      - id: AUTH-04
        check: "Multi-factor authentication implemented for privileged accounts"
        severity: HIGH
        owasp_asvs: "V2.7.1"

      - id: AUTH-05
        check: "Password reset tokens expire after use or timeout"
        severity: MEDIUM
        owasp_asvs: "V2.5.6"

  input_validation:
    required: true
    items:
      - id: INPUT-01
        check: "All SQL queries use parameterized statements (no string concatenation)"
        severity: CRITICAL
        cwe: 89
        patterns_to_check: ["PY-89-001", "PY-89-002"]
        references:
          - "OWASP ASVS V5.3.4"

      - id: INPUT-02
        check: "User input validated before use (type, length, format, range)"
        severity: HIGH
        cwe: 20
        owasp_asvs: "V5.1.1"

      - id: INPUT-03
        check: "Path traversal prevention (no ../ in file paths)"
        severity: CRITICAL
        cwe: 22
        patterns_to_check: ["PY-22-001"]
        references:
          - "OWASP ASVS V5.3.2"

      - id: INPUT-04
        check: "Command injection prevented (no shell=True with user input)"
        severity: CRITICAL
        cwe: 78
        patterns_to_check: ["PY-78-001", "PY-78-002"]
        references:
          - "OWASP ASVS V5.3.8"

      - id: INPUT-05
        check: "URL validation prevents SSRF (whitelist schemes and hosts)"
        severity: HIGH
        cwe: 918
        patterns_to_check: ["PY-918-001"]
        references:
          - "OWASP ASVS V5.3.11"

  output_encoding:
    required: true
    items:
      - id: OUTPUT-01
        check: "Template auto-escaping enabled (Jinja2, Django templates)"
        severity: HIGH
        cwe: 79
        patterns_to_check: ["PY-79-001", "PY-79-002"]
        references:
          - "OWASP ASVS V5.3.3"

      - id: OUTPUT-02
        check: "No use of mark_safe() or safe filter with user input"
        severity: HIGH
        cwe: 79
        patterns_to_check: ["PY-79-002"]

      - id: OUTPUT-03
        check: "JSON encoding used for API responses (not eval or exec)"
        severity: HIGH
        cwe: 502

      - id: OUTPUT-04
        check: "Content-Type headers set correctly (prevent MIME sniffing)"
        severity: MEDIUM
        owasp_asvs: "V14.4.3"

  cryptography:
    required: true
    items:
      - id: CRYPTO-01
        check: "No hardcoded secrets or encryption keys"
        severity: CRITICAL
        cwe: 798
        patterns_to_check: ["PY-798-001", "PY-798-002"]
        references:
          - "OWASP ASVS V6.2.1"

      - id: CRYPTO-02
        check: "Strong encryption algorithms (AES-256-GCM, not DES/3DES/ECB)"
        severity: CRITICAL
        cwe: 327
        patterns_to_check: ["PY-327-002"]
        references:
          - "OWASP ASVS V6.2.2"

      - id: CRYPTO-03
        check: "Cryptographically secure random generation (secrets module)"
        severity: HIGH
        cwe: 330
        patterns_to_check: ["PY-330-001"]
        references:
          - "OWASP ASVS V6.3.1"

      - id: CRYPTO-04
        check: "TLS 1.2+ used for all external connections"
        severity: HIGH
        owasp_asvs: "V9.1.1"

      - id: CRYPTO-05
        check: "Certificate validation enabled (verify=True in requests)"
        severity: HIGH
        owasp_asvs: "V9.1.3"

  session_management:
    required: true
    items:
      - id: SESSION-01
        check: "Session tokens have sufficient entropy (≥128 bits)"
        severity: HIGH
        owasp_asvs: "V3.2.1"

      - id: SESSION-02
        check: "Secure and HttpOnly flags set on session cookies"
        severity: HIGH
        owasp_asvs: "V3.4.1"

      - id: SESSION-03
        check: "Session invalidated on logout"
        severity: MEDIUM
        owasp_asvs: "V3.3.1"

      - id: SESSION-04
        check: "Session timeout configured appropriately"
        severity: MEDIUM
        owasp_asvs: "V3.3.3"

  authorization:
    required: true
    items:
      - id: AUTHZ-01
        check: "Authorization checks present on all sensitive operations"
        severity: CRITICAL
        cwe: 862
        patterns_to_check: ["PY-862-001"]
        references:
          - "OWASP ASVS V4.1.2"

      - id: AUTHZ-02
        check: "Direct object references protected (no /user/123 without authz)"
        severity: HIGH
        owasp_asvs: "V4.1.2"

      - id: AUTHZ-03
        check: "Principle of least privilege applied to all operations"
        severity: MEDIUM
        owasp_asvs: "V4.1.3"

      - id: AUTHZ-04
        check: "CSRF protection enabled on state-changing operations"
        severity: HIGH
        cwe: 352
        patterns_to_check: ["PY-352-001"]
        references:
          - "OWASP ASVS V4.2.2"

  error_handling:
    required: true
    items:
      - id: ERR-01
        check: "No sensitive data in error messages shown to users"
        severity: HIGH
        cwe: 200
        patterns_to_check: ["PY-200-001"]
        references:
          - "OWASP ASVS V7.4.1"

      - id: ERR-02
        check: "Exceptions logged with full details (server-side only)"
        severity: MEDIUM
        owasp_asvs: "V7.3.1"

      - id: ERR-03
        check: "Debug mode disabled in production"
        severity: CRITICAL
        cwe: 200
        patterns_to_check: ["PY-200-002"]
        references:
          - "OWASP ASVS V14.3.3"

      - id: ERR-04
        check: "Generic error messages returned to users"
        severity: MEDIUM
        owasp_asvs: "V7.4.1"

  logging:
    required: true
    items:
      - id: LOG-01
        check: "Security events logged (auth failures, access control violations)"
        severity: HIGH
        owasp_asvs: "V7.1.1"

      - id: LOG-02
        check: "No sensitive data in logs (passwords, tokens, PII)"
        severity: HIGH
        owasp_asvs: "V7.1.3"

      - id: LOG-03
        check: "Logs include timestamp, user, and action"
        severity: MEDIUM
        owasp_asvs: "V7.1.2"

      - id: LOG-04
        check: "Log injection prevented (sanitize user input in logs)"
        severity: MEDIUM
        cwe: 117

  dependencies:
    required: true
    items:
      - id: DEP-01
        check: "Requirements.txt or Pipfile has version pinning"
        severity: MEDIUM
        owasp_asvs: "V14.2.1"

      - id: DEP-02
        check: "No known vulnerable dependencies (check with pip-audit or safety)"
        severity: CRITICAL
        owasp_asvs: "V14.2.2"

      - id: DEP-03
        check: "Dependencies from trusted sources only (PyPI, verified repos)"
        severity: HIGH
        owasp_asvs: "V14.2.3"

      - id: DEP-04
        check: "Unused dependencies removed"
        severity: LOW
        owasp_asvs: "V14.2.5"

  deserialization:
    required: true
    items:
      - id: DESER-01
        check: "No pickle.loads() with untrusted data"
        severity: CRITICAL
        cwe: 502
        patterns_to_check: ["PY-502-001"]
        references:
          - "OWASP ASVS V5.5.3"

      - id: DESER-02
        check: "Prefer JSON over pickle for data serialization"
        severity: MEDIUM

      - id: DESER-03
        check: "XML parsing uses defusedxml (not xml.etree)"
        severity: HIGH
        cwe: 611
        patterns_to_check: ["PY-611-001"]
        references:
          - "OWASP ASVS V5.5.2"

  framework_specific:
    django:
      - id: DJ-01
        check: "DEBUG = False in production settings"
        severity: CRITICAL
        patterns_to_check: ["PY-200-002"]

      - id: DJ-02
        check: "CSRF protection enabled (django.middleware.csrf.CsrfViewMiddleware)"
        severity: CRITICAL
        patterns_to_check: ["PY-352-001"]

      - id: DJ-03
        check: "Clickjacking protection enabled (X-Frame-Options)"
        severity: HIGH

      - id: DJ-04
        check: "SECURE_SSL_REDIRECT = True in production"
        severity: HIGH

      - id: DJ-05
        check: "SESSION_COOKIE_SECURE = True"
        severity: HIGH

      - id: DJ-06
        check: "ALLOWED_HOSTS configured (not ['*'])"
        severity: HIGH

      - id: DJ-07
        check: "Use Django ORM instead of raw SQL where possible"
        severity: MEDIUM

    flask:
      - id: FL-01
        check: "SECRET_KEY is cryptographically random (not 'dev')"
        severity: CRITICAL

      - id: FL-02
        check: "SESSION_COOKIE_SECURE = True"
        severity: HIGH

      - id: FL-03
        check: "SESSION_COOKIE_HTTPONLY = True"
        severity: HIGH

      - id: FL-04
        check: "Flask-WTF CSRF protection enabled"
        severity: CRITICAL
        patterns_to_check: ["PY-352-001"]

      - id: FL-05
        check: "app.debug = False in production"
        severity: CRITICAL

      - id: FL-06
        check: "Use Jinja2 autoescape (enabled by default)"
        severity: HIGH
        patterns_to_check: ["PY-79-001"]

    fastapi:
      - id: FA-01
        check: "Pydantic models used for input validation"
        severity: HIGH

      - id: FA-02
        check: "CORS middleware configured restrictively"
        severity: HIGH

      - id: FA-03
        check: "OAuth2/JWT authentication properly implemented"
        severity: CRITICAL

      - id: FA-04
        check: "API rate limiting configured"
        severity: MEDIUM

metadata:
  total_checks: 60+
  critical_checks: 15
  high_checks: 25
  framework_coverage: ["django", "flask", "fastapi"]
  owasp_asvs_level: 2
  last_updated: "2026-01-17"
  status: "complete"
