# ── Narrative Overrides (optional) ───────────────────────────────────────────
# Customize generated section content without modifying templates or skill code.
# Applies after report generation — survives repeated Generate runs.
#
# Supported sections: cover, executive_summary, scope, findings,
#                     recommendations, appendices
#
# Each section supports three variants:
#   {section}_prefix   — injected before generated content
#   {section}_suffix   — injected after generated content
#   {section}_override — replaces generated content entirely
#
# narrative:
#   executive_summary_suffix: |
#     [Add engagement-specific context, key themes, or observations here.]
#   scope_suffix: |
#     [Add methodology notes or environment-specific details here.]
#   recommendations_prefix: |
#     [Add prioritization context or remediation roadmap framing here.]
