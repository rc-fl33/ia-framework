    canonical_question_id: MEDIA-INVENTORY-001

    evidence_required:
      - type: media_inventory
        description: "Inventory of all media containing cardholder data with tracking details"
        examples:
          - "Media inventory spreadsheet: media ID, type (backup tape, USB drive, hard drive), classification (confidential-CHD), location, custodian, last inventory date"
          - "Backup tape library log: tape barcode, backup job ID, creation date, retention period, vault location"
          - "Physical media custody chain: media ID → issued to → purpose → return date → destruction date"

      - type: classification_labels
        description: "Media classification system with visible labeling"
        examples:
          - "Media classification policy: all CHD-containing media labeled 'CONFIDENTIAL - PCI DATA' (red label)"
          - "Photos showing labeled backup tapes, USB drives, hard drives with classification markings"
          - "Label templates and labeling procedures (label applied before media leaves secure area)"

      - type: physical_security
        description: "Secure storage for media with access controls"
        examples:
          - "Photos of locked media cabinets/safes with badge reader or combination lock"
          - "Media storage room access log showing controlled access (badge swipe log for last 90 days)"
          - "Offsite media storage contract with secure vault provider (Iron Mountain, Recall) showing chain of custody procedures"

    test_scenarios:
      - scenario: "Media inventory complete and accurate"
        expected_evidence: ["Inventory lists all CHD media types", "Spot check: physical count matches inventory", "Last inventory date within 90 days"]
        pass_criteria: "Complete inventory, physical verification matches records, quarterly reconciliation"
        compliance_level: full

      - scenario: "Classification labeling enforced"
        expected_evidence: ["All CHD media visibly labeled", "Unlabeled media not containing CHD or properly labeled", "Labeling procedure followed at media creation"]
        pass_criteria: "100% labeling compliance observed during spot check"
        compliance_level: full

      - scenario: "Secure storage access controlled"
        expected_evidence: ["Media stored in locked container/room", "Access log shows authorized personnel only", "Unauthorized access attempt denied"]
        pass_criteria: "Physical access controls functional, access logged and restricted"
        compliance_level: full

    gap_examples:
      - gap: "Media inventory incomplete or not maintained"
        indicator: "Inventory spreadsheet last updated 2 years ago, no process for adding new media, physical count doesn't match inventory"
        remediation: "Conduct full media inventory, assign media custodian role, implement quarterly inventory reconciliation, add media tracking to backup job procedures"

      - gap: "Media not classified or labeled"
        indicator: "Backup tapes have no labels, USB drives unmarked, staff unsure which media contains CHD"
        remediation: "Implement classification labeling procedure (all CHD media labeled before leaving IT), apply labels to existing media inventory, audit labeling compliance monthly"

      - gap: "Media stored in unsecured locations"
        indicator: "Backup tapes in unlocked cabinet, USB drives in desk drawers, media accessible to unauthorized personnel"
        remediation: "Procure locking media cabinet or safe, limit access to media custodian + backup, log all media access, relocate media to secured room"

    sub_questions:
      - "Is all media containing cardholder data inventoried with tracking (type, location, custodian)?"
      - "Is media classified and visibly labeled to identify sensitivity?"
      - "Is media physically secured in locked containers or rooms with access controls?"
      - "Is media inventory reconciled periodically (at least annually)?"

    risk_weight: HIGH

    scoring:
      full: "Complete media inventory with classification labels, secure storage with access controls, quarterly reconciliation"
      partial: "Media inventory exists but incomplete, inconsistent labeling, or informal storage security"
      none: "No media inventory, classification, or secure storage for CHD-containing media"

  - id: Q-PCI-019
    text: "Are controls in place to secure media sent outside the facility and track media distribution?"
    category: media_security
    pci_requirement: 9
    status: required
    controls:
      pci-dss: ["9.4.2", "9.4.3"]
      nist-800-53: ["MP-5", "SC-8"]
      iso-27001: ["A.7.1.2", "A.8.10", "A.8.11"]
      nist-csf: ["PR.DS-03", "PR.DS-05"]

    canonical_question_id: MEDIA-TRANSPORT-001

    evidence_required:
      - type: distribution_log
        description: "Media distribution and movement tracking records"
        examples:
          - "Media shipment log: media ID, destination, courier, tracking number, shipped by, date sent, date received confirmation, recipient signature"
          - "Offsite backup transport manifest: tape barcodes, pickup date, Iron Mountain driver signature, vault delivery confirmation"
          - "Internal media movement log: media ID, moved from, moved to, authorized by, transport method, date"

      - type: security_controls
        description: "Media transport security measures and approvals"
        examples:
          - "Management authorization for offsite media: email approving tape shipment to DR site with business justification"
          - "Courier service contract (FedEx, Iron Mountain) with chain of custody, signature required delivery, tracking"
          - "Photos showing secure media packaging: tamper-evident bags, locked courier cases, padded envelopes with tracking labels"
          - "Encryption verification: backup encryption enabled (AES-256), encryption key stored separately from media"

      - type: tracking_verification
        description: "Tracking mechanisms and delivery confirmation"
        examples:
          - "FedEx tracking numbers with delivery confirmation signatures (last 90 days)"
          - "Iron Mountain chain of custody reports showing tape pickup/delivery with driver signatures"
          - "Exception follow-up: tracking shows 'delivery attempted' → investigation initiated within 24 hours → media located/recovered"

    test_scenarios:
      - scenario: "Distribution tracking complete"
        expected_evidence: ["All media shipments logged with tracking numbers", "Delivery confirmation documented", "No untracked media movements"]
        pass_criteria: "100% media distribution accountability, tracking end-to-end"
        compliance_level: full

      - scenario: "Management authorization documented"
        expected_evidence: ["Sample media shipment shows management approval", "Business justification documented", "Unauthorized shipments blocked"]
        pass_criteria: "All offsite media movements authorized by management"
        compliance_level: full

      - scenario: "Secure transport methods used"
        expected_evidence: ["Courier service with tracking and signature", "Tamper-evident packaging used", "Encryption verified before shipment"]
        pass_criteria: "Secure courier + encryption for all CHD media in transit"
        compliance_level: full

    gap_examples:
      - gap: "Media sent offsite without tracking or authorization"
        indicator: "IT staff mail backup tapes to DR site via regular mail, no tracking numbers, no management approval"
        remediation: "Require courier service with tracking (FedEx with signature, Iron Mountain secure transport), implement approval workflow for all offsite media shipments"

      - gap: "Distribution log not maintained or incomplete"
        indicator: "No record of media sent offsite last quarter, log has missing tracking numbers or recipient confirmations"
        remediation: "Create media shipment log template (mandatory fields), train personnel on logging requirements, audit log completeness monthly"

      - gap: "Media transported without encryption or tamper-evident packaging"
        indicator: "Backup tapes sent in regular padded envelopes, encryption not enabled, no tamper seals"
        remediation: "Enable backup encryption (verify before shipment), use tamper-evident bags (numbered seals logged), implement dual-control for media packaging (two people verify encryption + packaging)"

    sub_questions:
      - "Are all media distributions logged with destination, courier, tracking information, and delivery confirmation?"
      - "Is management authorization required and documented for media sent outside the facility?"
      - "Are secure courier services used with tracking and signature requirements?"
      - "Is media encrypted before offsite transport, or physically secured in tamper-evident packaging?"

    risk_weight: HIGH

    scoring:
      full: "Media distribution logged with tracking, management authorization required, secure courier used, encryption verified"
      partial: "Distribution tracking exists but incomplete, informal authorization, or inconsistent courier usage"
      none: "No media distribution tracking, or media sent offsite without secure transport controls"

  - id: Q-PCI-020
    text: "Is media properly classified, approved by management, and securely destroyed when no longer needed?"
    category: media_security
    pci_requirement: 9
    status: required
    controls:
      pci-dss: ["9.4.4", "9.4.5", "9.4.5.1", "9.4.6"]
      nist-800-53: ["MP-6"]
      iso-27001: ["A.8.10"]
      hipaa: ["§164.310(d)(2)(i)", "§164.310(d)(2)(ii)"]
      nist-csf: ["PR.DS-03", "PR.IP-06"]

    canonical_question_id: MEDIA-DESTRUCTION-001

    evidence_required:
      - type: destruction_records
        description: "Media destruction certificates and logs"
        examples:
          - "Shred-it certificate of destruction: 50 backup tapes destroyed on 2025-11-15, certificate #12345, witnessed destruction"
          - "Hard drive destruction log: drive serial numbers, destruction method (degaussing + shredding), date, performed by, witness signature"
          - "Quarterly destruction batch records showing media retention expiry → scheduled for destruction → destruction completed (audit trail)"

      - type: destruction_procedures
        description: "Documented media destruction procedures and methods"
        examples:
          - "Media destruction policy: CHD media destroyed via cross-cut shredding (paper), degaussing + physical destruction (magnetic media), crypto-erase + physical destruction (SSDs)"
          - "Destruction method matrix: media type → approved destruction method (NIST 800-88 Rev 1 Purge or Destroy)"
          - "Photos/videos of destruction process: industrial shredder, degausser, witnessed destruction event"
          - "Vendor contracts with certified destruction providers (NAID AAA certified, R2 certified)"

      - type: authorization_records
        description: "Management approval for media destruction"
        examples:
          - "Destruction authorization form: media inventory list → retention period expired → manager approval → destruction scheduled"
          - "Email approval: 'Approve destruction of backup tapes from 2020 per 5-year retention policy'"
          - "Destruction exception handling: media retention extended → management approval documented → updated destruction schedule"

    test_scenarios:
      - scenario: "Destruction procedures documented and followed"
        expected_evidence: ["Destruction policy defines methods by media type", "Observed practice matches documented procedure", "NIST 800-88 compliant methods used"]
        pass_criteria: "Complete destruction procedures, compliance verified via sampling"
        compliance_level: full

      - scenario: "Management authorization documented"
        expected_evidence: ["Sample destruction batch shows management approval", "Retention policy drives destruction schedule", "Unauthorized destruction prevented"]
        pass_criteria: "All media destruction authorized per retention policy"
        compliance_level: full

      - scenario: "Destruction certificates retained"
        expected_evidence: ["Vendor certificates for all outsourced destruction (last 3 years)", "Internal destruction logs complete with serial numbers/identifiers", "Audit trail from media inventory → destruction"]
        pass_criteria: "Complete destruction documentation, certificates retained per policy"
        compliance_level: full

    gap_examples:
      - gap: "Media destruction not documented or no certificates retained"
        indicator: "IT staff say 'we destroy old tapes' but no logs, vendor provides destruction service but no certificates on file"
        remediation: "Require destruction certificates from vendors (NAID certified), log all internal destruction (serial numbers, date, method, witness), retain certificates per document retention policy (3 years minimum)"

      - gap: "Inadequate destruction methods used"
        indicator: "Backup tapes thrown in regular trash, hard drives wiped but not physically destroyed, paper with CHD shredded with strip-cut shredder (not cross-cut)"
        remediation: "Implement NIST 800-88 compliant methods: magnetic media = degauss + shred, SSDs = crypto-erase + physical destruction, paper = cross-cut shred or pulverize, contract with certified destruction vendor"

      - gap: "No management approval for destruction"
        indicator: "IT staff destroy media ad-hoc, no retention policy enforcement, no approval workflow"
        remediation: "Create retention policy with destruction triggers (age, business need expiry), require manager approval before destruction, schedule quarterly destruction batches with approval workflow"

    sub_questions:
      - "Are media destruction procedures documented with methods appropriate for media type (cross-cut shred, degauss, crypto-erase)?"
      - "Is management authorization required and documented before media destruction?"
      - "Are destruction certificates or logs retained with media identifiers (serial numbers, tape barcodes)?"
      - "Are destruction methods compliant with industry standards (NIST 800-88, rendering CHD unrecoverable)?"

    risk_weight: HIGH

    scoring:
      full: "Documented destruction procedures (NIST 800-88 compliant), management authorization required, complete certificates/logs retained"
      partial: "Destruction occurs but procedures informal, weak methods used, or incomplete documentation"
      none: "No formal media destruction process, or media discarded without secure destruction"

  - id: Q-PCI-021
    text: "Are hard-copy materials containing cardholder data secured when not in use and destroyed when no longer needed?"
    category: media_security
    pci_requirement: 9
    status: required
    controls:
      pci-dss: ["9.4.7"]
      nist-800-53: ["MP-2", "MP-6"]
      iso-27001: ["A.7.1.2", "A.8.10"]
      nist-csf: ["PR.DS-03", "PR.IP-06"]

    canonical_question_id: MEDIA-CLASSIFICATION-001

    evidence_required:
      - type: hardcopy_controls
        description: "Physical security controls for hard-copy CHD materials"
        examples:
          - "Photos showing locked cabinets for CHD documents (invoices, receipts, reports)"
          - "Clean desk policy: no CHD printouts left unattended, lock documents in drawer at end of day"
          - "Secure printing configuration: print jobs require badge swipe at printer (pull printing), jobs auto-deleted after 24 hours"

      - type: destruction_equipment
        description: "Secure destruction equipment and procedures for hard-copy materials"
        examples:
          - "Cross-cut shredder specifications: minimum DIN P-4 security level (particle size ≤160mm²)"
          - "Locked shred bins placed near workstations with CHD access, serviced by certified vendor weekly"
          - "Destruction service contract (Shred-it, Iron Mountain) with certificates of destruction for confidential materials"
          - "Quarterly destruction certificates showing volumes destroyed (e.g., '120 lbs confidential documents destroyed 2025-11-15')"

      - type: policy_documentation
        description: "Hard-copy media handling policy and training"
        examples:
          - "Clean desk policy requiring: CHD documents locked when unattended, documents shredded when no longer needed, no CHD in trash"
          - "Staff training completion records on hard-copy security procedures (annual training)"
          - "Workspace audit results: spot checks showing compliance with clean desk policy (last 3 months)"

    test_scenarios:
      - scenario: "Hard-copy materials secured when not in use"
        expected_evidence: ["Workspace walk-through: no CHD documents visible on desks", "Documents stored in locked cabinets/drawers", "Clean desk policy enforced"]
        pass_criteria: "No unattended CHD documents observed, locked storage available and used"
        compliance_level: full

      - scenario: "Secure destruction equipment available and used"
        expected_evidence: ["Cross-cut shredders present (DIN P-4 or higher)", "Shred bins available and labeled 'Confidential'", "Destruction certificates from vendor (last 90 days)"]
        pass_criteria: "Secure destruction readily accessible, regular service documented"
        compliance_level: full

      - scenario: "Staff trained on hard-copy security"
        expected_evidence: ["Training completion records (annual)", "Staff interviews demonstrate awareness", "Policy accessible to staff"]
        pass_criteria: "All staff handling CHD trained, can articulate procedures"
        compliance_level: full

    gap_examples:
      - gap: "CHD documents left unsecured on desks or printers"
        indicator: "Walk-through reveals invoices with full PAN on desks, printouts left at printer overnight"
        remediation: "Implement clean desk policy (lock documents when leaving desk), configure pull printing (badge required), conduct weekly workspace audits"

      - gap: "Inadequate shredding equipment (strip-cut shredders)"
        indicator: "Shredder produces long strips (not confetti), does not meet DIN P-4 security level"
        remediation: "Replace shredders with cross-cut models (DIN P-4 minimum), contract with certified destruction service for high-volume shredding"

      - gap: "CHD documents discarded in regular trash"
        indicator: "Audit of trash bins reveals printouts with CHD, no shred bins available, staff unaware of destruction requirements"
        remediation: "Place locked shred bins near all workstations handling CHD, train staff on shredding requirements (all CHD documents), audit trash bins monthly"

    sub_questions:
      - "Are hard-copy materials containing CHD secured in locked storage when not in use?"
      - "Is secure destruction equipment available (cross-cut shredders, locked shred bins)?"
      - "Are hard-copy materials destroyed when no longer needed, with destruction certificates retained?"
      - "Are personnel trained on hard-copy security procedures (clean desk, secure printing, shredding)?"

    risk_weight: MEDIUM

    scoring:
      full: "Hard-copy CHD secured in locked storage, cross-cut shredders available, destruction certificates retained, staff trained"
      partial: "Some controls exist but inconsistent enforcement (documents left unsecured, inadequate shredders)"
      none: "No hard-copy security controls, or CHD documents routinely left unsecured and discarded in trash"

  # --- 9.5.x: POI Device Protection ---

  - id: Q-PCI-022
    text: "Is an inventory of point-of-interaction (POI) devices maintained and are devices inspected periodically for tampering?"
    category: poi_security
    pci_requirement: 9
    status: required
    controls:
      pci-dss: ["9.5.1", "9.5.1.1", "9.5.1.2", "9.5.1.2.1"]
      nist-800-53: ["PE-3", "SA-9"]
      iso-27001: ["A.7.1.2", "A.8.1"]
      nist-csf: ["PR.AC-02", "DE.CM-07"]

    canonical_question_id: POI-INVENTORY-001

    evidence_required:
      - type: device_inventory
        description: "Complete POI device inventory with tracking details"
        examples:
          - "POI inventory spreadsheet: device ID, make/model (Ingenico iSC250, Verifone VX520), serial number, location (Register 3, Lane 5), deployment date, last inspection date"
          - "PCI PTS certification verification: each device model listed with PTS approval number from PCI SSC website"
          - "Device photos in inventory: front, back, serial number label visible"

      - type: inspection_procedures
        description: "Tampering inspection procedures and checklists"
        examples:
          - "POI inspection checklist: verify serial number matches inventory, check for loose screws/panels, inspect for skimmers, verify tamper-evident seals intact, check cable connections, photo documentation"
          - "Tamper-evident seal log: device serial number → seal number → applied date → verified date → inspector name"
          - "Inspection schedule: daily (cashier visual check), weekly (manager detailed inspection), quarterly (security/IT full inspection with photos)"
          - "Training materials: 'How to Identify POI Tampering' with examples of skimmers, modified devices, foreign components"

      - type: inspection_records
        description: "Inspection completion records and exception handling"
        examples:
          - "Daily inspection log: date, register/lane, device serial, inspected by, anomalies noted, seal intact (Y/N)"
          - "Weekly detailed inspection report with photos: last 12 weeks showing inspection completion and findings"
          - "Exception handling example: seal broken detected → device removed from service → replacement device deployed → investigation initiated"
          - "Training completion records: all cashiers, managers, security staff trained on POI inspection procedures (annual training)"

    test_scenarios:
      - scenario: "Inventory complete and accurate"
        expected_evidence: ["Inventory lists all POI devices", "Physical count matches inventory", "PTS certification verified for all models"]
        pass_criteria: "100% inventory accuracy, all devices PTS-approved"
        compliance_level: full

      - scenario: "Inspection procedures documented and followed"
        expected_evidence: ["Inspection checklist exists and used", "Inspection records complete for last 90 days", "Daily + periodic inspections documented"]
        pass_criteria: "Regular inspection schedule maintained, records complete"
        compliance_level: full

      - scenario: "Tamper detection functional"
        expected_evidence: ["Tamper-evident seals used on all POI devices", "Seal numbers tracked in inventory", "Broken seal triggers investigation"]
        pass_criteria: "Seals present and intact, exception handling demonstrated"
        compliance_level: full

    gap_examples:
      - gap: "POI inventory incomplete or not maintained"
        indicator: "Inventory spreadsheet last updated 2 years ago, new devices deployed but not added to inventory, physical count shows more devices than inventory"
        remediation: "Conduct full POI inventory (visit all locations), assign POI inventory owner, update inventory when devices deployed/retired, quarterly inventory reconciliation"

      - gap: "No tampering inspections or inspections not documented"
        indicator: "Staff say 'we look at the devices' but no inspection checklist or records, no evidence of periodic inspections beyond ad-hoc visual checks"
        remediation: "Create inspection checklist (what to look for), schedule daily visual + weekly detailed inspections, document inspections in log, train all personnel on inspection procedures"

      - gap: "Tamper-evident seals not used or not tracked"
        indicator: "Devices have no tamper seals, or seals present but seal numbers not recorded (cannot detect seal replacement)"
        remediation: "Apply numbered tamper seals to all POI devices (cover screws, case seams), log seal numbers in inventory, inspect seal integrity during each inspection, replace seals only when device serviced (document reason)"

    sub_questions:
      - "Is a complete POI device inventory maintained with make, model, serial number, and location?"
      - "Are all POI devices PCI PTS certified (verified against PCI SSC approved device list)?"
      - "Are POI devices inspected periodically for tampering (daily visual, weekly detailed)?"
      - "Are tamper-evident seals used and tracked, with seal integrity verified during inspections?"
      - "Are personnel trained to identify POI tampering (skimmers, foreign components, loose panels)?"

    risk_weight: HIGH

    scoring:
      full: "Complete POI inventory with PTS verification, regular tampering inspections documented, tamper-evident seals tracked"
      partial: "Inventory exists but incomplete, inspections informal or undocumented, seals not used consistently"
      none: "No POI inventory, or no tampering inspection procedures"

  - id: Q-PCI-023
    text: "Are personnel trained to detect tampering and substitution attempts, and are POI device surfaces inspected for evidence of tampering?"
    category: poi_security
    pci_requirement: 9
    status: required
    controls:
      pci-dss: ["9.5.1.2.1", "9.5.1.3"]
      nist-800-53: ["AT-2", "PE-3"]
      iso-27001: ["A.7.1.2", "A.8.1"]
      nist-csf: ["PR.AT-01", "DE.CM-07"]

    canonical_question_id: POI-TAMPER-001

    evidence_required:
      - type: training_materials
        description: "POI security awareness training content and completion records"
        examples:
          - "Training presentation: 'POI Tampering Awareness' with photos of skimmers, modified devices, fake PIN pads"
          - "Training topics covered: visual inspection procedures, common tampering indicators (loose screws, extra cables, mismatched colors), substitution attempts, reporting procedures"
          - "Training completion records: all personnel handling POI devices (cashiers, managers, IT) trained annually"
          - "Training acknowledgment: signed attestation that personnel understand POI security responsibilities"

      - type: inspection_guidance
        description: "Surface inspection procedures for detecting tampering evidence"
        examples:
          - "POI tampering identification guide: photos showing normal vs tampered devices (side-by-side comparison)"
          - "Inspection checklist focusing on surfaces: check for scratches near screws, color mismatches, loose/ill-fitting panels, foreign components, unusual weight"
          - "Reference images: photos of each POI model in normal condition for comparison during inspections"
          - "Tamper indicators poster displayed at POS areas: 'Report if you see: extra cables, loose panel, different color, unusual device appearance'"

      - type: reporting_procedures
        description: "Incident reporting and response procedures for suspected tampering"
        examples:
          - "Tampering incident report form: device location, description of anomaly, reported by, date/time, photo evidence, action taken"
          - "Escalation procedure: suspect tampering → remove device from service → notify security/IT → notify acquirer/processor → investigate"
          - "Example incident: 'Device at Register 5 had loose card slot, removed from service 2025-10-01, sent to vendor for forensic analysis, replacement deployed'"

    test_scenarios:
      - scenario: "Personnel trained and aware"
        expected_evidence: ["Training completion records for all POI-handling personnel (last 12 months)", "Staff interviews demonstrate awareness of tampering indicators", "Staff can describe reporting procedure"]
        pass_criteria: "100% training compliance, staff demonstrate knowledge during interviews"
        compliance_level: full

      - scenario: "Surface inspection effective"
        expected_evidence: ["Inspection checklist includes surface tampering indicators", "Reference photos available for comparison", "Inspection records show surface examination documented"]
        pass_criteria: "Surface inspection integrated into regular inspection routine"
        compliance_level: full

      - scenario: "Incident response functional"
        expected_evidence: ["Reporting procedure documented and accessible", "Test scenario: staff describe correct response to suspected tampering", "Past incidents handled properly (if any)"]
        pass_criteria: "Clear reporting path, staff know what to do, incidents documented"
        compliance_level: full

    gap_examples:
      - gap: "No POI security training or training outdated"
        indicator: "No training records, staff unaware of tampering indicators, cannot describe what to look for or report"
        remediation: "Develop POI security awareness training (use industry examples, photos of skimmers), train all POI-handling personnel annually, track completion, test knowledge via spot interviews"

      - gap: "Surface inspection not performed or not documented"
        indicator: "Inspections focus only on seal integrity, no check for surface tampering (scratches, color mismatch, loose panels)"
        remediation: "Enhance inspection checklist to include surface indicators (scratches near screws, panel alignment, color consistency, weight check), add reference photos to inspection guide"

      - gap: "No clear incident reporting or response procedure"
        indicator: "Staff unsure who to notify if tampering suspected, no documentation of how to handle suspected compromise"
        remediation: "Document incident response procedure (remove device → notify security/IT → notify acquirer → investigate), add reporting contact info to inspection checklist, conduct tabletop exercise testing response"

    sub_questions:
      - "Are personnel trained to detect POI tampering and substitution attempts (annual training)?"
      - "Does training include visual examples of tampering (skimmers, modified devices, foreign components)?"
      - "Are POI device surfaces inspected for evidence of tampering (scratches, color mismatch, loose panels)?"
      - "Is there a clear incident reporting and response procedure for suspected POI tampering?"

    risk_weight: HIGH

    scoring:
      full: "Annual training with visual examples, surface inspection procedures documented, incident reporting and response clear"
      partial: "Some training exists but not comprehensive, surface inspection informal, unclear reporting procedure"
      none: "No POI security training, or no procedures for detecting and reporting tampering"

  # ═══════════════════════════════════════════════════════════════════════════
  # REQUIREMENT 10: Log and Monitor Access to Network Resources and Cardholder Data
  # ═══════════════════════════════════════════════════════════════════════════

  - id: Q-PCI-024
    text: "How do you log and monitor all access to network resources and cardholder data?"
    category: monitoring_detection
    pci_requirement: 10
    controls:
      pci-dss: "10.1, 10.2"
      nist-csf: "DE.CM-01, DE.CM-03"
      nist-800-53: "AU-2, AU-6"
      iso-27001: "A.8.15"
      hipaa: "§164.312(b)"
    evidence_required:
      - Logging policy
      - Log retention records
      - SIEM/log management documentation
    scoring:
      full: "Comprehensive logging with centralized management"
      partial: "Some logging but not comprehensive"
      none: "No formal logging"
    sub_questions:
      - "Are all access attempts logged?"
      - "Do logs include user, timestamp, action, and outcome?"
      - "Are logs centralized and protected?"
    risk_weight: HIGH

  - id: Q-PCI-025
    text: "How often are logs reviewed and anomalies investigated?"
    category: monitoring_detection
    pci_requirement: 10
    controls:
      pci-dss: "10.4"
      nist-csf: "DE.AE-02, DE.AE-03"
      nist-800-53: "AU-6"
      iso-27001: "A.8.15"
    evidence_required:
      - Log review procedures
      - Review records
      - Investigation documentation
    scoring:
      full: "Daily automated review with documented exception handling"
      partial: "Periodic review but not daily"
      none: "Logs not reviewed"
    sub_questions:
      - "Are security logs reviewed at least daily?"
      - "Is automated log analysis in place?"
      - "How are anomalies investigated?"
    risk_weight: HIGH

  # ═══════════════════════════════════════════════════════════════════════════
  # REQUIREMENT 11: Test Security of Systems and Networks Regularly
  # ═══════════════════════════════════════════════════════════════════════════

  - id: Q-PCI-026
    text: "How do you test security of systems and networks?"
    category: security_testing
    pci_requirement: 11
    controls:
      pci-dss: "11.3, 11.4"
      nist-csf: "DE.CM-08, ID.RA-01"
      nist-800-53: "CA-8, RA-5"
      iso-27001: "A.8.8"
      cis-v8: "16.1"
    evidence_required:
      - Vulnerability scan results
      - Penetration test reports
      - Remediation tracking
    scoring:
      full: "Quarterly vulnerability scans and annual penetration tests"
      partial: "Some testing but not at required frequency"
      none: "No formal security testing"
    sub_questions:
      - "Are internal/external vulnerability scans performed quarterly?"
      - "Are penetration tests performed annually?"
      - "Are high/critical findings remediated promptly?"
    risk_weight: HIGH

  - id: Q-PCI-027
    text: "Do you have change detection mechanisms for critical files?"
    category: monitoring_detection
    pci_requirement: 11
    controls:
      pci-dss: "11.5"
      nist-csf: "PR.DS-06, DE.CM-09"
      nist-800-53: "SI-7"
      iso-27001: "A.8.9"
    evidence_required:
      - FIM configuration
      - Alert procedures
      - Change review records
    scoring:
      full: "File integrity monitoring with alerts and review"
      partial: "FIM deployed but alerts not reviewed"
      none: "No file integrity monitoring"
    sub_questions:
      - "Is file integrity monitoring deployed on critical systems?"
      - "Are critical file changes alerted?"
      - "How are alerts reviewed and responded to?"
    risk_weight: MEDIUM

  # ═══════════════════════════════════════════════════════════════════════════
  # REQUIREMENT 12: Support Information Security with Organizational Policies and Programs
  # ═══════════════════════════════════════════════════════════════════════════

  - id: Q-PCI-028
    text: "Is there a documented information security policy?"
    category: governance_policies
    pci_requirement: 12
    controls:
      pci-dss: "12.1"
      nist-csf: "GV.PO-01"
      nist-800-53: "PL-1"
      iso-27001: "A.5.1"
      hipaa: "§164.316"
    evidence_required:
      - Security policy
      - Review records
      - Executive approval
    scoring:
      full: "Comprehensive policy reviewed annually and approved"
      partial: "Policy exists but outdated or incomplete"
      none: "No formal security policy"
    sub_questions:
      - "Does the policy address all PCI DSS requirements?"
      - "Is it reviewed at least annually?"
      - "Is there executive-level approval?"
    risk_weight: MEDIUM

  - id: Q-PCI-029
    text: "How do you manage incident response for security events?"
    category: incident_response
    pci_requirement: 12
    controls:
      pci-dss: "12.10"
      nist-csf: "RS.MA-01, RS.MA-02"
      nist-800-53: "IR-1, IR-4"
      iso-27001: "A.5.24, A.5.26"
      hipaa: "§164.308(a)(6)"
    evidence_required:
      - Incident response plan
      - Contact list
      - Test records
    scoring:
      full: "Documented IR plan tested annually with trained team"
      partial: "IR plan exists but not tested"
      none: "No formal incident response plan"
    sub_questions:
      - "Is there a documented incident response plan?"
      - "Does it cover suspected breaches and PCI compromise?"
      - "Is the plan tested at least annually?"
      - "Are roles and responsibilities defined?"
    risk_weight: HIGH
