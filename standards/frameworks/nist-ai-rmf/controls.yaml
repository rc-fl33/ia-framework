# NIST AI Risk Management Framework 1.0 — Controls
# Source: https://airc.nist.gov/airmf-resources/airmf/5-sec-core/
# Document: NIST AI 100-1 (January 2023)
# Total subcategories: 72 across 19 categories and 4 functions
# Last verified: 2026-02-25

framework: nist-ai-rmf
version: "1.0"
total_controls: 72

# Subcategory text sourced verbatim from NIST AI Resource Center:
# https://airc.nist.gov/airmf-resources/airmf/5-sec-core/

controls:

  # ═══════════════════════════════════════════════════════════════════════════
  # FUNCTION: GOVERN (GV)
  # Purpose: Cultivate a culture of risk management. Cross-cutting function
  # infused throughout MAP, MEASURE, and MANAGE.
  # ═══════════════════════════════════════════════════════════════════════════

  # --- Govern 1: Policies, processes, procedures, and practices ---
  # Policies, processes, procedures, and practices across the organization
  # related to the mapping, measuring, and managing of AI risks are in place,
  # transparent, and implemented effectively.

  - id: GOVERN 1.1
    title: >
      Legal and regulatory requirements involving AI are understood, managed,
      and documented.
    category: "Govern 1"
    function: GOVERN
    function_id: GV
    description: >
      Legal and regulatory requirements involving AI are understood, managed,
      and documented.
    status: active

  - id: GOVERN 1.2
    title: >
      The characteristics of trustworthy AI are integrated into organizational
      policies, processes, procedures, and practices.
    category: "Govern 1"
    function: GOVERN
    function_id: GV
    description: >
      The characteristics of trustworthy AI are integrated into organizational
      policies, processes, procedures, and practices.
    status: active

  - id: GOVERN 1.3
    title: >
      Processes, procedures, and practices are in place to determine the needed
      level of risk management activities based on the organization's risk
      tolerance.
    category: "Govern 1"
    function: GOVERN
    function_id: GV
    description: >
      Processes, procedures, and practices are in place to determine the needed
      level of risk management activities based on the organization's risk
      tolerance.
    status: active

  - id: GOVERN 1.4
    title: >
      The risk management process and its outcomes are established through
      transparent policies, procedures, and other controls based on
      organizational risk priorities.
    category: "Govern 1"
    function: GOVERN
    function_id: GV
    description: >
      The risk management process and its outcomes are established through
      transparent policies, procedures, and other controls based on
      organizational risk priorities.
    status: active

  - id: GOVERN 1.5
    title: >
      Ongoing monitoring and periodic review of the risk management process and
      its outcomes are planned and organizational roles and responsibilities
      clearly defined.
    category: "Govern 1"
    function: GOVERN
    function_id: GV
    description: >
      Ongoing monitoring and periodic review of the risk management process and
      its outcomes are planned and organizational roles and responsibilities
      clearly defined.
    status: active

  - id: GOVERN 1.6
    title: >
      Mechanisms are in place to inventory AI systems and are resourced
      according to organizational risk priorities.
    category: "Govern 1"
    function: GOVERN
    function_id: GV
    description: >
      Mechanisms are in place to inventory AI systems and are resourced
      according to organizational risk priorities.
    status: active

  - id: GOVERN 1.7
    title: >
      Processes and procedures are in place for decommissioning and phasing out
      AI systems safely and in a manner that does not increase risks.
    category: "Govern 1"
    function: GOVERN
    function_id: GV
    description: >
      Processes and procedures are in place for decommissioning and phasing out
      AI systems safely and in a manner that does not increase risks.
    status: active

  # --- Govern 2: Accountability structures ---
  # Accountability structures are in place so that the appropriate teams and
  # individuals are empowered, responsible, and trained for mapping, measuring,
  # and managing AI risks.

  - id: GOVERN 2.1
    title: >
      Roles and responsibilities and lines of communication related to mapping,
      measuring, and managing AI risks are documented and are clear to
      individuals and teams.
    category: "Govern 2"
    function: GOVERN
    function_id: GV
    description: >
      Roles and responsibilities and lines of communication related to mapping,
      measuring, and managing AI risks are documented and are clear to
      individuals and teams.
    status: active

  - id: GOVERN 2.2
    title: >
      The organization's personnel and partners receive AI risk management
      training to enable them to perform their duties and responsibilities.
    category: "Govern 2"
    function: GOVERN
    function_id: GV
    description: >
      The organization's personnel and partners receive AI risk management
      training to enable them to perform their duties and responsibilities.
    status: active

  - id: GOVERN 2.3
    title: >
      Executive leadership of the organization takes responsibility for
      decisions about risks associated with AI system development and
      deployment.
    category: "Govern 2"
    function: GOVERN
    function_id: GV
    description: >
      Executive leadership of the organization takes responsibility for
      decisions about risks associated with AI system development and
      deployment.
    status: active

  # --- Govern 3: Workforce diversity, equity, inclusion, and accessibility ---
  # Workforce diversity, equity, inclusion, and accessibility processes are
  # prioritized in the mapping, measuring, and managing of AI risks throughout
  # the lifecycle.

  - id: GOVERN 3.1
    title: >
      Decision-making related to mapping, measuring, and managing AI risks
      throughout the lifecycle is informed by a diverse team.
    category: "Govern 3"
    function: GOVERN
    function_id: GV
    description: >
      Decision-making related to mapping, measuring, and managing AI risks
      throughout the lifecycle is informed by a diverse team.
    status: active

  - id: GOVERN 3.2
    title: >
      Policies and procedures are in place to define and differentiate roles
      and responsibilities for human-AI configurations and oversight.
    category: "Govern 3"
    function: GOVERN
    function_id: GV
    description: >
      Policies and procedures are in place to define and differentiate roles
      and responsibilities for human-AI configurations and oversight.
    status: active

  # --- Govern 4: Organizational culture ---
  # Organizational teams are committed to a culture that considers and
  # communicates AI risk.

  - id: GOVERN 4.1
    title: >
      Organizational policies and practices are in place to foster a critical
      thinking and safety-first mindset in the design, development, deployment,
      and uses of AI systems.
    category: "Govern 4"
    function: GOVERN
    function_id: GV
    description: >
      Organizational policies and practices are in place to foster a critical
      thinking and safety-first mindset in the design, development, deployment,
      and uses of AI systems.
    status: active

  - id: GOVERN 4.2
    title: >
      Organizational teams document the risks and potential impacts of the AI
      technology they design, develop, deploy, evaluate, and use.
    category: "Govern 4"
    function: GOVERN
    function_id: GV
    description: >
      Organizational teams document the risks and potential impacts of the AI
      technology they design, develop, deploy, evaluate, and use.
    status: active

  - id: GOVERN 4.3
    title: >
      Organizational practices are in place to enable AI testing, identification
      of incidents, and information sharing.
    category: "Govern 4"
    function: GOVERN
    function_id: GV
    description: >
      Organizational practices are in place to enable AI testing, identification
      of incidents, and information sharing.
    status: active

  # --- Govern 5: Engagement with relevant AI actors ---
  # Processes are in place for robust engagement with relevant AI actors.

  - id: GOVERN 5.1
    title: >
      Organizational policies and practices are in place to collect, consider,
      prioritize, and integrate feedback from those external to the team
      regarding potential individual and societal impacts.
    category: "Govern 5"
    function: GOVERN
    function_id: GV
    description: >
      Organizational policies and practices are in place to collect, consider,
      prioritize, and integrate feedback from those external to the team
      regarding potential individual and societal impacts.
    status: active

  - id: GOVERN 5.2
    title: >
      Mechanisms are established to enable the team that developed or deployed
      AI systems to regularly incorporate adjudicated feedback from relevant AI
      actors into system design and implementation.
    category: "Govern 5"
    function: GOVERN
    function_id: GV
    description: >
      Mechanisms are established to enable the team that developed or deployed
      AI systems to regularly incorporate adjudicated feedback from relevant AI
      actors into system design and implementation.
    status: active

  # --- Govern 6: Third-party and supply chain policies ---
  # Policies and procedures are in place to address AI risks and benefits
  # arising from third-party software and data and other supply chain issues.

  - id: GOVERN 6.1
    title: >
      Policies and procedures are in place that address AI risks associated with
      third-party entities, including risks of infringement.
    category: "Govern 6"
    function: GOVERN
    function_id: GV
    description: >
      Policies and procedures are in place that address AI risks associated with
      third-party entities, including risks of infringement.
    status: active

  - id: GOVERN 6.2
    title: >
      Contingency processes are in place to handle failures or incidents in
      third-party data or AI systems deemed to be high-risk.
    category: "Govern 6"
    function: GOVERN
    function_id: GV
    description: >
      Contingency processes are in place to handle failures or incidents in
      third-party data or AI systems deemed to be high-risk.
    status: active

  # ═══════════════════════════════════════════════════════════════════════════
  # FUNCTION: MAP (MP)
  # Purpose: Context is established and understood. Categorize AI risks in
  # context. Provides sufficient contextual knowledge to inform initial
  # go/no-go decisions about AI system design, development, or deployment.
  # ═══════════════════════════════════════════════════════════════════════════

  # --- Map 1: Context is established and understood ---

  - id: MAP 1.1
    title: >
      Intended purposes, potentially beneficial uses, context-specific laws,
      norms and expectations, and prospective settings in which the AI system
      will be deployed are understood and documented.
    category: "Map 1"
    function: MAP
    function_id: MP
    description: >
      Intended purposes, potentially beneficial uses, context-specific laws,
      norms and expectations, and prospective settings in which the AI system
      will be deployed are understood and documented.
    status: active

  - id: MAP 1.2
    title: >
      Interdisciplinary AI actors, competencies, skills, and capacities for
      establishing context reflect demographic diversity and broad domain and
      user experience expertise.
    category: "Map 1"
    function: MAP
    function_id: MP
    description: >
      Interdisciplinary AI actors, competencies, skills, and capacities for
      establishing context reflect demographic diversity and broad domain and
      user experience expertise.
    status: active

  - id: MAP 1.3
    title: >
      The organization's mission and relevant goals for AI technology are
      understood and documented.
    category: "Map 1"
    function: MAP
    function_id: MP
    description: >
      The organization's mission and relevant goals for AI technology are
      understood and documented.
    status: active

  - id: MAP 1.4
    title: >
      The business value or context of business use has been clearly defined or
      — in the case of assessing existing AI systems — re-evaluated.
    category: "Map 1"
    function: MAP
    function_id: MP
    description: >
      The business value or context of business use has been clearly defined or
      — in the case of assessing existing AI systems — re-evaluated.
    status: active

  - id: MAP 1.5
    title: >
      Organizational risk tolerances are determined and documented.
    category: "Map 1"
    function: MAP
    function_id: MP
    description: >
      Organizational risk tolerances are determined and documented.
    status: active

  - id: MAP 1.6
    title: >
      System requirements are elicited from and understood by relevant AI
      actors. Design decisions take socio-technical implications into account.
    category: "Map 1"
    function: MAP
    function_id: MP
    description: >
      System requirements are elicited from and understood by relevant AI
      actors. Design decisions take socio-technical implications into account.
    status: active

  # --- Map 2: Categorization of the AI system ---

  - id: MAP 2.1
    title: >
      The specific tasks and methods used to implement the tasks that the AI
      system will support are defined (e.g., classifiers, generative models,
      recommenders).
    category: "Map 2"
    function: MAP
    function_id: MP
    description: >
      The specific tasks and methods used to implement the tasks that the AI
      system will support are defined (e.g., classifiers, generative models,
      recommenders).
    status: active

  - id: MAP 2.2
    title: >
      Information about the AI system's knowledge limits and how system output
      may be utilized and overseen by humans is documented.
    category: "Map 2"
    function: MAP
    function_id: MP
    description: >
      Information about the AI system's knowledge limits and how system output
      may be utilized and overseen by humans is documented.
    status: active

  - id: MAP 2.3
    title: >
      Scientific integrity and TEVV considerations are identified and documented,
      including those related to experimental design, data collection and
      selection.
    category: "Map 2"
    function: MAP
    function_id: MP
    description: >
      Scientific integrity and TEVV considerations are identified and documented,
      including those related to experimental design, data collection and
      selection.
    status: active

  # --- Map 3: AI capabilities, targeted usage, goals, and expected benefits ---
  # AI capabilities, targeted usage, goals, and expected benefits and costs
  # compared with appropriate benchmarks are understood.

  - id: MAP 3.1
    title: >
      Potential benefits of intended AI system functionality and performance are
      examined and documented.
    category: "Map 3"
    function: MAP
    function_id: MP
    description: >
      Potential benefits of intended AI system functionality and performance are
      examined and documented.
    status: active

  - id: MAP 3.2
    title: >
      Potential costs, including non-monetary costs, which result from expected
      or realized AI errors or system functionality are examined and documented.
    category: "Map 3"
    function: MAP
    function_id: MP
    description: >
      Potential costs, including non-monetary costs, which result from expected
      or realized AI errors or system functionality are examined and documented.
    status: active

  - id: MAP 3.3
    title: >
      Targeted application scope is specified and documented based on the
      system's capability, established context, and AI system categorization.
    category: "Map 3"
    function: MAP
    function_id: MP
    description: >
      Targeted application scope is specified and documented based on the
      system's capability, established context, and AI system categorization.
    status: active

  - id: MAP 3.4
    title: >
      Processes for operator and practitioner proficiency with AI system
      performance and trustworthiness are defined, assessed, and documented.
    category: "Map 3"
    function: MAP
    function_id: MP
    description: >
      Processes for operator and practitioner proficiency with AI system
      performance and trustworthiness are defined, assessed, and documented.
    status: active

  - id: MAP 3.5
    title: >
      Processes for human oversight are defined, assessed, and documented in
      accordance with organizational policies.
    category: "Map 3"
    function: MAP
    function_id: MP
    description: >
      Processes for human oversight are defined, assessed, and documented in
      accordance with organizational policies.
    status: active

  # --- Map 4: Risks and benefits of AI components ---
  # Risks and benefits are mapped for all components of the AI system
  # including third-party software and data.

  - id: MAP 4.1
    title: >
      Approaches for mapping AI technology and legal risks of its components —
      including the use of third-party data or software — are in place,
      followed, and documented.
    category: "Map 4"
    function: MAP
    function_id: MP
    description: >
      Approaches for mapping AI technology and legal risks of its components —
      including the use of third-party data or software — are in place,
      followed, and documented.
    status: active

  - id: MAP 4.2
    title: >
      Internal risk controls for components of the AI system, including
      third-party AI technologies, are identified and documented.
    category: "Map 4"
    function: MAP
    function_id: MP
    description: >
      Internal risk controls for components of the AI system, including
      third-party AI technologies, are identified and documented.
    status: active

  # --- Map 5: Impacts are characterized ---
  # Impacts to individuals, groups, communities, organizations, and society
  # are characterized.

  - id: MAP 5.1
    title: >
      Likelihood and magnitude of each identified impact (both potentially
      beneficial and harmful) are identified and documented.
    category: "Map 5"
    function: MAP
    function_id: MP
    description: >
      Likelihood and magnitude of each identified impact (both potentially
      beneficial and harmful) are identified and documented.
    status: active

  - id: MAP 5.2
    title: >
      Practices and personnel for supporting regular engagement with relevant
      AI actors and integrating feedback about impacts are in place and
      documented.
    category: "Map 5"
    function: MAP
    function_id: MP
    description: >
      Practices and personnel for supporting regular engagement with relevant
      AI actors and integrating feedback about impacts are in place and
      documented.
    status: active

  # ═══════════════════════════════════════════════════════════════════════════
  # FUNCTION: MEASURE (MR)
  # Purpose: Risks are analyzed, assessed, and tracked. Employ quantitative,
  # qualitative, or mixed-method tools to analyze, assess, benchmark, and
  # monitor AI risk and related impacts.
  # ═══════════════════════════════════════════════════════════════════════════

  # --- Measure 1: Appropriate methods and metrics are identified and applied ---

  - id: MEASURE 1.1
    title: >
      Approaches and metrics for measurement of AI risks enumerated during the
      map function are selected for implementation starting with the most
      significant AI risks.
    category: "Measure 1"
    function: MEASURE
    function_id: MR
    description: >
      Approaches and metrics for measurement of AI risks enumerated during the
      map function are selected for implementation starting with the most
      significant AI risks.
    status: active

  - id: MEASURE 1.2
    title: >
      Appropriateness of AI metrics and effectiveness of existing controls are
      regularly assessed and updated, including reports of errors and potential
      impacts.
    category: "Measure 1"
    function: MEASURE
    function_id: MR
    description: >
      Appropriateness of AI metrics and effectiveness of existing controls are
      regularly assessed and updated, including reports of errors and potential
      impacts.
    status: active

  - id: MEASURE 1.3
    title: >
      Internal experts who did not serve as front-line developers and/or
      independent assessors are involved in regular assessments and updates.
    category: "Measure 1"
    function: MEASURE
    function_id: MR
    description: >
      Internal experts who did not serve as front-line developers and/or
      independent assessors are involved in regular assessments and updates.
    status: active

  # --- Measure 2: AI systems are evaluated for trustworthy characteristics ---

  - id: MEASURE 2.1
    title: >
      Test sets, metrics, and details about the tools used during TEVV are
      documented.
    category: "Measure 2"
    function: MEASURE
    function_id: MR
    description: >
      Test sets, metrics, and details about the tools used during TEVV
      (testing, evaluation, verification, and validation) are documented.
    status: active

  - id: MEASURE 2.2
    title: >
      Evaluations involving human subjects meet applicable requirements and are
      representative of the relevant population.
    category: "Measure 2"
    function: MEASURE
    function_id: MR
    description: >
      Evaluations involving human subjects meet applicable requirements and are
      representative of the relevant population.
    status: active

  - id: MEASURE 2.3
    title: >
      AI system performance or assurance criteria are measured qualitatively or
      quantitatively and demonstrated for conditions similar to deployment
      setting(s).
    category: "Measure 2"
    function: MEASURE
    function_id: MR
    description: >
      AI system performance or assurance criteria are measured qualitatively or
      quantitatively and demonstrated for conditions similar to deployment
      setting(s).
    status: active

  - id: MEASURE 2.4
    title: >
      The functionality and behavior of the AI system and its components are
      monitored when in production.
    category: "Measure 2"
    function: MEASURE
    function_id: MR
    description: >
      The functionality and behavior of the AI system and its components are
      monitored when in production.
    status: active

  - id: MEASURE 2.5
    title: >
      The AI system to be deployed is demonstrated to be valid and reliable.
      Limitations of the generalizability beyond the conditions under which the
      technology was developed are documented.
    category: "Measure 2"
    function: MEASURE
    function_id: MR
    description: >
      The AI system to be deployed is demonstrated to be valid and reliable.
      Limitations of the generalizability beyond the conditions under which the
      technology was developed are documented.
    status: active

  - id: MEASURE 2.6
    title: >
      The AI system is evaluated regularly for safety risks. The AI system to
      be deployed is demonstrated to be safe, its residual negative risk does
      not exceed the risk tolerance.
    category: "Measure 2"
    function: MEASURE
    function_id: MR
    description: >
      The AI system is evaluated regularly for safety risks. The AI system to
      be deployed is demonstrated to be safe, its residual negative risk does
      not exceed the risk tolerance.
    status: active

  - id: MEASURE 2.7
    title: >
      AI system security and resilience are evaluated and documented.
    category: "Measure 2"
    function: MEASURE
    function_id: MR
    description: >
      AI system security and resilience are evaluated and documented.
    status: active

  - id: MEASURE 2.8
    title: >
      Risks associated with transparency and accountability are examined and
      documented.
    category: "Measure 2"
    function: MEASURE
    function_id: MR
    description: >
      Risks associated with transparency and accountability are examined and
      documented.
    status: active

  - id: MEASURE 2.9
    title: >
      The AI model is explained, validated, and documented, and AI system
      output is interpreted within its context.
    category: "Measure 2"
    function: MEASURE
    function_id: MR
    description: >
      The AI model is explained, validated, and documented, and AI system
      output is interpreted within its context.
    status: active

  - id: MEASURE 2.10
    title: >
      Privacy risk of the AI system is examined and documented.
    category: "Measure 2"
    function: MEASURE
    function_id: MR
    description: >
      Privacy risk of the AI system is examined and documented.
    status: active

  - id: MEASURE 2.11
    title: >
      Fairness and bias are evaluated and results are documented.
    category: "Measure 2"
    function: MEASURE
    function_id: MR
    description: >
      Fairness and bias are evaluated and results are documented.
    status: active

  - id: MEASURE 2.12
    title: >
      Environmental impact and sustainability of AI model training and
      management activities are assessed and documented.
    category: "Measure 2"
    function: MEASURE
    function_id: MR
    description: >
      Environmental impact and sustainability of AI model training and
      management activities are assessed and documented.
    status: active

  - id: MEASURE 2.13
    title: >
      Effectiveness of the employed TEVV metrics and processes in the measure
      function are evaluated and documented.
    category: "Measure 2"
    function: MEASURE
    function_id: MR
    description: >
      Effectiveness of the employed TEVV metrics and processes in the measure
      function are evaluated and documented.
    status: active

  # --- Measure 3: Risk tracking mechanisms ---
  # Mechanisms for tracking identified AI risks over time are in place.

  - id: MEASURE 3.1
    title: >
      Approaches, personnel, and documentation are in place to regularly
      identify and track existing, unanticipated, and emergent AI risks.
    category: "Measure 3"
    function: MEASURE
    function_id: MR
    description: >
      Approaches, personnel, and documentation are in place to regularly
      identify and track existing, unanticipated, and emergent AI risks.
    status: active

  - id: MEASURE 3.2
    title: >
      Risk tracking approaches are considered for settings where AI risks are
      difficult to assess using currently available measurement techniques.
    category: "Measure 3"
    function: MEASURE
    function_id: MR
    description: >
      Risk tracking approaches are considered for settings where AI risks are
      difficult to assess using currently available measurement techniques.
    status: active

  - id: MEASURE 3.3
    title: >
      Feedback processes for end users and impacted communities to report
      problems and appeal system outcomes are established and integrated.
    category: "Measure 3"
    function: MEASURE
    function_id: MR
    description: >
      Feedback processes for end users and impacted communities to report
      problems and appeal system outcomes are established and integrated.
    status: active

  # --- Measure 4: Feedback about efficacy of measurement ---
  # Feedback about efficacy of measurement is gathered and assessed.

  - id: MEASURE 4.1
    title: >
      Measurement approaches for identifying AI risks are connected to
      deployment context(s) and informed through consultation with domain
      experts and other end users.
    category: "Measure 4"
    function: MEASURE
    function_id: MR
    description: >
      Measurement approaches for identifying AI risks are connected to
      deployment context(s) and informed through consultation with domain
      experts and other end users.
    status: active

  - id: MEASURE 4.2
    title: >
      Measurement results regarding AI system trustworthiness in deployment
      context(s) are informed by input from domain experts and relevant AI
      actors.
    category: "Measure 4"
    function: MEASURE
    function_id: MR
    description: >
      Measurement results regarding AI system trustworthiness in deployment
      context(s) are informed by input from domain experts and relevant AI
      actors.
    status: active

  - id: MEASURE 4.3
    title: >
      Measurable performance improvements or declines based on consultations
      with relevant AI actors are identified and documented.
    category: "Measure 4"
    function: MEASURE
    function_id: MR
    description: >
      Measurable performance improvements or declines based on consultations
      with relevant AI actors are identified and documented.
    status: active

  # ═══════════════════════════════════════════════════════════════════════════
  # FUNCTION: MANAGE (MG)
  # Purpose: Risks are prioritized, responded to, and monitored. Allocate risk
  # resources, plan risk treatments, respond to and recover from incidents.
  # ═══════════════════════════════════════════════════════════════════════════

  # --- Manage 1: AI risks are prioritized, responded to, and managed ---
  # AI risks based on assessments and other analytical output from the MAP and
  # MEASURE functions are prioritized, responded to, and managed.

  - id: MANAGE 1.1
    title: >
      A determination is made as to whether the AI system achieves its intended
      purposes and stated objectives and whether its development or deployment
      should proceed.
    category: "Manage 1"
    function: MANAGE
    function_id: MG
    description: >
      A determination is made as to whether the AI system achieves its intended
      purposes and stated objectives and whether its development or deployment
      should proceed.
    status: active

  - id: MANAGE 1.2
    title: >
      Treatment of documented AI risks is prioritized based on impact,
      likelihood, and available resources or methods.
    category: "Manage 1"
    function: MANAGE
    function_id: MG
    description: >
      Treatment of documented AI risks is prioritized based on impact,
      likelihood, and available resources or methods.
