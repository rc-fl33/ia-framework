# HIPAA Security Rule Controls
# Source: 45 CFR Part 164, Subpart C
# Authority: U.S. Department of Health and Human Services (HHS)
# Version: As amended by Omnibus Rule (January 25, 2013)
# Last Updated: 2026-02-13
#
# References:
#   - eCFR: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-C/part-164/subpart-C
#   - HHS Summary: https://www.hhs.gov/hipaa/for-professionals/security/laws-regulations/index.html
#   - Cornell LII: https://www.law.cornell.edu/cfr/text/45/part-164/subpart-C
#
# Status values:
#   "required"    - Must be implemented as specified
#   "addressable" - Must be assessed; implement if reasonable/appropriate,
#                   or document rationale and implement equivalent alternative
#
# Note: "Addressable" does NOT mean optional under HIPAA. The covered entity
#       must assess whether the specification is reasonable and appropriate.
#       If yes, implement it. If not, document why and implement an equivalent
#       alternative measure if reasonable and appropriate.
#
# Structure: Each control is either a standalone standard (no child specs)
#   or an implementation specification. Parent standards that have child
#   implementation specifications are represented by their children.

metadata:
  framework: "HIPAA Security Rule"
  version: "45 CFR Part 164, Subpart C"
  release_date: "2013-01-25"
  official_url: "https://www.hhs.gov/hipaa/for-professionals/security/"
  reference_document: "45 CFR 164.308, 164.310, 164.312, 164.316"

functions:
  - id: ADMINISTRATIVE
    name: ADMINISTRATIVE_SAFEGUARDS
    description: "Administrative actions, policies, and procedures to manage the selection, development, implementation, and maintenance of security measures to protect ePHI (45 CFR 164.308)"

  - id: PHYSICAL
    name: PHYSICAL_SAFEGUARDS
    description: "Physical measures, policies, and procedures to protect electronic information systems and related buildings and equipment from natural and environmental hazards and unauthorized intrusion (45 CFR 164.310)"

  - id: TECHNICAL
    name: TECHNICAL_SAFEGUARDS
    description: "Technology and the policies and procedures for its use that protect ePHI and control access to it (45 CFR 164.312)"

  - id: DOCUMENTATION
    name: POLICIES_AND_DOCUMENTATION
    description: "Requirements for maintaining policies, procedures, and documentation records in written or electronic form (45 CFR 164.316)"

  - id: ORGANIZATIONAL
    name: ORGANIZATIONAL_REQUIREMENTS
    description: "Requirements for business associate contracts and group health plan provisions (45 CFR 164.314)"

controls:

  # ═══════════════════════════════════════════════════════════════════════════
  # ADMINISTRATIVE SAFEGUARDS - 45 CFR 164.308 (23 controls)
  # ═══════════════════════════════════════════════════════════════════════════

  # --- 164.308(a)(1) Security Management Process ---
  # Standard: Implement policies and procedures to prevent, detect, contain,
  # and correct security violations.

  - id: "164.308(a)(1)(ii)(A)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Security Management Process
    title: "Risk analysis conducted"
    description: "Conduct an accurate and thorough assessment of the potential risks and vulnerabilities to the confidentiality, integrity, and availability of ePHI held by the covered entity or business associate."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  - id: "164.308(a)(1)(ii)(B)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Security Management Process
    title: "Risk management measures implemented"
    description: "Implement security measures sufficient to reduce risks and vulnerabilities to a reasonable and appropriate level to comply with 164.306(a)."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  - id: "164.308(a)(1)(ii)(C)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Security Management Process
    title: "Sanction policy applied to workforce violations"
    description: "Apply appropriate sanctions against workforce members who fail to comply with the security policies and procedures of the covered entity or business associate."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  - id: "164.308(a)(1)(ii)(D)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Security Management Process
    title: "Information system activity review performed"
    description: "Implement procedures to regularly review records of information system activity, such as audit logs, access reports, and security incident tracking reports."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  # --- 164.308(a)(2) Assigned Security Responsibility ---
  # Standard with no separate implementation specifications.

  - id: "164.308(a)(2)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Assigned Security Responsibility
    title: "Security official designated"
    description: "Identify the security official who is responsible for the development and implementation of the policies and procedures required by this subpart for the covered entity or business associate."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  # --- 164.308(a)(3) Workforce Security ---
  # Standard: Implement policies and procedures to ensure that all members of
  # the workforce have appropriate access to ePHI, and to prevent those who
  # do not have access from obtaining access.

  - id: "164.308(a)(3)(ii)(A)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Workforce Security
    title: "Workforce authorization and supervision procedures implemented"
    description: "Implement procedures for the authorization and/or supervision of workforce members who work with ePHI or in locations where it might be accessed."
    hipaa_safeguard: administrative
    status: addressable
    frequency: Annual

  - id: "164.308(a)(3)(ii)(B)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Workforce Security
    title: "Workforce clearance procedures implemented"
    description: "Implement procedures to determine that the access of a workforce member to ePHI is appropriate."
    hipaa_safeguard: administrative
    status: addressable
    frequency: Annual

  - id: "164.308(a)(3)(ii)(C)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Workforce Security
    title: "Termination procedures implemented"
    description: "Implement procedures for terminating access to ePHI when the employment of, or other arrangement with, a workforce member ends or as required by determinations made as specified under this standard."
    hipaa_safeguard: administrative
    status: addressable
    frequency: Annual

  # --- 164.308(a)(4) Information Access Management ---
  # Standard: Implement policies and procedures for authorizing access to ePHI
  # that are consistent with the applicable requirements of subpart E.

  - id: "164.308(a)(4)(ii)(A)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Information Access Management
    title: "Healthcare clearinghouse functions isolated"
    description: "If a health care clearinghouse is part of a larger organization, the clearinghouse must implement policies and procedures that protect the ePHI of the clearinghouse from unauthorized access by the larger organization."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  - id: "164.308(a)(4)(ii)(B)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Information Access Management
    title: "Access authorization policies implemented"
    description: "Implement policies and procedures for granting access to ePHI, for example, through access to a workstation, transaction, program, process, or other mechanism."
    hipaa_safeguard: administrative
    status: addressable
    frequency: Annual

  - id: "164.308(a)(4)(ii)(C)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Information Access Management
    title: "Access establishment and modification procedures implemented"
    description: "Implement policies and procedures that, based upon the covered entity's or business associate's access authorization policies, establish, document, review, and modify a user's right of access to a workstation, transaction, program, or process."
    hipaa_safeguard: administrative
    status: addressable
    frequency: Annual

  # --- 164.308(a)(5) Security Awareness and Training ---
  # Standard: Implement a security awareness and training program for all
  # members of the workforce, including management.

  - id: "164.308(a)(5)(ii)(A)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Security Awareness and Training
    title: "Security reminders provided"
    description: "Provide periodic security updates and reminders to the workforce."
    hipaa_safeguard: administrative
    status: addressable
    frequency: Annual

  - id: "164.308(a)(5)(ii)(B)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Security Awareness and Training
    title: "Protection from malicious software addressed"
    description: "Implement procedures for guarding against, detecting, and reporting malicious software."
    hipaa_safeguard: administrative
    status: addressable
    frequency: Annual

  - id: "164.308(a)(5)(ii)(C)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Security Awareness and Training
    title: "Log-in monitoring procedures implemented"
    description: "Implement procedures for monitoring log-in attempts and reporting discrepancies."
    hipaa_safeguard: administrative
    status: addressable
    frequency: Annual

  - id: "164.308(a)(5)(ii)(D)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Security Awareness and Training
    title: "Password management procedures implemented"
    description: "Implement procedures for creating, changing, and safeguarding passwords."
    hipaa_safeguard: administrative
    status: addressable
    frequency: Annual

  # --- 164.308(a)(6) Security Incident Procedures ---
  # Standard: Implement policies and procedures to address security incidents.

  - id: "164.308(a)(6)(ii)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Security Incident Procedures
    title: "Incident response and reporting procedures implemented"
    description: "Identify and respond to suspected or known security incidents; mitigate, to the extent practicable, harmful effects of security incidents that are known to the covered entity or business associate; and document security incidents and their outcomes."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  # --- 164.308(a)(7) Contingency Plan ---
  # Standard: Establish and implement as needed policies and procedures for
  # responding to an emergency or other occurrence that damages systems
  # containing ePHI.

  - id: "164.308(a)(7)(ii)(A)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Contingency Plan
    title: "Data backup plan established"
    description: "Establish and implement procedures to create and maintain retrievable exact copies of ePHI."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  - id: "164.308(a)(7)(ii)(B)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Contingency Plan
    title: "Disaster recovery plan established"
    description: "Establish and implement as needed procedures to restore any loss of data."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  - id: "164.308(a)(7)(ii)(C)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Contingency Plan
    title: "Emergency mode operation plan established"
    description: "Establish and implement as needed procedures to enable continuation of critical business processes for protection of the security of ePHI while operating in emergency mode."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  - id: "164.308(a)(7)(ii)(D)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Contingency Plan
    title: "Contingency plan testing and revision performed"
    description: "Implement procedures for periodic testing and revision of contingency plans."
    hipaa_safeguard: administrative
    status: addressable
    frequency: Annual

  - id: "164.308(a)(7)(ii)(E)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Contingency Plan
    title: "Applications and data criticality analysis performed"
    description: "Assess the relative criticality of specific applications and data in support of other contingency plan components."
    hipaa_safeguard: administrative
    status: addressable
    frequency: Annual

  # --- 164.308(a)(8) Evaluation ---
  # Standard with no separate implementation specifications.

  - id: "164.308(a)(8)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Evaluation
    title: "Periodic security evaluation performed"
    description: "Perform a periodic technical and nontechnical evaluation, based initially upon the standards implemented under this rule and, subsequently, in response to environmental or operational changes affecting the security of ePHI, that establishes the extent to which the entity's security policies and procedures meet the requirements of this subpart."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  # --- 164.308(b) Business Associate Contracts and Other Arrangements ---
  # Standard: A covered entity may permit a business associate to create,
  # receive, maintain, or transmit ePHI only with satisfactory assurances.

  - id: "164.308(b)(4)"
    function: ADMINISTRATIVE_SAFEGUARDS
    category: Business Associate Contracts
    title: "Written business associate contract or arrangement documented"
    description: "Document the satisfactory assurances required through a written contract or other arrangement with the business associate that meets the applicable requirements of 164.314(a). A covered entity is not in compliance if it knew of a pattern or practice of the business associate that constituted a material breach or violation and failed to take reasonable steps to cure or end the violation."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  # ═══════════════════════════════════════════════════════════════════════════
  # PHYSICAL SAFEGUARDS - 45 CFR 164.310 (10 controls)
  # ═══════════════════════════════════════════════════════════════════════════

  # --- 164.310(a)(1) Facility Access Controls ---
  # Standard: Implement policies and procedures to limit physical access to
  # electronic information systems and the facilities in which they are housed,
  # while ensuring properly authorized access is allowed.

  - id: "164.310(a)(2)(i)"
    function: PHYSICAL_SAFEGUARDS
    category: Facility Access Controls
    title: "Contingency operations facility access procedures established"
    description: "Establish and implement as needed procedures that allow facility access in support of restoration of lost data under the disaster recovery plan and emergency mode operations plan in the event of an emergency."
    hipaa_safeguard: physical
    status: addressable
    frequency: Annual

  - id: "164.310(a)(2)(ii)"
    function: PHYSICAL_SAFEGUARDS
    category: Facility Access Controls
    title: "Facility security plan implemented"
    description: "Implement policies and procedures to safeguard the facility and the equipment therein from unauthorized physical access, tampering, and theft."
    hipaa_safeguard: physical
    status: addressable
    frequency: Annual

  - id: "164.310(a)(2)(iii)"
    function: PHYSICAL_SAFEGUARDS
    category: Facility Access Controls
    title: "Access control and validation procedures implemented"
    description: "Implement procedures to control and validate a person's access to facilities based on their role or function, including visitor control, and control of access to software programs for testing and revision."
    hipaa_safeguard: physical
    status: addressable
    frequency: Annual

  - id: "164.310(a)(2)(iv)"
    function: PHYSICAL_SAFEGUARDS
    category: Facility Access Controls
    title: "Maintenance records documented"
    description: "Implement policies and procedures to document repairs and modifications to the physical components of a facility which are related to security, such as hardware, walls, doors, and locks."
    hipaa_safeguard: physical
    status: addressable
    frequency: Annual

  # --- 164.310(b) Workstation Use ---
  # Standard with no separate implementation specifications.

  - id: "164.310(b)"
    function: PHYSICAL_SAFEGUARDS
    category: Workstation Use
    title: "Workstation use policies established"
    description: "Implement policies and procedures that specify the proper functions to be performed, the manner in which those functions are to be performed, and the physical attributes of the surroundings of a specific workstation or class of workstation that can access ePHI."
    hipaa_safeguard: physical
    status: required
    frequency: Annual

  # --- 164.310(c) Workstation Security ---
  # Standard with no separate implementation specifications.

  - id: "164.310(c)"
    function: PHYSICAL_SAFEGUARDS
    category: Workstation Security
    title: "Workstation security safeguards implemented"
    description: "Implement physical safeguards for all workstations that access ePHI, to restrict access to authorized users."
    hipaa_safeguard: physical
    status: required
    frequency: Annual

  # --- 164.310(d)(1) Device and Media Controls ---
  # Standard: Implement policies and procedures that govern the receipt and
  # removal of hardware and electronic media containing ePHI into/out of a
  # facility, and the movement of these items within the facility.

  - id: "164.310(d)(2)(i)"
    function: PHYSICAL_SAFEGUARDS
    category: Device and Media Controls
    title: "ePHI disposal procedures implemented"
    description: "Implement policies and procedures to address the final disposition of ePHI, and/or the hardware or electronic media on which it is stored."
    hipaa_safeguard: physical
    status: required
    frequency: Annual

  - id: "164.310(d)(2)(ii)"
    function: PHYSICAL_SAFEGUARDS
    category: Device and Media Controls
    title: "Media re-use procedures implemented"
    description: "Implement procedures for removal of ePHI from electronic media before the media are made available for re-use."
    hipaa_safeguard: physical
    status: required
    frequency: Annual

  - id: "164.310(d)(2)(iii)"
    function: PHYSICAL_SAFEGUARDS
    category: Device and Media Controls
    title: "Device and media accountability maintained"
    description: "Maintain a record of the movements of hardware and electronic media and any person responsible therefore."
    hipaa_safeguard: physical
    status: addressable
    frequency: Annual

  - id: "164.310(d)(2)(iv)"
    function: PHYSICAL_SAFEGUARDS
    category: Device and Media Controls
    title: "Data backup and storage before equipment movement performed"
    description: "Create a retrievable, exact copy of ePHI, when needed, before movement of equipment."
    hipaa_safeguard: physical
    status: addressable
    frequency: Annual

  # ═══════════════════════════════════════════════════════════════════════════
  # TECHNICAL SAFEGUARDS - 45 CFR 164.312 (9 controls)
  # ═══════════════════════════════════════════════════════════════════════════

  # --- 164.312(a)(1) Access Control ---
  # Standard: Implement technical policies and procedures for electronic
  # information systems that maintain ePHI to allow access only to those
  # persons or software programs granted access rights per 164.308(a)(4).

  - id: "164.312(a)(2)(i)"
    function: TECHNICAL_SAFEGUARDS
    category: Access Control
    title: "Unique user identification assigned"
    description: "Assign a unique name and/or number for identifying and tracking user identity."
    hipaa_safeguard: technical
    status: required
    frequency: Annual

  - id: "164.312(a)(2)(ii)"
    function: TECHNICAL_SAFEGUARDS
    category: Access Control
    title: "Emergency access procedure established"
    description: "Establish and implement as needed procedures for obtaining necessary ePHI during an emergency."
    hipaa_safeguard: technical
    status: required
    frequency: Annual

  - id: "164.312(a)(2)(iii)"
    function: TECHNICAL_SAFEGUARDS
    category: Access Control
    title: "Automatic logoff implemented"
    description: "Implement electronic procedures that terminate an electronic session after a predetermined time of inactivity."
    hipaa_safeguard: technical
    status: addressable
    frequency: Annual

  - id: "164.312(a)(2)(iv)"
    function: TECHNICAL_SAFEGUARDS
    category: Access Control
    title: "Encryption and decryption of ePHI implemented"
    description: "Implement a mechanism to encrypt and decrypt electronic protected health information."
    hipaa_safeguard: technical
    status: addressable
    frequency: Annual

  # --- 164.312(b) Audit Controls ---
  # Standard with no separate implementation specifications.

  - id: "164.312(b)"
    function: TECHNICAL_SAFEGUARDS
    category: Audit Controls
    title: "Audit controls implemented"
    description: "Implement hardware, software, and/or procedural mechanisms that record and examine activity in information systems that contain or use ePHI."
    hipaa_safeguard: technical
    status: required
    frequency: Annual

  # --- 164.312(c)(1) Integrity ---
  # Standard: Implement policies and procedures to protect ePHI from
  # improper alteration or destruction.

  - id: "164.312(c)(2)"
    function: TECHNICAL_SAFEGUARDS
    category: Integrity
    title: "ePHI authentication mechanism implemented"
    description: "Implement electronic mechanisms to corroborate that ePHI has not been altered or destroyed in an unauthorized manner."
    hipaa_safeguard: technical
    status: addressable
    frequency: Annual

  # --- 164.312(d) Person or Entity Authentication ---
  # Standard with no separate implementation specifications.

  - id: "164.312(d)"
    function: TECHNICAL_SAFEGUARDS
    category: Person or Entity Authentication
    title: "Person or entity authentication implemented"
    description: "Implement procedures to verify that a person or entity seeking access to ePHI is the one claimed."
    hipaa_safeguard: technical
    status: required
    frequency: Annual

  # --- 164.312(e)(1) Transmission Security ---
  # Standard: Implement technical security measures to guard against
  # unauthorized access to ePHI transmitted over an electronic
  # communications network.

  - id: "164.312(e)(2)(i)"
    function: TECHNICAL_SAFEGUARDS
    category: Transmission Security
    title: "Transmission integrity controls implemented"
    description: "Implement security measures to ensure that electronically transmitted ePHI is not improperly modified without detection until disposed of."
    hipaa_safeguard: technical
    status: addressable
    frequency: Annual

  - id: "164.312(e)(2)(ii)"
    function: TECHNICAL_SAFEGUARDS
    category: Transmission Security
    title: "Transmission encryption implemented"
    description: "Implement a mechanism to encrypt electronic protected health information whenever deemed appropriate."
    hipaa_safeguard: technical
    status: addressable
    frequency: Annual

  # ═══════════════════════════════════════════════════════════════════════════
  # ORGANIZATIONAL REQUIREMENTS - 45 CFR 164.314 (9 controls)
  # ═══════════════════════════════════════════════════════════════════════════

  # --- 164.314(a)(2) Business Associate Contracts ---
  # Standard: A covered entity may permit a business associate to create,
  # receive, maintain, or transmit ePHI only with satisfactory assurances.

  - id: "164.314(a)(2)(i)(A)"
    function: ORGANIZATIONAL_REQUIREMENTS
    category: Business Associate Contracts
    title: "BA compliance with subpart C"
    description: "The contract must provide that the business associate will comply with the applicable requirements of this subpart."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  - id: "164.314(a)(2)(i)(B)"
    function: ORGANIZATIONAL_REQUIREMENTS
    category: Business Associate Contracts
    title: "Subcontractor compliance"
    description: "The contract must provide that the business associate will ensure that any subcontractors that create, receive, maintain, or transmit ePHI on behalf of the business associate agree to comply with the applicable requirements of this subpart."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  - id: "164.314(a)(2)(i)(C)"
    function: ORGANIZATIONAL_REQUIREMENTS
    category: Business Associate Contracts
    title: "BA incident reporting"
    description: "The contract must provide that the business associate will report to the covered entity any security incident of which it becomes aware, including breaches of unsecured protected health information."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  - id: "164.314(a)(2)(ii)"
    function: ORGANIZATIONAL_REQUIREMENTS
    category: Business Associate Contracts
    title: "Other arrangements"
    description: "The covered entity is in compliance if it has another arrangement in place that meets the requirements of 164.504(e)(3)."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  - id: "164.314(a)(2)(iii)"
    function: ORGANIZATIONAL_REQUIREMENTS
    category: Business Associate Contracts
    title: "Subcontractor BAA requirements"
    description: "The requirements of paragraphs (a)(2)(i) and (a)(2)(ii) apply to contracts between business associates and subcontractors in the same manner as such requirements apply to contracts between covered entities and business associates."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  # --- 164.314(b)(2) Group Health Plans ---
  # Standard: The Secretary may find that a group health plan is not in compliance
  # with the security standards if the plan fails to comply with the requirements.

  - id: "164.314(b)(2)(i)"
    function: ORGANIZATIONAL_REQUIREMENTS
    category: Group Health Plans
    title: "Plan sponsor safeguards"
    description: "The plan documents must require the plan sponsor to implement administrative, physical, and technical safeguards that reasonably and appropriately protect the confidentiality, integrity, and availability of the electronic protected health information."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  - id: "164.314(b)(2)(ii)"
    function: ORGANIZATIONAL_REQUIREMENTS
    category: Group Health Plans
    title: "Adequate separation supported"
    description: "The plan documents must require the plan sponsor to ensure that the adequate separation required by 164.504(f)(2)(iii) is supported by reasonable and appropriate security measures."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  - id: "164.314(b)(2)(iii)"
    function: ORGANIZATIONAL_REQUIREMENTS
    category: Group Health Plans
    title: "Agent security measures"
    description: "The plan documents must require the plan sponsor to ensure that any agent to whom it provides this information agrees to implement reasonable and appropriate security measures to protect the information."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  - id: "164.314(b)(2)(iv)"
    function: ORGANIZATIONAL_REQUIREMENTS
    category: Group Health Plans
    title: "Agent incident reporting"
    description: "The plan documents must require the plan sponsor to report to the group health plan any security incident of which it becomes aware."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  # ═══════════════════════════════════════════════════════════════════════════
  # POLICIES AND DOCUMENTATION - 45 CFR 164.316 (4 controls)
  # ═══════════════════════════════════════════════════════════════════════════

  # --- 164.316(a) Policies and Procedures ---
  # Standard with no separate implementation specifications.

  - id: "164.316(a)"
    function: POLICIES_AND_DOCUMENTATION
    category: Policies and Procedures
    title: "Security policies and procedures implemented"
    description: "Implement reasonable and appropriate policies and procedures to comply with the standards, implementation specifications, or other requirements of this subpart, taking into account the factors specified in 164.306(b)(2). This standard is not to be construed to permit or excuse an action that violates any other standard, implementation specification, or other requirement."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  # --- 164.316(b) Documentation ---
  # Standard: Maintain policies, procedures, and records of actions,
  # activities, and assessments in written (which may be electronic) form.

  - id: "164.316(b)(2)(i)"
    function: POLICIES_AND_DOCUMENTATION
    category: Documentation
    title: "Documentation retention for six years enforced"
    description: "Retain the documentation required by 164.316(b)(1) for 6 years from the date of its creation or the date when it last was in effect, whichever is later."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  - id: "164.316(b)(2)(ii)"
    function: POLICIES_AND_DOCUMENTATION
    category: Documentation
    title: "Documentation availability to responsible persons ensured"
    description: "Make documentation available to those persons responsible for implementing the procedures to which the documentation pertains."
    hipaa_safeguard: administrative
    status: required
    frequency: Annual

  - id: "164.316(b)(2)(iii)"
    function: POLICIES_AND_DOCUMENTATION
    category: Documentation
    title: "Documentation reviewed and updated periodically"
    description: "Review documentation periodically, and update as needed, in response to environmental or operational changes affecting the security of the ePHI."
    hipaa_safeguard: administrative
    status: required
