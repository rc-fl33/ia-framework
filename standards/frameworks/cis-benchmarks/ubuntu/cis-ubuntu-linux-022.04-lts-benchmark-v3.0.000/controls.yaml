      Uncomplicated Firewall (UFW) is the recommended utility and is used in guidance
      provided in the following recommendations.
      UFW is a user-friendly frontend firewall utility. It uses configurable default policies, and
      allows administrators to create specific rules to permit or deny connections based on
      applications, ports, or IP addresses. You can enable the firewall, view its status, and
      manage rules using...
