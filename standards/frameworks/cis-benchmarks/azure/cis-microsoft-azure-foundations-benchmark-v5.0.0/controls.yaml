  - id: "1"
    title: "Introduction"
    type: clause
    clause_ref: "1"
    status: draft
    content: |
      This introduction section and the subsections herein provide informative articles which
      instruct on the use of the CIS Foundations and Service Category Benchmarks. No
      recommendations will be found in this section, just articles of relevant information.
      Please carefully review the articles in this introductory section and orient yourself with
      our structured approach to Benchmarking for Cloud Service Providers (CSPs). This
      approach differs from other CIS Benchmarks because:
      • there are too many...
  - id: "1.1"
    title: "CIS Microsoft Azure Foundations Benchmarks"
    type: subclause
    clause_ref: "1.1"
    status: draft
    content: |
      The suggested approach for securing your Microsoft Azure cloud environment is to start
      with the latest version of the CIS Microsoft Azure Foundations Benchmark. Because
      CSP environments are constantly changing, previous versions of the Foundations
      Benchmarks should not be used. Previous releases may contain incorrect product
      names, outdated procedures, deprecated features, and other inaccuracies. The CIS
      Foundations Benchmark provides prescriptive guidance for configuring a subset of
      Microsoft...
  - id: "1.2"
    title: "CIS Microsoft Azure Service Category Benchmarks"
    type: subclause
    clause_ref: "1.2"
    status: draft
    content: |
      After configuring your environment with the CIS Microsoft Azure Foundations
      Benchmark, we suggest pursuing defense-in-depth and service-specific
      recommendations for your Azure Services by reviewing the Service Category
      Benchmarks. The Service Category Benchmarks are being produced with the vision
      that recommendations for all security-relevant products/services offered by a CSP
      should have a 'home,' but the Foundations Benchmarks should retain the most crucial
      recommendations and not be made...
  - id: "1.3"
    title: "Multiple Methods of Audit and Remediation"
    type: subclause
    clause_ref: "1.3"
    status: draft
    content: |
      Throughout the Benchmark, Audit and Remediation procedures are prescribed using up
      to five different methods. These multiple methods are presented for the convenience of
      readers who will be coming from different technical and experiential backgrounds. To
      perform any given Audit or Remediation, only one method needs to be performed. Not
      every method is available for every recommendation, and many that are available are
      not yet written for every recommendation. The methods presented in the...
  - id: "1.4"
    title: "Automating with Azure Policy"
    type: subclause
    clause_ref: "1.4"
    status: draft
    content: |
      Azure Policy provides built-in objects ("Policy Definitions") and a platform for "Policy as
      Code" that can be used to evaluate and/or enforce configuration states for individual
      resources or groups of resources. Where a relevant Azure Policy Definition or multiple
      Policy Definitions have been identified as applicable to a recommendation in this
      Benchmark, the Policy ID(s) and associated Policy Name will be listed in the "From
      Azure Policy" method header.
      Interfacing with Azure Policy can be...
  - id: "2"
    title: "Analytics Services"
    type: clause
    clause_ref: "2"
    status: draft
    content: |
      To better understand the relationship between the Foundations Benchmark and
      Services Benchmarks, please read the "Introduction" section of this document.
      Azure Product Directory Reference: https://azure.microsoft.com/en-
      us/products#analytics
