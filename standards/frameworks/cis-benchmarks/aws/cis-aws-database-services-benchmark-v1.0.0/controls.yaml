    title: "Introduction"
    type: clause
    clause_ref: "1"
    status: draft
    content: |
      Benchmark Approach:
      The suggested approach for securing your cloud environment is to start with the CIS
      Amazon Web Services Foundations Benchmark found here:
      https://www.cisecurity.org/benchmark/amazon_web_services/. The CIS Foundations
      benchmark provides prescriptive guidance for configuring a subset of Amazon Web
      Services with an emphasis on foundational, testable, and architecture agnostic settings
      including:
      • AWS Identity and Access Management (IAM)
      • AWS Config
      • AWS CloudTrail
      • AWS...
  - id: "2"
    title: "Amazon Aurora"
    type: clause
    clause_ref: "2"
    status: draft
    content: |
      Amazon Aurora is a relational database service provided by Amazon Web Services
      (AWS) that is designed for high performance, availability, and scalability. It is compatible
      with MySQL and PostgreSQL, which means you can use existing MySQL or
      PostgreSQL applications, drivers, and tools with Aurora with minimal modification.
      Page 14
