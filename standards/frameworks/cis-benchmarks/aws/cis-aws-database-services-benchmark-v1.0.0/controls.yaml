  - id: "12.2"
    title: "Establish and Maintain a Secure Network"
    type: subclause
    clause_ref: "12.2"
    status: draft
    content: |
      Architecture
      v8
      Establish and maintain a secure network architecture. A secure network
      ● ●
      architecture must address segmentation, least privilege, and availability, at a
      minimum.
  - id: "11.7"
    title: "Manage Network Infrastructure Through a Dedicated"
    type: subclause
    clause_ref: "11.7"
    status: draft
    content: |
      Network
      v7 Manage the network infrastructure across network connections that are ● ●
      separated from the business use of that network, relying on separate VLANs or,
      preferably, on entirely different physical connectivity for management sessions for
      network devices.
      Page 16
  - id: "2.2"
    title: "Ensure the Use of Security Groups (Manual)"
    type: subclause
    clause_ref: "2.2"
    status: draft
    content: |
      Profile Applicability:
      • Level 1
      Description:
      Security groups act as a firewall for associated Amazon RDS DB instances, controlling
      both inbound and outbound traffic. Here is a step-by-step guide on how to create and
      use Security Groups for an Amazon Aurora instance:
      Rationale:
      Creating your severity group either inbound or outbound rules. Inbound rules allow an
      individual to create a rule that permits the traffic to go to a specific port depending on
      which source it’s coming from. Outbound...
  - id: "3.3"
    title: "Configure Data Access Control Lists"
    type: subclause
    clause_ref: "3.3"
    status: draft
    content: |
      v8 Configure data access control lists based on a user’s need to know. Apply data ● ● ●
      access control lists, also known as access permissions, to local and remote file
      systems, databases, and applications.
  - id: "14.6"
    title: "Protect Information through Access Control Lists"
    type: subclause
    clause_ref: "14.6"
    status: draft
    content: |
      Protect all information stored on systems with file system, network share,
      v7 claims, application, or database specific access control lists. These controls will ● ● ●
      enforce the principle that only authorized individuals should have access to the
      information based on their need to access the information as a part of their
      responsibilities.
      Page 18
  - id: "2.3"
    title: "Ensure Data at Rest is Encrypted (Manual)"
    type: subclause
    clause_ref: "2.3"
    status: draft
    content: |
      Profile Applicability:
      • Level 1
      Description:
      Amazon Aurora allows you to encrypt your databases using keys you manage through
      AWS Key Management Service (KMS). Here is a step-by-step guide on how to encrypt
      data at rest for an Amazon Aurora instance:
      Rationale:
      Once you are in your AWS account you can either create or modify your existing Aurora
      DB. A master key would be needed by the authorized user to enable encryption.
      Enabling encryption would keep the user’s data private and stored...
  - id: "3.11"
    title: "Encrypt Sensitive Data at Rest"
    type: subclause
    clause_ref: "3.11"
    status: draft
    content: |
      Encrypt sensitive data at rest on servers, applications, and databases containing
      sensitive data. Storage-layer encryption, also known as server-side encryption,
      v8
      meets the minimum requirement of this Safeguard. Additional encryption methods
      ● ●
      may include application-layer encryption, also known as client-side encryption,
      where access to the data storage device(s) does not permit access to the plain-text
      data.
  - id: "14.8"
    title: "Encrypt Sensitive Information at Rest"
    type: subclause
    clause_ref: "14.8"
    status: draft
    content: |
      v7 Encrypt all sensitive information at rest using a tool that requires a secondary ●
      authentication mechanism not integrated into the operating system, in order to
      access the information.
      Page 20
  - id: "2.4"
    title: "Ensure Data in Transit is Encrypted (Manual)"
    type: subclause
    clause_ref: "2.4"
    status: draft
    content: |
      Profile Applicability:
      • Level 1
      Description:
      Use SSL (Secure Sockets Layer) to secure data in transit. Aurora supports SSL-
      encrypted connections between your application and your DB instance. Here is a step-
      by-step guide on how to encrypt data in transit for an Amazon Aurora instance:
      Rationale:
      Aurora supports SSL-encrypted application for the individual DB. To secure your data in
      transit the individual should identify their client application and what is supported by
      SSL/TLS in order to...
  - id: "3.10"
    title: "Encrypt Sensitive Data in Transit"
    type: subclause
    clause_ref: "3.10"
    status: draft
    content: |
      v8
      Encrypt sensitive data in transit. Example implementations can include:
      ● ●
      Transport Layer Security (TLS) and Open Secure Shell (OpenSSH).
      v7
