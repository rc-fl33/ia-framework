  - id: "2"
    title: "Elastic Block Store (EBS)"
    type: clause
    clause_ref: "2"
    status: draft
    content: |
      Amazon EBS is a block level file storage system that runs on EC2. EBS can be used as
      a hard drive that’s mounted on an EC2 instance (virtual machine). EBS can store data
      as a standalone apart from EC2. This means that data can persist to the block storage
      service while an EC2 instance is offline. Out of the box EBS functions as an
      unformatted file system that needs to be configured and mounted on top of an EC2
      instance. EBS can be used as both a storage and boot drive; for the purposes of...
