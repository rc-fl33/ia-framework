applicable_scope:
  - LLM applications
  - Generative AI applications
  - Applications built on foundation models
  - RAG (Retrieval-Augmented Generation) systems
  - Agentic AI systems
  - Multi-modal AI applications

related_frameworks:
  - id: mitre-atlas
    relationship: "OWASP source explicitly maps individual vulnerabilities to MITRE ATLAS techniques"
    notes: "LLM01 maps to AML.T0051.000/001/AML.T0054; LLM02 to AML.T0024.000/001/002; LLM03 to ML Supply Chain Compromise; LLM04 to AML.T0018; LLM07 to AML.T0051.000; LLM09 to AML.T0048.002; LLM10 to AML.T0029/AML.T0034/AML.T0025"
  - id: nist-ai-rmf
    relationship: "OWASP source references NIST AI RMF for LLM04 data integrity strategies"
    notes: "Mentioned in LLM04 Related Frameworks section"

project_leads:
