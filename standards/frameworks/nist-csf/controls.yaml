# NIST Cybersecurity Framework 2.0 Controls
# Source: https://www.nist.gov/cyberframework
# Version: 2.0 (February 2024)
# Last Updated: 2026-03-03

metadata:
  framework: "NIST Cybersecurity Framework"
  version: "2.0"
  release_date: "2024-02-26"
  official_url: "https://www.nist.gov/cyberframework"
  reference_document: "NIST.CSWP.29.pdf"
  total_controls: 106

functions:
  - id: GV
    name: GOVERN
    description: "Establish and monitor the organization's cybersecurity risk management strategy, expectations, and policy"

  - id: ID
    name: IDENTIFY
    description: "Understand the organization's current cybersecurity risk posture"

  - id: PR
    name: PROTECT
    description: "Use safeguards to prevent or reduce cybersecurity risk"

  - id: DE
    name: DETECT
    description: "Find and analyze possible cybersecurity attacks and compromises"

  - id: RS
    name: RESPOND
    description: "Take action regarding a detected cybersecurity incident"

  - id: RC
    name: RECOVER
    description: "Restore assets and operations affected by a cybersecurity incident"

