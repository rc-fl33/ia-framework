      - type: remediation_tracking
        description: "Findings remediation status with completion evidence"
        examples:
          - "Remediation tracking board (Jira/Asana) showing findings, owners, status, completion dates"
          - "Evidence of fixes: knowledge base updates, prompt improvements, confidence threshold adjustments"
          - "Retest validation: assessor confirmed remediation effectiveness"
          - "Remediation SLA compliance: critical findings fixed within 30 days, high within 90 days"
    scoring:
      full: Qualified third-party quarterly assessments with ground truth dataset, documented findings, and tracked remediation
      partial: Hallucination testing performed but irregular cadence (gaps >4 months) or incomplete remediation tracking
      none: No third-party hallucination testing
    sub_questions:
      - Are qualified external assessors appointed with documented AI evaluation expertise?
      - Is assessor independence verified (no financial conflicts)?
      - Is ground truth dataset maintained with 100+ test cases per domain?
      - Are assessments executed quarterly (every 3 months ±2 weeks)?
      - Are findings remediated with tracking and completion evidence?
    test_scenarios:
      - scenario: "Quarterly cadence maintained"
        expected_evidence: ["4 reports covering last 12 months, no gaps >4 months, regular testing schedule"]
        pass_criteria: "Testing occurs every 3 months consistently"
      - scenario: "Assessor qualifications verified"
        expected_evidence: ["Qualifications documented (AI evaluation expertise, hallucination methodology), independence confirmed"]
        pass_criteria: "Assessor demonstrably qualified and independent"
      - scenario: "Ground truth dataset current"
        expected_evidence: ["Dataset exists with 100+ cases, updated within 6 months, sources documented"]
        pass_criteria: "Dataset maintained and aligned with current product/policies"
      - scenario: "Remediation tracked and completed"
        expected_evidence: ["All medium/high findings tracked, 80%+ completed within SLA (30/90 days)"]
        pass_criteria: "Findings drive improvements, not just documentation"
    gap_examples:
      - gap: "Testing conducted but ground truth outdated"
        indicator: "Ground truth last updated >12 months ago, doesn't include recent product launches"
        remediation: "Establish quarterly ground truth update process aligned with product changes, assign SME owners"
      - gap: "Findings documented but no remediation accountability"
        indicator: "Assessment reports list issues but no tracking system, no assigned owners, no follow-up"
        remediation: "Create remediation tracking board, assign owner for each finding, require closure before next assessment"
      - gap: "Only testing one use case, ignoring others"
        indicator: "Quarterly reports cover product info but not pricing, policies, or technical support"
        remediation: "Expand testing scope to all medium/high-risk use cases, prioritize by user impact"
      - gap: "Using automated tool alone without human review"
        indicator: "RAGAS/TruLens scores reported but no human assessor validation"
        remediation: "Combine automated testing (80%) with human expert review (20%), validate tool findings"
    risk_weight: HIGH
  - id: Q-AIUC1-D003
    text: Are safeguards or technical controls implemented to prevent AI tool calls from executing
      unauthorized actions, accessing restricted information, or making decisions beyond their
      intended scope?
    category: reliability
    status: mandatory
    frequency: Every 12 months
    controls:
      aiuc-1: D003
    canonical_question_id: RELIABILITY-TOOL-CALL-RESTRICT-001
    evidence_required:
      - type: tool_inventory
        description: "Comprehensive inventory of all AI agent tools with authorization requirements"
        examples:
          - "Tool inventory spreadsheet listing: tool name, purpose, parameters, risk level (high/medium/low), side effects"
          - "Authorization matrix mapping agent roles to permitted tools and parameter constraints"
          - "Tool documentation showing intended use cases and restrictions"
          - "New tool approval process requiring security review before deployment"
      - type: authorization_enforcement
        description: "Technical enforcement of tool call authorization at execution boundary"
        examples:
          - "Authorization middleware code validating calls before execution"
          - "Policy-as-code configurations (Open Policy Agent, Cedar, Casbin) defining authorization rules"
          - "API gateway rules enforcing tool access controls (Kong, Apigee policies)"
          - "Examples of unauthorized tool call rejections with error messages (logs from last 30 days)"
      - type: parameter_validation
        description: "Parameter validation and sanitization preventing injection attacks"
        examples:
          - "Parameter validation code checking types, ranges, allowed values before execution"
          - "Row-level security (RLS) policies filtering data by user context (database configurations)"
          - "Input sanitization for SQL injection, command injection, path traversal prevention"
          - "Parameter validation test results showing injection attack prevention"
      - type: rate_limiting
        description: "Rate limits and transaction caps enforced per tool and per agent"
        examples:
          - "Rate limiting configuration: per-tool limits (10 emails/hour, 100 DB reads/hour)"
          - "Transaction value caps (daily/weekly $ limits for financial tools)"
          - "Rate limit enforcement logs showing throttling events (last 90 days)"
          - "Sliding window or token bucket implementation details"
      - type: audit_logging
        description: "Complete audit trail of all tool calls with retention"
        examples:
          - "Tool call logs including: timestamp, agent ID, tool name, parameters, authorization result, execution outcome"
          - "Log retention policy (minimum 90 days for audit and incident investigation)"
          - "Audit log query examples demonstrating completeness"
          - "Log analysis dashboard showing tool usage patterns"
      - type: monitoring_alerting
        description: "Monitoring and alerting on unauthorized tool call attempts and anomalies"
        examples:
          - "Alert configurations: repeated unauthorized attempts (>5/hour), high-risk tool calls, rate limit violations"
          - "Security monitoring dashboard showing authorization metrics"
          - "Examples of alerts fired with response actions (last 90 days)"
          - "On-call rotation and SLA for tool security alerts (1-4 hour response time)"
    scoring:
      full: Authorization enforced technically with parameter validation, rate limits, audit logging, and monitoring
      partial: Some tool call restrictions exist (authorization or rate limits) but incomplete coverage or no monitoring
      none: No controls restricting unsafe tool calls
    sub_questions:
      - Is tool authorization enforced technically (not just in prompts)?
      - Is parameter validation implemented preventing injection attacks?
      - Are rate limits and transaction caps enforced per tool and per agent?
      - Is complete audit logging maintained with 90+ day retention?
      - Is monitoring and alerting active for unauthorized attempts and anomalies?
    test_scenarios:
      - scenario: "Authorization enforced"
        expected_evidence: ["Unauthorized calls rejected regardless of prompt manipulation, authorization logged"]
        pass_criteria: "Technical enforcement at execution boundary, not prompt-based"
      - scenario: "Parameter validation works"
        expected_evidence: ["Parameter injection attempts blocked (SQL, command, path traversal), validation logged"]
        pass_criteria: "Row-level security and input sanitization operational"
      - scenario: "Rate limits enforced"
        expected_evidence: ["Calls beyond threshold rejected (e.g., 11th email/hour blocked), rate limit logs present"]
        pass_criteria: "Rate limiting triggers at configured thresholds"
      - scenario: "Audit logging complete"
        expected_evidence: ["100% of tool calls logged with full metadata, logs retained 90+ days"]
        pass_criteria: "Complete audit trail for all tool executions"
      - scenario: "Monitoring active"
        expected_evidence: ["Alerts configured and firing on unauthorized attempts, response SLA defined (1-4 hours)"]
        pass_criteria: "Proactive detection and response to tool security events"
    gap_examples:
      - gap: "Tool-level authorization but no parameter validation"
        indicator: "Agent can call read_database but no restrictions on which tables or user records"
        remediation: "Implement parameter validation checking table names, user ID ownership, data classification before execution"
      - gap: "Rate limits exist but no transaction value caps"
        indicator: "100 transactions/day allowed but no total $ amount cap"
        remediation: "Add transaction value caps (daily/weekly $ limits), trigger human approval when cumulative threshold exceeded"
      - gap: "Authorization enforced but no logging of unauthorized attempts"
        indicator: "Unauthorized calls rejected but no audit trail, security team unaware"
        remediation: "Log all authorization decisions including rejections, alert on repeated attempts (>5/hour)"
      - gap: "Static authorization, no dynamic adaptation"
        indicator: "Same authorization rules for all contexts (work hours vs off-hours, normal vs suspicious)"
        remediation: "Implement context-aware authorization (reduced limits off-hours, step-up auth for high-risk tools)"
    risk_weight: MEDIUM
  - id: Q-AIUC1-D004
    text: Are expert third parties appointed to evaluate tool calls within AI systems at least
      quarterly, assessing risks including unauthorized action execution and scope violations?
    category: reliability
    status: mandatory
    frequency: Every 3 months
    controls:
      aiuc-1: D004
    canonical_question_id: RELIABILITY-TOOL-CALL-TEST-001
    evidence_required:
      - type: assessor_qualifications
        description: "Third-party assessor with documented AI agent security expertise and independence"
        examples:
          - "Assessor contract or SOW listing qualifications (LLM red-teaming, prompt injection, tool abuse testing)"
          - "Assessor credentials: AI agent security portfolio, authorization bypass techniques, tool security methodology"
          - "Independence documentation: arms-length relationship, no financial conflicts"
          - "Evidence of AI-specific expertise (not just general penetration testing)"
      - type: test_case_library
        description: "Comprehensive test cases covering tool misuse scenarios and adversarial attacks"
        examples:
          - "Test case library with 20-50 scenarios per major tool (authorization bypass, parameter injection, rate limit evasion)"
          - "Adversarial test cases: prompt injection for tool manipulation, privilege escalation, scope violations"
          - "Parameter fuzzing scenarios: SQL injection, command injection, path traversal, XSS"
          - "Test case coverage matrix showing tools tested vs attack vectors (spreadsheet or documentation)"
      - type: quarterly_reports
        description: "Assessment reports from last 4 quarters with findings and severity ratings"
        examples:
          - "Q1-Q4 assessment reports with dates, findings count by severity (critical/high/medium/low)"
          - "Testing methodology documented (adversarial prompts, parameter fuzzing, authorization boundary testing)"
          - "Success criteria defined (100% authorization enforcement, no parameter injection, rate limits functional)"
          - "Historical trend chart showing finding reduction over time"
      - type: remediation_tracking
        description: "Findings remediation with retest validation and completion evidence"
        examples:
          - "Security issue tracker (Jira Security) showing findings, assigned owners, remediation status, completion dates"
          - "Evidence of fixes: authorization hardening code commits, parameter sanitization updates, rate limit tuning"
          - "Retest validation: assessor confirmed vulnerabilities resolved"
          - "Remediation SLA compliance: critical findings fixed within 30 days, high within 90 days"
      - type: tool_documentation
        description: "Complete tool inventory with security controls documented"
        examples:
          - "Tool inventory provided to assessor: tool names, purposes, parameters, authorization requirements"
          - "Authorization matrix showing role-to-tool permissions and parameter constraints"
          - "Rate limiting and transaction cap configurations per tool"
          - "Tool call audit logs available for assessor analysis"
    scoring:
      full: Qualified third-party quarterly assessments with adversarial test cases, documented findings, and tracked remediation
      partial: Tool call testing performed but irregular cadence (gaps >4 months) or missing adversarial scenarios
      none: No third-party testing of tool calls
    sub_questions:
      - Are qualified external assessors appointed with AI agent security expertise?
      - Is assessor independence verified (no financial conflicts)?
      - Do test cases include adversarial scenarios (30%+ prompt injection, parameter fuzzing, bypass attempts)?
      - Are assessments executed quarterly (every 3 months ±2 weeks)?
      - Are critical/high findings remediated and retested within SLA (30/90 days)?
    test_scenarios:
      - scenario: "Quarterly cadence maintained"
        expected_evidence: ["4 reports covering last 12 months, no gaps >4 months, regular testing schedule"]
        pass_criteria: "Testing occurs every 3 months consistently"
      - scenario: "Assessor AI-specialized"
        expected_evidence: ["Qualifications documented (LLM red-teaming, prompt injection expertise), AI portfolio verified"]
        pass_criteria: "Assessor has AI agent security expertise, not just general pentesting"
      - scenario: "Adversarial test cases included"
        expected_evidence: ["Test library includes prompt injection, parameter fuzzing, authorization bypass (30%+ of cases)"]
        pass_criteria: "Testing goes beyond happy path, includes attack scenarios"
      - scenario: "Parameter validation tested"
        expected_evidence: ["Assessment reports show parameter injection testing (SQL, command, path traversal, XSS)"]
        pass_criteria: "Input validation explicitly tested, not just authorization"
      - scenario: "Remediation tracked and completed"
        expected_evidence: ["All critical/high findings tracked, 80%+ completed within SLA, retest validation present"]
        pass_criteria: "Findings drive security improvements with verified fixes"
    gap_examples:
      - gap: "Testing only happy path, no bypass attempts"
        indicator: "Assessment validates authorized tool calls work but doesn't test prompt injection or parameter manipulation"
        remediation: "Require adversarial testing in SOW, include prompt injection test cases (OWASP LLM09), validate bypass resistance"
      - gap: "Findings documented but no remediation accountability"
        indicator: "Quarterly reports list critical findings but no tracking, no owners, same issues recur"
        remediation: "Create security issue tracker, assign owner for each finding, require closure evidence before next assessment"
      - gap: "Only testing one high-profile tool, ignoring others"
        indicator: "Quarterly reports cover send_email but not database access, delete operations, admin functions"
        remediation: "Expand scope to all medium/high-risk tools, prioritize by impact and exposure"
      - gap: "Using automated tool alone without human expertise"
        indicator: "PromptFoo/Garak results reported but no human assessor analyzing patterns, no creative bypass attempts"
        remediation: "Combine automated testing (70%) with human expert review (30%), validate findings with manual exploitation"
      - gap: "Testing in isolated environment, not production-like"
        indicator: "Testing occurs in demo environment missing production authorization integrations, rate limiting"
        remediation: "Provide production-like test environment, mirror authorization configs, sync constraints"
    risk_weight: HIGH
  - id: Q-AIUC1-E001
    text: Is an AI failure plan documented for privacy and security breaches, assigning accountable
      owners and establishing notification and remediation procedures?
    category: accountability
    status: mandatory
    frequency: Every 12 months
    controls:
      aiuc-1: E001
    canonical_question_id: ACCOUNTABILITY-BREACH-RESPONSE-001
    evidence_required:
      - type: leadership_designation
        description: "Breach response leadership with clear roles and contact information"
        examples:
          - "AI Breach Response Plan Section 2: Incident Commander: CISO (John Smith, john@example.com, +1-555-0100), Technical Lead: Head of AI (Jane Doe), Communications Lead: VP Legal"
          - "RACI matrix for breach response: CISO (Accountable), Security Lead (Responsible), Legal (Consulted), CEO (Informed)"
          - "On-call rotation: Primary breach responder rotates weekly among security team, escalation to CISO for Critical incidents"
      - type: notification_procedures
        description: "Customer and regulatory notification processes with timelines and templates"
        examples:
          - "Notification timeline: Customers notified within 72 hours of breach confirmation, regulators (FTC, state AGs) within legal timeframes (varies by jurisdiction)"
          - "Customer notification template: 'We are writing to inform you of a data security incident affecting your information... [what happened, what data affected, remediation steps, contact info]'"
          - "Regulatory notification checklist: Determine applicable regulations (GDPR, CCPA, HIPAA), prepare required documentation, submit via prescribed channels, track acknowledgment"
      - type: remediation_procedures
        description: "Technical remediation steps including system freeze capabilities"
        examples:
          - "System freeze procedure: 'Upon breach detection, Incident Commander can trigger emergency AI system shutdown via kill-switch command: ./scripts/emergency-shutdown.sh'"
          - "Remediation workflow: Isolate affected systems → Preserve evidence → Identify root cause → Deploy patch → Validate fix → Restore service → Post-incident review"
          - "Freeze authority: Only CISO and CTO authorized to freeze production AI systems, decision logged and justified in incident ticket"
      - type: evidence_collection
        description: "Forensic evidence collection and preservation procedures"
        examples:
          - "Evidence preservation checklist: Capture system logs (retain for 1 year), take disk/memory snapshots, export database audit trails, preserve AI model artifacts"
          - "Chain of custody: All evidence timestamped, hash-verified, transferred to designated forensics storage (S3 bucket with object lock), access logged"
          - "Third-party forensics: For Critical breaches, engage external forensics firm (Mandiant, CrowdStrike) within 24 hours for independent investigation"
    scoring:
      full: Documented breach response plan with designated leaders, notification procedures, and evidence
        collection
      partial: Breach response plan exists but leadership, notification, or evidence collection is
        incomplete
      none: No AI failure plan for security breaches
    sub_questions:
      - Is breach response leadership designated with clear accountability?
      - Are notification procedures established for customers and regulators?
      - Are security remediation procedures documented including system freeze capabilities?
    test_scenarios:
      - scenario: "Breach response plan executable"
        expected_evidence: ["Conduct tabletop exercise simulating AI breach", "Verify leadership contacts reachable", "Test notification templates and procedures"]
        pass_criteria: "Tabletop exercise completed annually, all contacts valid, notification procedures functional"
      - scenario: "System freeze capability tested"
        expected_evidence: ["Test emergency shutdown in staging environment", "Verify authorized personnel can trigger freeze", "Confirm system recoverable after freeze"]
        pass_criteria: "Freeze mechanism functional, authorization enforced, recovery procedure validated"
      - scenario: "Evidence collection automated"
        expected_evidence: ["Evidence collection scripts functional", "Chain of custody maintained", "Storage retention enforced"]
        pass_criteria: "Automated evidence capture works, custody documented, retention policy enforced"
    gap_examples:
      - gap: "Generic incident response plan, no AI-specific procedures"
        indicator: "Standard breach response plan doesn't address AI system specifics: model artifacts, training data, inference logs"
        remediation: "Extend incident response plan with AI-specific section: evidence unique to AI systems, AI system freeze procedures, AI-specific notification language"
      - gap: "Unclear leadership, no designated Incident Commander"
        indicator: "Breach response plan lists 'security team' but no named individuals, unclear who makes freeze decision"
        remediation: "Designate specific Incident Commander by name, define decision authority clearly, maintain current contact information, test contacts quarterly"
      - gap: "No system freeze capability, can't stop runaway breach"
        indicator: "No documented procedure to quickly disable AI system during breach, risk of continued data exposure"
        remediation: "Implement emergency shutdown mechanism (API kill-switch, infrastructure automation), document procedure, test quarterly, ensure 24/7 access"
    risk_weight: MEDIUM
  - id: Q-AIUC1-E002
    text: Is a comprehensive response plan documented for harmful AI outputs causing significant
      customer harm, with accountability and remediation procedures?
    category: accountability
    status: mandatory
    frequency: Every 12 months
    controls:
      aiuc-1: E002
    canonical_question_id: ACCOUNTABILITY-HARMFUL-OUTPUT-RESPONSE-001
    evidence_required:
      - type: communication_protocols
        description: "Customer communication procedures for harmful output incidents with severity-based timelines"
        examples:
          - "Communication protocol: Critical incidents (customer harm confirmed) → Contact affected customers within 24 hours, High incidents → 72 hours, Medium → 7 days"
          - "Communication template: 'We are contacting you regarding an issue with our AI system that may have provided harmful advice... [description of harm, corrective information, our remediation, support contact]'"
          - "Escalation procedure: Customer Support identifies potential harm → Escalate to Safety Lead → Safety Lead determines severity → Trigger communication protocol based on severity"
      - type: mitigation_steps
        description: "Immediate mitigation actions including system freeze and output filtering"
        examples:
          - "Immediate response checklist: 1) Freeze affected AI feature, 2) Deploy emergency output filter blocking similar harmful outputs, 3) Notify affected customers, 4) Root cause analysis"
          - "System freeze capability: Safety Lead can trigger feature flag disabling harmful feature: 'SET feature.medical_advice.enabled=false' - takes effect in <1 minute"
          - "Emergency guardrail deployment: Pre-configured emergency filters deployable in <15 minutes: medical advice blocker, financial recommendation blocker, legal advice blocker"
      - type: harm_categories
        description: "Harmful output taxonomy with severity levels and concrete examples"
        examples:
          - "Harmful output categories: Critical (life-threatening medical advice, dangerous instructions), High (significant financial loss, severe emotional distress), Medium (offensive content, minor misinformation)"
          - "Category examples - Critical: 'Model suggests stopping prescribed medication without doctor consultation', High: 'Model recommends high-risk investment strategy as safe', Medium: 'Model uses biased language about protected group'"
          - "Severity assessment guide: Critical = immediate customer harm potential, High = significant but not life-threatening harm, Medium = reputational or minor harm"
      - type: accountability_assignment
        description: "Designated owners for harm response with clear decision authority"
        examples:
          - "Harm Response Owners: Critical harm = CTO approves customer communication and mitigation, High harm = Head of AI Safety, Medium harm = Product Lead"
          - "Decision authority: CTO authorized to freeze any AI system features immediately without additional approval if customer harm identified"
          - "On-call schedule: AI Safety Lead on-call 24/7 rotation, escalates to CTO for Critical incidents, response time SLA: Critical <1hr, High <4hr, Medium <24hr"
    scoring:
      full: Documented response plan with customer communication protocols and immediate mitigation steps
      partial: Response plan exists but customer communication or mitigation steps are incomplete
      none: No AI failure plan for harmful outputs
    sub_questions:
      - Are customer communication protocols established for significant harmful output incidents?
      - Are immediate mitigation steps documented with system freeze capabilities?
      - Are harmful output categories defined with concrete examples?
    test_scenarios:
      - scenario: "Harmful output response plan executable"
        expected_evidence: ["Conduct tabletop exercise simulating harmful output incident", "Verify communication templates ready", "Test freeze mechanism functional"]
        pass_criteria: "Exercise completed annually, communication protocol followed, freeze tested successfully"
      - scenario: "Severity classification consistent"
        expected_evidence: ["Present harm scenarios to team", "Verify consistent severity classification", "Decision authority clear for each severity"]
        pass_criteria: "Team classifies severity consistently (>90% agreement), escalation paths clear, decision authority documented"
      - scenario: "Customer communication timely"
        expected_evidence: ["Simulate customer harm incident", "Measure time to customer notification", "Verify communication includes corrective information"]
        pass_criteria: "Critical harm communicated within 24 hours, communication includes harm description and corrective guidance"
    gap_examples:
      - gap: "No defined harmful output categories, reactive classification"
        indicator: "When harmful output occurs, team debates severity, no pre-defined categories, inconsistent response"
        remediation: "Define harmful output taxonomy aligned with risk taxonomy (C001), create severity assessment guide with examples, train team on classification"
      - gap: "Slow customer communication, no urgency protocols"
        indicator: "Harmful output discovered but customer notification delayed days/weeks, no communication SLA, customers discover harm independently"
        remediation: "Establish severity-based communication timelines (Critical=24hr, High=72hr), create notification templates, assign communication owners, track SLA compliance"
      - gap: "No system freeze capability for harmful features"
        indicator: "Harmful output identified but feature continues serving customers while fix developed, extended customer exposure"
        remediation: "Implement feature flag architecture allowing instant disable of features, define freeze authority, test freeze mechanism quarterly, ensure 24/7 access"
    risk_weight: MEDIUM
  - id: Q-AIUC1-E003
    text: Are procedures documented for addressing hallucinated AI outputs causing substantial customer
      financial loss, including accountability and remediation?
    category: accountability
    status: mandatory
    frequency: Every 12 months
    controls:
      aiuc-1: E003
    canonical_question_id: ACCOUNTABILITY-HALLUCINATION-RESPONSE-001
    evidence_required:
      - type: compensation_procedures
        description: "Financial compensation assessment process for hallucination-caused customer losses"
        examples:
          - "Compensation assessment workflow: Customer reports financial loss → Verify hallucination caused loss → Assess loss amount → Legal review → Compensation approval by CFO"
          - "Compensation guidelines: Verified losses <$1,000 = automatic approval, $1,000-$10,000 = Head of AI approval, >$10,000 = CFO approval with legal review"
          - "Loss verification criteria: Customer provides evidence of loss (receipts, transactions), AI output logs confirm hallucination, causal link established between output and loss"
      - type: remediation_measures
        description: "Technical remediation and system adjustments to prevent similar hallucinations"
        examples:
          - "Hallucination remediation playbook: 1) Add fact-checking guard for affected domain, 2) Update training data to correct pattern, 3) Deploy citation requirement for factual claims, 4) Re-test with similar prompts"
          - "System adjustment: After price hallucination incident, deployed real-time price validation API - all price quotes verified before display"
          - "Preventive measures: Implemented 'confidence threshold' - factual claims below 0.8 confidence automatically include 'Verify this information' disclaimer"
      - type: incident_definitions
        description: "Hallucination incident types with severity classification and examples"
        examples:
          - "Hallucination categories: Critical (financial data, pricing, legal facts), High (product specifications, technical details), Medium (general knowledge, dates/names)"
          - "Incident examples - Critical: 'Model quoted product price $199 when actual price $1,999 - customer ordered based on hallucinated price', High: 'Model stated product has feature X that doesn't exist', Medium: 'Model provided incorrect historical date'"
          - "Financial loss thresholds: Critical = losses >$10,000 or regulatory implications, High = $1,000-$10,000, Medium = <$1,000"
      - type: accountability_owners
        description: "Designated owners for hallucination response with approval authority"
        examples:
          - "Response ownership: Critical hallucination incidents → CTO owns response, CFO approves compensation, Legal reviews liability"
          - "Approval matrix: <$1K compensation (Customer Success Lead), $1K-$10K (Head of AI), >$10K (CFO with legal review)"
          - "Incident Commander for hallucinations: Head of AI designated as owner, coordinates technical remediation + customer communication + compensation assessment"
    scoring:
      full: Documented hallucination response with compensation assessment and system adjustment
        procedures
      partial: Hallucination response plan exists but compensation or remediation procedures are incomplete
      none: No AI failure plan for hallucinations
    sub_questions:
      - Are compensation assessment procedures established for hallucination-caused financial loss?
      - Are remediation measures documented with system adjustments?
      - Are hallucination incident types defined and categorized?
    test_scenarios:
      - scenario: "Compensation assessment process functional"
        expected_evidence: ["Simulate customer hallucination claim", "Verify assessment workflow followed", "Test approval authority enforced"]
        pass_criteria: "Assessment workflow documented, verification criteria applied, appropriate approval obtained"
      - scenario: "Remediation prevents recurrence"
        expected_evidence: ["Historical hallucination incident reviewed", "Remediation implemented", "Re-testing shows issue resolved"]
        pass_criteria: "Remediation deployed within 30 days, re-testing shows <5% hallucination rate for affected domain, monitoring confirms fix"
      - scenario: "Incident classification consistent"
        expected_evidence: ["Present hallucination scenarios to team", "Verify consistent severity classification", "Compensation thresholds applied correctly"]
        pass_criteria: "Team classifies consistently (>90% agreement), compensation aligned with severity, escalation appropriate"
    gap_examples:
      - gap: "No compensation process, ad-hoc customer appeasement"
        indicator: "When hallucination causes loss, team handles case-by-case with no guidelines, inconsistent compensation, no documentation"
        remediation: "Document compensation assessment workflow, define approval thresholds, create verification criteria, train customer success team on process"
      - gap: "Hallucinations identified but no system improvements"
        indicator: "Hallucination incidents logged but no technical remediation, same issues recur, no preventive measures deployed"
        remediation: "Create hallucination remediation playbook, assign technical owner to each incident, track remediation to completion, measure recurrence rate"
      - gap: "Unclear loss verification, disputes common"
        indicator: "Customers claim hallucination-caused losses but no process to verify, team unsure if compensation appropriate, legal concerns"
        remediation: "Define loss verification criteria (evidence requirements, causal link assessment), involve legal in guideline creation, document decisions for precedent"
    risk_weight: MEDIUM
  - id: Q-AIUC1-E004
    text: Are AI system changes across the development and deployment lifecycle documented with formal
      review or approval, and are accountable leads assigned with supporting evidence?
    category: accountability
    status: mandatory
    frequency: Every 12 months
    controls:
      aiuc-1: E004
    canonical_question_id: ACCOUNTABILITY-CHANGE-APPROVAL-001
    evidence_required:
      - type: change_definitions
        description: "Clear definitions of AI system changes requiring formal approval"
        examples:
          - "Change approval matrix: Production model deployment (CTO approval required), Training data changes (Head of AI), System prompt modifications (AI Safety Lead), Infrastructure changes (Security approval)"
          - "Approval threshold: Minor changes (bug fixes, performance tuning) = peer review, Major changes (new model, new features) = formal approval with testing evidence"
          - "Change classification guide: New model version, Training data source changes, Guardrail modifications, API endpoint changes, System prompt edits - each with defined approval level"
      - type: accountable_leads
        description: "Named individuals designated as approvers for each change category"
        examples:
          - "Approval authority: CTO (Sarah Johnson) = Production deployments, Head of AI (Mike Chen) = Model training, AI Safety Lead (Emma Davis) = Safety controls, CISO = Security changes"
          - "Delegation policy: CTO can delegate production approval to Senior Engineering Lead for non-critical deployments, delegation documented in ticket"
          - "Approver contact list: Maintained in Confluence with current names, roles, email, Slack handles, escalation path if primary approver unavailable"
      - type: raci_structure
        description: "RACI matrix defining Responsible, Accountable, Consulted, Informed for AI governance"
        examples:
          - "RACI matrix for model deployment: Responsible=ML Engineer, Accountable=CTO, Consulted=Security+Legal, Informed=Product Team+Customer Success"
          - "Example RACI - Training data changes: R=Data Engineer, A=Head of AI, C=Legal+Privacy, I=Compliance Team"
          - "Governance RACI documented in AI Governance Charter with versioning, last updated Q1 2026, reviewed quarterly"
      - type: approval_evidence
        description: "Documented evidence of approvals with timestamps and justifications"
        examples:
          - "Jira approval workflow: Change ticket requires approval checkbox from designated approver before deployment allowed, approval timestamped and auditable"
          - "GitHub PR approval: Production model deployments require approval from @cto GitHub account, automated checks prevent merge without approval"
          - "Approval audit trail: All approvals logged in compliance system with: approver name, timestamp, change description, approval justification, test results reviewed"
    scoring:
      full: Documented change approval process with RACI structure and accountable leads assigned
      partial: Some change approvals exist but RACI or accountability assignments are incomplete
      none: No formal accountability assignment for AI system changes
    sub_questions:
      - Are AI system changes requiring formal approval defined?
      - Are accountable leads assigned as approvers for each change type?
      - Is a RACI structure followed for AI governance roles?
    test_scenarios:
      - scenario: "Approval enforcement prevents unauthorized changes"
        expected_evidence: ["Attempt deployment without approval", "Verify deployment blocked", "Approval requirement documented and enforced"]
        pass_criteria: "Automated enforcement prevents unauthorized deployments, approval checkpoints integrated into CI/CD, overrides logged"
      - scenario: "RACI clarity prevents confusion"
        expected_evidence: ["Survey team on who approves different change types", "Verify >90% correct identification", "RACI documentation accessible"]
        pass_criteria: "Team clearly understands approval authority, RACI matrix published and current, confusion incidents <5% of changes"
      - scenario: "Approval audit trail complete"
        expected_evidence: ["Review last 20 AI deployments", "Verify all have documented approvals", "Approver identity and timestamp recorded"]
        pass_criteria: "100% of deployments have approval documentation, timestamps accurate, approver verification possible"
    gap_examples:
      - gap: "Informal approvals, no documentation"
        indicator: "Team gets 'Slack thumbs up' for deployments but no formal approval workflow, unclear if proper authority approves, no audit trail"
        remediation: "Implement formal approval workflow in ticketing system (Jira), require documented approval before deployment, automate enforcement in CI/CD"
      - gap: "RACI undefined, responsibility confusion"
        indicator: "When issues arise, unclear who owns resolution, multiple people assume responsibility or nobody does, decision delays"
        remediation: "Create RACI matrix for all AI governance activities, publish in accessible location, train team on structure, review quarterly"
      - gap: "Change definitions vague, inconsistent approvals"
        indicator: "Team debates whether changes need approval, some major changes slip through without review, inconsistent application"
        remediation: "Document clear change classification criteria with examples, create approval matrix by change type, train team on classification, audit compliance"
    risk_weight: MEDIUM
  - id: Q-AIUC1-E005
    text: Are criteria established for selecting cloud providers and determining circumstances for
      on-premises processing considering data sensitivity, regulatory requirements, and security
      controls?
    category: accountability
    status: mandatory
    frequency: Every 12 months
    controls:
      aiuc-1: E005
    canonical_question_id: ACCOUNTABILITY-DEPLOYMENT-CRITERIA-001
    evidence_required:
      - type: risk_assessments
        description: "Structured risk assessments for cloud vs on-premises deployment decisions"
        examples:
          - "Deployment risk assessment template: Evaluate data sensitivity (PII, financial, healthcare), regulatory requirements (GDPR, HIPAA, SOC2), performance needs, cost, vendor lock-in risk"
          - "Risk assessment for customer support AI: Data sensitivity=Medium (customer names, support tickets), Regulations=GDPR compliance required, Decision=Cloud deployment with EU data residency"
          - "Assessment scoring: Data sensitivity (1-5), Regulatory complexity (1-5), Security requirements (1-5) → Total score >12 triggers on-premises consideration"
      - type: decision_criteria
        description: "Documented criteria guiding cloud vs on-premises deployment choices"
        examples:
          - "Deployment decision tree: HIPAA/PHI data? → On-premises or HIPAA-compliant cloud, PCI/financial data? → Assess cloud provider PCI compliance, General business data? → Cloud acceptable"
          - "Decision criteria: Cloud preferred for scalability/cost unless: 1) Regulatory prohibition, 2) Extremely sensitive IP, 3) Vendor risk exceeds threshold, 4) Performance requirements unmet by cloud"
          - "Documented rationale example: 'Medical diagnosis AI deployed on-premises due to HIPAA PHI requirements, direct patient harm risk, and malpractice liability concerns'"
      - type: security_controls
        description: "Deployment-specific security controls tailored to environment"
        examples:
          - "Cloud deployment security: Encryption at rest (AWS KMS), encryption in transit (TLS 1.3), VPC isolation, IAM least privilege, CloudTrail logging, SOC2 Type II attestation"
          - "On-premises deployment security: Hardware security modules (HSM), air-gapped networks, physical access controls, dedicated security monitoring, vendor-independent controls"
          - "Hybrid deployment architecture: Sensitive data processing on-premises, inference API cloud-hosted, secure API between environments with mutual TLS, data minimization"
      - type: vendor_selection
        description: "Cloud provider evaluation criteria and vendor management"
        examples:
          - "Vendor selection scorecard: Security certifications (SOC2, ISO 27001), Data residency options (EU, US, Asia), SLA commitments (99.9% uptime), AI-specific features (GPU availability), Support quality"
          - "Approved cloud vendors: AWS (primary for production), GCP (research/experimentation), Azure (approved with security review), Smaller providers require CTO approval"
          - "Vendor risk assessment: Annual review of cloud provider security posture, incident history, financial stability, contract terms, exit strategy/data portability"
    scoring:
      full: Documented deployment criteria with risk assessments and deployment-appropriate security
        controls
      partial: Deployment decisions made but criteria or risk assessments are informal
      none: No criteria for cloud vs on-premises AI processing decisions
    sub_questions:
      - Are deployment risk assessments conducted for cloud vs on-premises decisions?
      - Are decision criteria and rationale documented?
      - Are hybrid deployment strategies and vendor management procedures considered?
    test_scenarios:
      - scenario: "Deployment criteria drive consistent decisions"
        expected_evidence: ["Review last 5 AI deployments", "Verify risk assessments conducted", "Decision rationale documented and aligned with criteria"]
        pass_criteria: "All deployments have documented risk assessment, decisions follow published criteria, exceptions justified"
      - scenario: "Security controls appropriate for deployment type"
        expected_evidence: ["Cloud deployments use cloud-native security", "On-premises deployments have physical controls", "Controls match data sensitivity"]
        pass_criteria: "Security controls documented, appropriate for environment, validated by security team"
      - scenario: "Vendor selection criteria applied consistently"
        expected_evidence: ["New cloud vendor proposals evaluated using scorecard", "Approved vendor list maintained", "Vendor risks assessed annually"]
        pass_criteria: "Vendor evaluation documented, scorecard applied consistently, annual reviews completed"
    gap_examples:
      - gap: "Ad-hoc deployment decisions, no criteria"
        indicator: "Deployment choices made based on team preference or convenience, no documented rationale, inconsistent application of security controls"
        remediation: "Document deployment decision criteria, create risk assessment template, require justification for all deployment decisions, publish approved vendor list"
      - gap: "Cloud-first without considering regulatory requirements"
        indicator: "All AI deployed to cloud by default, HIPAA/GDPR requirements discovered later, potential compliance violations"
        remediation: "Add regulatory assessment to deployment checklist, involve legal/compliance early in deployment planning, define regulatory triggers requiring on-premises"
      - gap: "Security controls inconsistent across environments"
        indicator: "Cloud deployments have strong controls, on-premises deployments vary widely, no standardization"
        remediation: "Document security baseline for each deployment type, create deployment templates with controls pre-configured, audit deployments quarterly for compliance"
    risk_weight: MEDIUM
  - id: Q-AIUC1-E006
    text: Are AI vendor due diligence processes established for foundation and upstream model providers
      covering data handling, PII controls, security, and compliance?
    category: accountability
    status: mandatory
    frequency: Every 12 months
    controls:
      aiuc-1: E006
    canonical_question_id: ACCOUNTABILITY-VENDOR-DILIGENCE-001
    evidence_required:
      - type: assessment_criteria
        description: "Structured criteria for evaluating AI model providers"
        examples:
          - "Vendor assessment scorecard: Data handling policies (0-25 pts), PII controls (0-20 pts), Security certifications (0-20 pts), Compliance attestations (0-15 pts), Model transparency (0-10 pts), Incident history (0-10 pts) = Total 100 pts"
          - "Evaluation categories: Does vendor train on customer data? PII redaction capabilities? SOC2 Type II certified? GDPR/CCPA compliant? Model card published? Responsible disclosure policy?"
          - "Minimum passing score: 70/100 required for approved vendor status, <70 requires CTO exception approval with risk acceptance"
      - type: documented_assessments
        description: "Vendor assessment reports with evidence and scoring"
        examples:
          - "OpenAI assessment report: Data handling=22/25 (no training on API data confirmed), PII controls=18/20 (redaction via moderation API), Security=20/20 (SOC2 Type II), Compliance=15/15 (GDPR/CCPA), Transparency=7/10 (model cards published), Incidents=8/10 (minor outages only) = Total: 90/100 APPROVED"
          - "Assessment evidence: Vendor completed security questionnaire, provided SOC2 report, demonstrated PII redaction, confirmed data processing addendum (DPA) signed"
          - "Assessment documentation: Vendor responses, certifications reviewed, scoring rationale, approval decision, assessment date, next review date"
      - type: maintained_records
        description: "Assessment records with annual review schedules and version tracking"
        examples:
          - "Vendor assessment register: OpenAI (assessed 2026-01-15, score 90/100, next review 2027-01-15), Anthropic (assessed 2025-12-20, score 95/100, next review 2026-12-20)"
          - "Annual review process: Calendar reminders for vendor re-assessment, track changes in vendor security posture, update scores, renew or terminate based on current assessment"
          - "Assessment versioning: Track score changes over time, identify improving/declining vendors, escalate degrading security posture to procurement"
      - type: risk_areas
        description: "Specific assessment of high-risk areas: data handling, PII, security, compliance"
        examples:
          - "Data handling assessment: 'Vendor confirms: No training on customer inputs, data retention 30 days, data deletion on request, no data sharing with third parties - VERIFIED via DPA'"
          - "PII controls verification: 'Tested vendor PII redaction: Submitted PII-laden test inputs, verified PII redacted in logs, tested deletion API - PASS'"
          - "Compliance validation: 'Vendor provided: SOC2 Type II report (reviewed by security team), GDPR DPA (reviewed by legal), CCPA attestation, ISO 27001 certificate - APPROVED'"
    scoring:
      full: Documented vendor due diligence with defined criteria, scoring, and maintained records
      partial: Vendor assessments performed but criteria or scoring are informal
      none: No vendor due diligence process for AI providers
    sub_questions:
      - Are assessment criteria defined for evaluating AI model providers?
      - Are documented assessments conducted with scoring?
      - Are assessment records maintained and updated annually?
    test_scenarios:
      - scenario: "Assessment criteria comprehensive"
        expected_evidence: ["Scorecard covers data, PII, security, compliance", "Criteria weighted appropriately", "Passing threshold defined"]
        pass_criteria: "All required categories present, scoring documented, threshold justified"
      - scenario: "Vendor assessment thorough"
        expected_evidence: ["Vendor completed questionnaire", "Evidence collected and verified", "Scoring rationale documented"]
        pass_criteria: "Assessment complete with supporting evidence, scoring consistent with criteria, approval decision clear"
      - scenario: "Annual reviews conducted"
        expected_evidence: ["Vendor register shows review dates", "Assessments current within 12 months", "Score changes tracked over time"]
        pass_criteria: "All vendors reviewed annually, no overdue assessments, historical tracking maintained"
    gap_examples:
      - gap: "Vendor selected based on features only, no security assessment"
        indicator: "AI vendor chosen for model capabilities but no evaluation of data handling, PII controls, or compliance"
        remediation: "Create vendor assessment scorecard, require security/legal review before vendor selection, document assessment for all current and future AI vendors"
      - gap: "One-time assessment, no annual reviews"
        indicator: "Vendors assessed during initial selection but never re-evaluated, potential security degradation undetected"
        remediation: "Create vendor assessment register with review schedules, automate annual review reminders, track vendor security posture changes"
      - gap: "Informal assessment, no documentation"
        indicator: "Team verbally confirms vendor 'seems secure' but no documented evidence, questionnaires, or scoring"
        remediation: "Formalize assessment process with standard questionnaire, require documented evidence (SOC2, DPA), maintain assessment records in central repository"
    risk_weight: MEDIUM
  - id: Q-AIUC1-E007
    text: Are approval processes defined for material changes to AI systems requiring formal review and
      sign-off?
    category: accountability
    status: optional
    frequency: Every 12 months
    controls:
      aiuc-1: E007
    canonical_question_id: ACCOUNTABILITY-MATERIAL-CHANGE-APPROVAL-001
    evidence_required:
      - type: material_change_definition
        description: "Clear definition of what constitutes a material AI system change"
        examples:
          - "Material change criteria: New model deployment, Training data source changes, System prompt modifications affecting behavior, New AI feature launches, Changes to safety/security controls"
          - "Materiality threshold: Changes affecting >1,000 users = material, Changes to high-risk features (medical, financial, legal advice) = always material, Infrastructure changes affecting availability/security = material"
          - "Non-material changes: Bug fixes not affecting behavior, Performance optimizations, UI/UX changes, Configuration tuning within approved parameters"
      - type: approval_workflow
        description: "Documented workflow defining review and approval steps"
        examples:
          - "Material change workflow: 1) Engineer creates change proposal, 2) Technical review by AI Lead, 3) Security review if security-relevant, 4) Legal review if compliance-relevant, 5) CTO approval, 6) Deployment"
          - "Workflow diagram: Change proposal → AI Lead review (2 days) → Concurrent Security + Legal review (3 days) → CTO approval (1 day) → Deployment window"
          - "Workflow automation: Jira workflow enforces approval sequence, blocks deployment without approvals, tracks time in each review stage"
      - type: review_documentation
        description: "Documented review and approval decisions with rationale"
        examples:
          - "Approval record: 'New medical advice detection model - Reviewed by: AI Lead (approved with conditions), Security (approved - no security concerns), Legal (approved - medical disclaimer required), CTO (final approval 2026-02-10)'"
          - "Review comments: 'Security review: Model deployment uses existing secure infrastructure, no new attack surface. Recommendation: Monitor false positive rate first 7 days. APPROVED.'"
          - "Approval audit trail: Timestamped approvals in Jira, email notifications sent to stakeholders, deployment gated on final approval, audit report exportable"
      - type: stakeholder_involvement
        description: "Identification of stakeholders required for different change types"
        examples:
          - "Stakeholder matrix: Model changes (AI Lead + CTO), Data changes (AI Lead + Legal + Privacy), Safety controls (AI Safety Lead + Security + CTO), New features (Product + AI Lead + CTO)"
          - "Cross-functional review: Material changes require minimum 3 approvers: Technical (AI Lead), Risk (Security/Legal), Executive (CTO/Product VP)"
          - "Stakeholder notification: All material changes notify: Engineering team (implementation), Customer Success (customer impact), Marketing (product messaging)"
    scoring:
      full: Formal approval workflow with documented review decisions and sufficient detail
      partial: Some approval documentation exists but workflow detail is insufficient
      none: No documented system change approval processes
    sub_questions:
      - Are formal review and approval decisions documented for material AI system changes?
      - Is the approval workflow documented with sufficient detail for audit?
    test_scenarios:
      - scenario: "Material change definition applied consistently"
        expected_evidence: ["Review recent AI changes", "Verify material changes identified correctly", "Non-material changes appropriately fast-tracked"]
        pass_criteria: "Material change criteria clear, team applies consistently, <10% misclassification rate"
      - scenario: "Approval workflow enforced"
        expected_evidence: ["Material change cannot deploy without approvals", "Workflow stages tracked", "Approval bypasses logged and justified"]
        pass_criteria: "Workflow automation prevents unapproved deployments, all stages documented, bypass authority limited to CTO"
      - scenario: "Audit trail sufficient for compliance"
        expected_evidence: ["Export approval records for last 12 months", "Verify timestamps, approvers, rationale present", "Audit trail tamper-evident"]
        pass_criteria: "All material changes have complete approval documentation, timestamps accurate, records immutable"
    gap_examples:
      - gap: "Material changes undefined, everything requires approval"
        indicator: "All changes routed through approval workflow, bottleneck delays, trivial changes take days, team frustrated"
        remediation: "Define material change criteria clearly, create fast-track process for non-material changes, educate team on classification"
      - gap: "Approval workflow informal, no documentation"
        indicator: "Team 'checks with CTO' via Slack before deployments but no formal documentation, audit trail missing"
        remediation: "Implement formal approval workflow in ticketing system, require documented approvals, automate enforcement in deployment pipeline"
      - gap: "No stakeholder identification, key reviewers missed"
        indicator: "Legal not involved in compliance-relevant changes, Security learns of changes post-deployment, missed review opportunities"
        remediation: "Create stakeholder matrix mapping change types to required reviewers, automate stakeholder notification, track review participation"
    risk_weight: LOW
  - id: Q-AIUC1-E008
    text: Are regular internal reviews of key AI governance processes established with documented review
      records and approvals?
    category: accountability
    status: mandatory
    frequency: Every 12 months
    controls:
      aiuc-1: E008
    canonical_question_id: ACCOUNTABILITY-GOVERNANCE-REVIEW-001
    evidence_required:
      - type: quarterly_reviews
        description: "Structured quarterly reviews of AI governance decision processes"
        examples:
          - "Quarterly governance review agenda: Review last quarter's major AI decisions, assess decision quality, identify process gaps, update governance procedures"
          - "Q1 2026 Governance Review minutes: Reviewed 15 material AI decisions, identified 3 process improvements (faster legal review, clearer approval thresholds, better stakeholder communication)"
          - "Review calendar: Recurring quarterly meetings (Jan/Apr/Jul/Oct) with mandatory attendance: CTO, Head of AI, Legal, Security Lead, Product VP"
      - type: decision_repository
        description: "Centralized repository storing all AI governance decisions and supporting documentation"
        examples:
          - "Confluence AI Governance space: All material decisions logged with: decision description, date, approvers, rationale, alternatives considered, risk assessment, outcome"
          - "Decision log format: 'Decision #47: Deploy sentiment analysis model to production. Date: 2026-02-10. Approvers: CTO, Legal. Rationale: Testing showed 95% accuracy, low harm risk. Alternatives: Manual review (too slow), Third-party API (data privacy concerns). Approved.'"
          - "Repository structure: Organized by quarter and decision type (model deployments, data changes, policy updates), searchable, version controlled"
      - type: remediation_tracking
        description: "Documented remediation actions for governance process gaps with completion tracking"
        examples:
          - "Remediation tracker: Gap: 'Legal review takes 7+ days, delays deployments' → Action: 'Add AI legal specialist to team, establish 3-day SLA' → Owner: Legal Lead → Due: 2026-03-31 → Status: In Progress"
          - "Governance improvement log: Q4 2025: Identified slow approval process → Implemented parallel review → Result: Approval time reduced from 10 days to 4 days"
          - "Action item tracking: All quarterly review action items tracked in Jira, assigned owners, progress reviewed in next quarterly meeting, completion rate tracked"
      - type: process_metrics
        description: "Metrics tracking governance process effectiveness over time"
        examples:
          - "Governance metrics dashboard: Average approval time (4.2 days), Decision reversal rate (2%), Stakeholder satisfaction (8.5/10), Process improvement velocity (3 improvements/quarter)"
          - "Trend analysis: Approval time decreasing (was 10 days in Q1 2025, now 4 days in Q1 2026), decision quality improving (reversals down from 8% to 2%)"
          - "Quarterly metrics report: Track key governance KPIs, identify degrading metrics, trigger process improvements when thresholds breached"
    scoring:
      full: Quarterly governance reviews with centralized records and remediation tracking
      partial: Internal reviews occur but not quarterly or remediation tracking is incomplete
      none: No regular internal reviews of AI governance processes
    sub_questions:
      - Are quarterly reviews of AI decision processes conducted?
      - Is a centralized repository maintained for decision records?
      - Are remediation efforts documented and tracked to completion?
    test_scenarios:
      - scenario: "Quarterly reviews held on schedule"
        expected_evidence: ["Review meetings scheduled and attended", "Minutes documented with action items", "All quarters covered in last 12 months"]
        pass_criteria: "4 quarterly reviews conducted in last 12 months, attendance >80%, minutes published within 1 week"
      - scenario: "Decision repository complete and accessible"
        expected_evidence: ["All material decisions logged", "Repository searchable and organized", "Team knows how to access"]
        pass_criteria: "100% of material decisions documented, repository accessible to governance stakeholders, training provided"
      - scenario: "Remediation actions completed"
        expected_evidence: ["Action items tracked from review to completion", "Completion rate >70%", "Incomplete actions escalated"]
        pass_criteria: "Action items assigned owners, progress tracked quarterly, completion rate >70%, blockers addressed"
    gap_examples:
      - gap: "No regular review cadence, ad-hoc only"
        indicator: "Governance reviews happen sporadically when issues arise, no proactive assessment, last review 8 months ago"
        remediation: "Establish recurring quarterly review meetings, create standing agenda, assign review owner, track attendance and completion"
      - gap: "Decisions made but not documented centrally"
        indicator: "AI decisions spread across Slack, email, Jira tickets - no single source of truth, difficult to review past decisions"
        remediation: "Create centralized decision repository (Confluence, Notion), require decision logging as part of approval workflow, migrate historical decisions"
      - gap: "Process gaps identified but never fixed"
        indicator: "Reviews identify issues but no follow-up, same problems recur, no accountability for improvements"
        remediation: "Track remediation actions in ticketing system, assign owners to each improvement, review progress in quarterly meetings, escalate blockers to executive team"
    risk_weight: MEDIUM
  - id: Q-AIUC1-E009
    text: Are systems implemented to monitor third-party access to AI systems?
    category: accountability
    status: optional
    frequency: Every 12 months
    controls:
      aiuc-1: E009
    canonical_question_id: ACCOUNTABILITY-THIRD-PARTY-MONITORING-001
    evidence_required:
      - type: scope_definition
        description: "Defined scope of third-party access with authorized parties and permitted operations"
        examples:
          - "Third-party access registry: Vendor XYZ (support access, read-only to logs), Auditor ABC (compliance review, read-only to configs), Partner DEF (API integration, inference endpoint only)"
          - "Access scope documentation: 'Vendor XYZ authorized for troubleshooting support, limited to production logs (no customer PII), access valid through 2026-12-31, requires prior approval for each session'"
          - "Permitted operations by party: Support vendors (log access, no data export), Auditors (read-only access, screenshot approved), Integration partners (API calls only, rate limited)"
      - type: access_logging
        description: "Comprehensive logging of all third-party access with authentication and actions"
        examples:
          - "Third-party access log: '2026-02-14 10:23:15 - User: vendor-xyz-admin@example.com (Third-party: Vendor XYZ) - Action: Accessed production logs - Resource: /logs/ai-inference - Session ID: abc123'"
          - "CloudTrail integration: All third-party IAM user actions logged with: timestamp, user identity, third-party organization, API calls made, resources accessed, IP address, success/failure"
          - "Separate third-party audit trail: Dedicated log stream for third-party access, retained for 2 years (longer than standard logs), tamper-evident, exported to SIEM"
      - type: metadata_capture
        description: "Rich metadata captured for forensic analysis and anomaly detection"
        examples:
          - "Access metadata fields: Third-party organization, user identity, timestamp, source IP, geographic location, accessed resources, actions performed, data volume transferred, session duration"
          - "Context enrichment: Third-party access tagged with: purpose (support, audit, integration), approval ticket reference, authorized scope, deviation from normal patterns"
          - "Metadata example: 'Third-party: Auditor ABC, User: jane.auditor@abc.com, Time: 2026-02-14 14:00-16:30 (2.5 hrs), Purpose: SOC2 audit, Approval: TICK-5678, Resources: Config files (15), Logs (0), Data export: None, Anomalies: None'"
      - type: monitoring_alerts
        description: "Automated alerts for anomalous third-party access patterns"
        examples:
          - "Alert rules: Third-party accesses outside authorized scope → Immediate alert, Access during off-hours → Alert, Data export by third-party → Alert + approval required, Failed authentication attempts → Alert"
          - "Anomaly detection: Baseline third-party access patterns, alert on deviations (unusual resources, high volume, geographic anomaly, time anomaly)"
          - "Alert example: 'ALERT: Third-party Vendor XYZ attempted database access (not in authorized scope) at 2026-02-14 03:15 (off-hours). Access DENIED. Investigate.'"
    scoring:
      full: Third-party access monitoring with defined scope, logging, and metadata capture
      partial: Some third-party access logging exists but scope definition or metadata capture is incomplete
      none: No third-party access monitoring
    sub_questions:
      - Is the third-party interaction scope defined with comprehensive logging?
      - Is access metadata captured for all third-party interactions?
    test_scenarios:
      - scenario: "Third-party scope enforced"
        expected_evidence: ["Third-party user attempts out-of-scope access", "Verify access denied", "Alert generated and logged"]
        pass_criteria: "Scope enforcement automatic, out-of-scope access blocked, security team alerted"
      - scenario: "Comprehensive logging operational"
        expected_evidence: ["All third-party access logged", "Logs include rich metadata", "Logs retained per policy"]
        pass_criteria: "100% of third-party sessions logged, metadata complete, retention ≥2 years"
      - scenario: "Anomaly detection functional"
        expected_evidence: ["Simulate anomalous third-party access", "Verify alert triggered", "Alert includes context for investigation"]
        pass_criteria: "Anomalies detected, alerts fired within 5 minutes, context sufficient for triage"
    gap_examples:
      - gap: "Third-party access granted but not monitored"
        indicator: "Vendors have credentials but their access not tracked separately, mixed with internal user logs, no visibility into third-party actions"
        remediation: "Create separate third-party IAM users/roles, tag all third-party access, configure dedicated logging, implement monitoring dashboard"
      - gap: "Scope defined but not enforced technically"
        indicator: "Third-party access agreements specify scope but IAM permissions overly broad, relying on policy not technical controls"
        remediation: "Implement least privilege IAM policies matching documented scope, use IAM conditions to restrict resources/actions, audit third-party permissions quarterly"
      - gap: "Basic logging only, no metadata or anomaly detection"
        indicator: "Standard access logs exist but don't identify third-party specifically, no contextual metadata, anomalous access undetected"
        remediation: "Enrich logs with third-party metadata (organization, purpose, approval), implement anomaly detection rules, integrate with SIEM for correlation"
    risk_weight: LOW
  - id: Q-AIUC1-E010
    text: Has the organization established and implemented an AI acceptable use policy defining
      prohibited usage with detection, monitoring, and user feedback for violations?
    category: accountability
    status: mandatory
    frequency: Every 12 months
    controls:
      aiuc-1: E010
    canonical_question_id: ACCOUNTABILITY-AUP-001
    evidence_required:
      - type: policy_document
        description: "AI acceptable use policy defining prohibited usage categories with concrete examples"
        examples:
          - "AI Acceptable Use Policy v1.3 listing prohibited uses: jailbreaking, harmful content, illegal material, harassment, system abuse"
          - "Terms of Service Section 5: Prohibited Uses with AI-specific examples and enforcement consequences"
      - type: detection_configuration
        description: "Detection systems implemented to identify policy violations"
        examples:
          - "OpenAI Moderation API integration showing content filtering for harmful outputs"
          - "Rate limiting configuration enforcing 100 requests/hour per user to prevent abuse"
          - "Content filtering dashboard showing blocked requests by violation category (last 30 days)"
      - type: user_feedback
        description: "User violation notification mechanisms providing clear feedback"
        examples:
          - "Error message template: 'This request violates our Acceptable Use Policy. See policy: [link]'"
          - "Screenshots of user-facing violation messages with policy context and acceptable alternatives"
    scoring:
      full: Documented acceptable use policy with detection systems and user violation alerts
      partial: Acceptable use policy exists but detection or user feedback mechanisms are incomplete
      none: No AI acceptable use policy
    sub_questions:
      - Is prohibited AI usage clearly defined with concrete examples?
      - Are detection systems implemented (content filtering, rate limiting, pattern detection)?
      - Are users alerted when violations occur with clear explanations?
    test_scenarios:
      - scenario: "Policy violation detection"
        expected_evidence: ["Submit prohibited content test cases, verify detection blocks requests and provides clear feedback"]
        pass_criteria: "Detection identifies >90% of test violations with clear user feedback"
    gap_examples:
      - gap: "Policy exists but no detection systems"
        indicator: "Policy documented but no technical controls to detect violations"
        remediation: "Implement content filtering, add rate limiting, deploy violation logging"
    risk_weight: MEDIUM
  - id: Q-AIUC1-E011
    text: Are AI data processing locations documented and maintained?
    category: accountability
    status: mandatory
    frequency: Every 12 months
    controls:
      aiuc-1: E011
    canonical_question_id: ACCOUNTABILITY-LOCATION-001
    evidence_required:
      - type: location_inventory
        description: "AI infrastructure location documentation with all processing components and geographic locations"
        examples:
          - "Infrastructure inventory spreadsheet: AI System, Cloud Region, Country, Data Types, Regulatory Requirements"
          - "AWS Config report showing all inference endpoints by region (us-east-1, eu-west-1, ap-southeast-1)"
          - "Data flow diagram showing data movement: user location → inference region → storage region"
      - type: transfer_documentation
        description: "Cross-border data transfer mechanisms and compliance documentation"
        examples:
          - "Standard Contractual Clauses (SCCs) with cloud provider for EU-US data transfers"
          - "Data transfer impact assessment (DTIA) for GDPR Article 46 compliance"
          - "Transfer mechanism matrix: Source Country, Destination Country, Legal Basis (SCCs, Adequacy, BCRs)"
      - type: review_records
        description: "Annual documentation review records verifying location accuracy"
        examples:
          - "2025 Annual Location Review: 12 AI systems audited, 3 location updates required, completed Dec 2025"
          - "Infrastructure change notification configuration showing alerts for new region deployments"
    scoring:
      full: Documented processing locations with regular reviews and transfer compliance procedures
      partial: Processing locations partially documented but reviews or transfer compliance incomplete
      none: No documentation of AI data processing locations
    sub_questions:
      - Is AI infrastructure location documentation maintained with countries and cloud regions?
      - Are cross-border data transfer mechanisms documented (SCCs, adequacy decisions)?
      - Are annual reviews conducted to verify location documentation accuracy?
    test_scenarios:
      - scenario: "Location documentation accuracy"
        expected_evidence: ["Audit actual infrastructure vs documented locations, verify <5% discrepancy rate"]
        pass_criteria: "Documented locations match actual infrastructure deployment"
    gap_examples:
      - gap: "Processing locations never documented"
        indicator: "Organization uses cloud AI services but no documentation of which regions process data"
        remediation: "Conduct infrastructure inventory, document cloud regions and countries, identify cross-border transfers"
    risk_weight: MEDIUM
  - id: Q-AIUC1-E012
    text: Are applicable AI laws, standards, required data protections, and compliance strategies
      documented?
    category: accountability
    status: mandatory
    frequency: Every 6 months
    controls:
      aiuc-1: E012
    canonical_question_id: ACCOUNTABILITY-REGULATORY-001
    evidence_required:
      - type: regulatory_inventory
        description: "Applicable AI regulations identified for all operating jurisdictions"
        examples:
          - "Regulatory compliance matrix: Jurisdiction, Regulation (EU AI Act, Colorado AI Act, NYC 144), AI Systems Affected"
          - "AI system risk classification: System A = EU AI Act High-Risk (hiring), System B = Colorado High-Risk (insurance)"
          - "Regulatory monitoring sources: IAPP AI Tracker subscriptions, AI Law Blog alerts, legal counsel briefs"
      - type: compliance_strategies
        description: "Compliance procedures and strategies documented for each applicable regulation"
        examples:
          - "EU AI Act Compliance Roadmap: Gap analysis, priority initiatives, timelines (target: Aug 2026 enforcement)"
          - "Compliance requirements matrix: Regulation → Required Controls → Implementation Status → Assigned Owner"
          - "Risk acceptance documentation for deferred compliance items with executive approval"
      - type: review_records
        description: "Semi-annual regulatory repository reviews documenting updates"
        examples:
          - "H2 2025 Regulatory Review: EU AI Act final text incorporated, Colorado AI Act added, strategies revised"
          - "Review includes: new regulations enacted, AI system risk re-classifications, compliance timeline updates"
    scoring:
      full: Comprehensive regulatory compliance documentation with semi-annual reviews
      partial: Some regulatory compliance documented but coverage or review frequency is insufficient
      none: No documentation of regulatory compliance for AI
    sub_questions:
      - Are AI regulations identified for all operating jurisdictions (EU, US states, industry-specific)?
      - Are AI systems risk-classified under applicable regulations (EU high-risk, Colorado high-risk)?
      - Are compliance strategies documented with gap analysis and prioritized roadmaps?
      - Are semi-annual reviews conducted updating for new regulations and enforcement guidance?
    test_scenarios:
      - scenario: "Regulatory identification completeness"
        expected_evidence: ["Review jurisdictions from E011 locations, verify AI regulations identified for each"]
        pass_criteria: "All applicable jurisdictions have identified regulations documented"
    gap_examples:
      - gap: "No regulatory compliance documentation"
        indicator: "AI systems deployed in EU and US but no documentation of applicable laws or compliance strategies"
        remediation: "Conduct regulatory research, classify AI systems under regulations, develop compliance roadmap"
    risk_weight: MEDIUM
  - id: Q-AIUC1-E013
    text: Is a quality management system established for AI systems proportionate to the size of the
      organization?
    category: accountability
    status: optional
    frequency: Every 12 months
    controls:
      aiuc-1: E013
    canonical_question_id: ACCOUNTABILITY-QMS-001
    evidence_required:
      - type: qms_scope
        description: "QMS scope documentation proportionate to organization size and AI risk profile"
        examples:
          - "QMS Scope Document: Covers 3 high-risk AI systems (hiring, credit, medical), lifecycle phases (design, dev, deploy, monitor)"
          - "Quality objectives: Accuracy >95%, Bias delta <5% across demographics, Incident rate <0.1% of decisions"
          - "Small org lightweight QMS: Checklist-based procedures vs large org ISO 42001 comprehensive system"
      - type: quality_procedures
        description: "Design, development, and quality assurance procedures with AI-specific requirements"
        examples:
          - "AI Development Quality Procedure v2.3: Design requirements, code review standards, testing gates, deployment approvals"
          - "Data quality validation procedure: Training data provenance checks, bias audits, fairness testing requirements"
          - "Quality control workflow: Peer reviews required, automated testing gates, production deployment approvals with QA signoff"
      - type: qms_accountability
        description: "Organizational accountability for QMS with assigned roles and RACI matrix"
        examples:
          - "QMS RACI: Quality Manager (overall QMS), Process Owners (procedure maintenance), Auditors (compliance verification)"
          - "Quality management role assignments: Sarah Chen (Quality Manager), Dev team leads (Process Owners), Compliance team (Auditors)"
      - type: management_reviews
        description: "Quarterly QMS management reviews with effectiveness metrics"
        examples:
          - "Q4 2025 QMS Review: 12 non-conformances (down from 18), audit findings resolved, bias testing procedure updated"
          - "QMS metrics tracked: Non-conformance rates, audit findings, corrective action completion, quality objective achievement"
    scoring:
      full: Proportionate QMS with documented procedures, conformity assessment, and assigned accountability
      partial: Some quality procedures exist but QMS is not comprehensive or accountability is unclear
      none: No quality management system for AI
    sub_questions:
      - Is QMS scope defined proportionate to organization size (lightweight for small, comprehensive for large)?
      - Are AI-specific quality procedures documented (data quality, bias testing, fairness metrics)?
      - Is quality manager or owner assigned with clear accountability and authority?
      - Are quarterly management reviews conducted with QMS effectiveness metrics?
    test_scenarios:
      - scenario: "Quality procedures adherence"
        expected_evidence: ["Observe development process, verify quality procedures followed (code reviews, testing gates, approvals)"]
        pass_criteria: "Documented procedures followed in practice, verified through audits or process observation"
    gap_examples:
      - gap: "No quality management system"
        indicator: "High-risk AI systems deployed with ad-hoc quality processes, no systematic procedures"
        remediation: "Establish lightweight QMS with critical procedures (design verification, testing, deployment approval), assign quality owner"
    risk_weight: LOW
  - id: Q-AIUC1-E014
    text: Are policies established for sharing transparency reports with relevant stakeholders including
      regulators and customers?
    category: accountability
    status: optional
    frequency: Every 12 months
    controls:
      aiuc-1: E014
    canonical_question_id: ACCOUNTABILITY-TRANSPARENCY-REPORT-001
    evidence_required:
      - type: reporting_policy
        description: "Transparency reporting policy defining scope, audiences, content, and frequency"
        examples:
          - "Transparency Reporting Policy v1.2: Annual reports to customers and regulators, content includes performance metrics, safety incidents, bias testing, governance"
          - "Audience-specific report versions: Detailed for regulators, highlights for customers, accessible for public"
          - "Report content areas: AI system usage volumes, performance statistics, safety incidents, bias testing results, governance activities"
      - type: information_protection
        description: "Sensitive information handling with sanitization and review procedures"
        examples:
          - "Information protection checklist: Trade secrets excluded, customer PII redacted, security vulnerabilities sanitized, competitive data aggregated"
          - "Review workflow: Legal review for privileged info, security review for vulnerabilities, executive approval for external reports"
      - type: published_reports
        description: "Published transparency reports with evidence of stakeholder distribution"
        examples:
          - "2025 AI Transparency Report published Nov 2025: 15 pages covering 5 AI systems, 12k user interactions, 3 safety incidents resolved"
          - "Report distribution records: Sent to 20 enterprise customers via authenticated portal, submitted to regulator via secure email"
      - type: stakeholder_feedback
        description: "Stakeholder feedback collected and incorporated into report improvements"
        examples:
          - "Customer feedback survey (15 responses): 80% found report useful, requests for more detailed bias metrics → added to 2026 report"
          - "Regulatory feedback: Request for additional performance disaggregation → incorporated into next report version"
    scoring:
      full: Transparency reports with defined scope, sanitized content, and secure delivery
      partial: Some transparency reporting exists but scope or delivery methods are informal
      none: No transparency reporting policies
    sub_questions:
      - Is transparency reporting policy defined with scope, audiences, and frequency?
      - Are published transparency reports distributed to stakeholders with substantive metrics?
      - Is sensitive information properly sanitized through legal and security review?
      - Is stakeholder feedback collected and incorporated into report improvements?
    test_scenarios:
      - scenario: "Published report validation"
        expected_evidence: ["Review last 12 months of reports, verify substantive content (not just aspirational statements), stakeholder distribution"]
        pass_criteria: "Transparency reports published on schedule with concrete metrics and stakeholder feedback"
    gap_examples:
      - gap: "Transparency report is marketing document without metrics"
        indicator: "Report contains aspirational statements but no concrete performance data, incident counts, or bias testing results"
        remediation: "Add substantive metrics: usage volumes, performance statistics, safety incidents, bias testing results, year-over-year comparisons"
    risk_weight: LOW
  - id: Q-AIUC1-E015
    text: Are logs maintained of AI system processes, actions, and model outputs to support incident
      investigation, auditing, and explanation of AI system behavior?
    category: accountability
    status: mandatory
    frequency: Every 12 months
    controls:
      aiuc-1: E015
    canonical_question_id: ACCOUNTABILITY-LOGGING-001
    evidence_required:
      - type: logging_configuration
        description: "AI activity logging instrumentation capturing required fields"
        examples:
          - "Log schema: timestamp, user_id (pseudonymized), ai_system, input_hash, output_summary, confidence_score, processing_time, errors"
          - "Structured logging code samples showing capture of inputs (hashed), outputs, confidence, errors at inference points"
          - "Privacy-preserving logging: Full prompts hashed (SHA-256), metadata logged, retrieve full content only for investigations"
      - type: log_storage
        description: "Log storage with appropriate retention periods and encryption"
        examples:
          - "Datadog log retention configuration: 90 days operational logs, 2 years audit logs, automatic expiration enforcement"
          - "AWS CloudWatch Logs with encryption at rest (KMS), retention policies by log type, S3 archival for compliance logs"
          - "Retention by purpose: 90 days debugging, 2 years incident investigation, 7 years if compliance-mandated (financial AI)"
      - type: access_controls
        description: "Log access controls with RBAC and audit trail of access events"
        examples:
          - "RBAC configuration: Engineering (operational logs), Security (incident investigation), Compliance (audit logs), minimum necessary access"
          - "Log access audit trail showing: who accessed which logs, when, for what purpose (investigation ticket reference)"
      - type: investigation_procedures
        description: "Log analysis procedures and runbooks for incident investigation"
        examples:
          - "Incident investigation runbook: How to trace user interaction, identify harmful output, explain AI behavior from logs"
          - "Log query templates for common scenarios: bias investigation, performance troubleshooting, policy violation tracing"
    scoring:
      full: Comprehensive activity logging with appropriate retention for auditing and investigation
      partial: Some logging exists but coverage or retention is insufficient
      none: No AI model activity logging
    sub_questions:
      - Are AI system interactions logged with required fields (timestamp, user, input, output, confidence)?
      - Are logs stored with appropriate retention periods (90 days operational, 1-2 years audit)?
      - Are log access controls implemented with RBAC and audit trail of accesses?
      - Are investigation procedures documented for using logs in incident response?
    test_scenarios:
      - scenario: "Logging coverage validation"
        expected_evidence: ["Sample 10 AI interactions, verify each logged with all required fields"]
        pass_criteria: "Logging coverage >95% with comprehensive field capture"
      - scenario: "Incident investigation simulation"
        expected_evidence: ["Simulate harmful output incident, use logs to trace interaction and explain AI behavior"]
        pass_criteria: "Logs provide sufficient context for investigation and root cause analysis"
    gap_examples:
      - gap: "No AI activity logging"
        indicator: "AI systems deployed with no logging of user inputs, outputs, or processing events"
        remediation: "Implement structured logging: log inputs (hashed), outputs, confidence, errors, timestamps, deploy centralized storage"
      - gap: "Logs capture full prompts violating privacy"
        indicator: "Logging stores complete user inputs in plaintext accessible to engineering team, no hashing or anonymization"
        remediation: "Implement privacy-preserving logging: hash full prompts, store hashes only, retrieve full content from secure storage for investigations"
    risk_weight: MEDIUM
  - id: Q-AIUC1-E016
    text: Are clear disclosure mechanisms implemented to inform users when they are interacting with AI
      systems rather than human operators?
    category: accountability
    status: mandatory
    frequency: Every 12 months
    controls:
      aiuc-1: E016
    canonical_question_id: ACCOUNTABILITY-DISCLOSURE-001
    evidence_required:
      - type: disclosure_implementation
        description: "AI disclosure mechanisms at interaction start in plain language"
        examples:
          - "Chatbot first message: 'Hi! I'm an AI assistant powered by GPT-4. I can help with...' before user input"
          - "Automated decision notification: 'This credit decision was made by AI based on your application data and credit history'"
          - "Voice assistant wake response: 'I'm an AI assistant. How can I help you today?'"
      - type: persistent_indicators
        description: "Persistent disclosure indicators maintained throughout interactions"
        examples:
          - "Chat interface persistent 'AI' badge visible at all times, cannot be dismissed by user"
          - "Voice assistant periodic reminders every 5 conversational turns: 'Just a reminder, I'm an AI assistant'"
          - "Automated decision confirmation screens showing 'AI Decision' indicator prominently"
      - type: content_labeling
        description: "Machine-readable labeling for AI-generated content"
        examples:
          - "Content Credentials (C2PA) metadata on AI-generated images showing model, generation timestamp"
          - "HTML meta tags: <meta name='generator' content='AI-GPT-4'> for AI-generated text"
          - "API response headers: X-AI-Generated: model-gpt-4-turbo, timestamp: 2025-11-15T10:30:00Z"
          - "Watermarking for AI-generated images (SynthID, invisible steganography)"
      - type: user_testing
        description: "User testing results validating disclosure effectiveness"
        examples:
          - "User comprehension testing (n=20): 95% correctly identify AI nature after interaction, 90% recall seeing disclosure"
          - "Noticeability testing: Eye-tracking shows 92% of users notice disclosure within first 3 seconds"
          - "Behavioral impact study: Disclosure doesn't significantly degrade user experience (satisfaction scores stable)"
    scoring:
      full: Clear AI disclosure at start with maintained visibility and machine-readable content labeling
      partial: AI disclosure exists but not conspicuous or maintained throughout interactions
      none: No AI disclosure mechanisms
    sub_questions:
      - Is AI interaction disclosed clearly at communication start in plain language?
      - Are persistent disclosure indicators maintained throughout interactions (visible badges, periodic reminders)?
      - Is machine-readable content labeling implemented (C2PA, watermarks, API headers)?
      - Has user testing validated disclosure comprehension and noticeability (>90% comprehension rate)?
    test_scenarios:
      - scenario: "Disclosure presence and timing"
        expected_evidence: ["Initiate AI interaction, verify disclosure appears before user input, clearly states AI nature"]
        pass_criteria: "All user-facing AI systems disclose AI nature clearly at interaction start"
      - scenario: "User comprehension testing"
        expected_evidence: ["Recruit 10+ users, have them interact, ask 'AI or human?' after, measure comprehension rate"]
        pass_criteria: ">90% users correctly identify AI nature and recall disclosure"
      - scenario: "Machine-readable labeling validation"
        expected_evidence: ["Generate AI content, inspect metadata for C2PA/watermarks/headers, verify detectability"]
        pass_criteria: "AI-generated content includes machine-readable provenance labels"
    gap_examples:
      - gap: "No AI disclosure implemented"
        indicator: "Chatbot deployed with no indication users are interacting with AI, resembles human chat interface"
        remediation: "Implement clear disclosure in first message, add persistent 'AI' badge, test disclosure with users"
      - gap: "Disclosure too subtle, users don't notice"
        indicator: "AI disclosure in small gray footer text, user testing shows only 30% notice before interacting"
        remediation: "Redesign disclosure to be more prominent: initial message, larger badge, higher contrast, validate >90% noticeability"
      - gap: "AI content lacks machine-readable labels"
        indicator: "AI-generated text and images have no technical attribution, no C2PA, watermarks, or headers"
        remediation: "Implement Content Credentials (C2PA) for images, add HTML meta tags for text, watermarking for visual content"
    risk_weight: MEDIUM
  - id: Q-AIUC1-E017
    text: Is a system transparency policy established with a repository of model cards, datasheets, and
      interpretability reports for major AI systems?
    category: accountability
    status: optional
    frequency: Every 12 months
    controls:
      aiuc-1: E017
    canonical_question_id: ACCOUNTABILITY-SYSTEM-TRANSPARENCY-001
    evidence_required:
      - type: transparency_policy
        description: "System transparency policy defining documentation requirements and update triggers"
        examples:
          - "Transparency Policy v1.1: All high-risk AI systems require model cards, datasheets, interpretability reports, updated annually or on material changes"
          - "Documentation scope: Customer-facing and high-impact systems (hiring, credit, medical), excludes low-risk internal tools"
          - "Update triggers: New model version, material performance change (>5% accuracy delta), regulatory request, annual review"
      - type: model_cards
        description: "Model cards for major AI systems following industry standards"
        examples:
          - "Credit Scoring Model Card v2.3: Intended use (consumer credit decisions), performance metrics (accuracy 94%, FPR 3%), limitations (lower accuracy for thin-file applicants), fairness considerations (5% approval rate delta across demographics)"
          - "Hiring AI Model Card: Training data (10M anonymized resumes), known failure modes (struggles with non-traditional backgrounds), environmental impact (1200 kWh training cost)"
      - type: datasheets
        description: "Datasheets for training datasets documenting provenance and characteristics"
        examples:
          - "Resume Training Dataset Datasheet: 10M resumes, 2018-2023, sources (job boards, partnerships), demographics (60% male, 40% female, US-focused), known biases (underrepresents non-traditional education paths)"
          - "Dataset provenance: Original sources, collection methodology, preprocessing steps, known quality issues, update frequency"
      - type: interpretability_reports
        description: "Interpretability reports with explainability analysis using state-of-art techniques"
        examples:
          - "Credit Model Interpretability Report: SHAP analysis showing feature importance (income 35%, credit history 28%, debt ratio 22%), counterfactual examples, attention visualization"
          - "Explainability techniques used: SHAP, LIME, feature importance, decision tree approximations, validated against actual model behavior"
      - type: centralized_repository
        description: "Centralized transparency documentation repository with access controls and version history"
        examples:
          - "Confluence AI Transparency Repository: 12 AI systems documented, internal full access, sanitized customer versions, version history tracked"
          - "Access controls: Internal (full technical details), Customer (sanitized, NDA-protected), Public (high-level only)"
    scoring:
      full: Transparency policy with centralized repository, access controls, and regular documentation updates
      partial: Some system documentation exists but not centralized or regularly updated
      none: No system transparency policy or documentation repository
    sub_questions:
      - Is transparency policy defined with scope (which systems require documentation) and update triggers?
      - Are model cards documented for major AI systems with performance, limitations, fairness considerations?
      - Are datasheets created for training datasets with provenance and known biases?
      - Are interpretability reports generated with explainability analysis (SHAP, LIME, feature importance)?
      - Is centralized repository maintained with version history and audience-specific access controls?
      - Are documentation updates integrated with AI system change management (updated when systems modified)?
    test_scenarios:
      - scenario: "Model card completeness"
        expected_evidence: ["Select 5 major AI systems, review model cards for required sections: intended use, performance, limitations, fairness"]
        pass_criteria: "Model cards complete with all sections and candid limitation disclosure"
      - scenario: "Documentation currency validation"
        expected_evidence: ["Review last 12 months of system changes, verify documentation updated for material changes"]
        pass_criteria: "Documentation reflects current system state, updated within 30 days of material changes"
      - scenario: "Repository accessibility"
        expected_evidence: ["Access centralized repository, verify all in-scope systems documented, appropriate access controls"]
        pass_criteria: "Comprehensive coverage with version-controlled, access-managed repository"
    gap_examples:
      - gap: "No transparency documentation exists"
        indicator: "Multiple AI systems deployed but no model cards, datasheets, or interpretability reports, details in tribal knowledge"
        remediation: "Establish transparency policy, create templates, document 3-5 highest-priority systems as pilot, establish centralized repository"
      - gap: "Documentation created at launch but never updated"
        indicator: "Model cards from 18 months ago, models updated 5 times since with no documentation updates"
        remediation: "Update all documentation to current state, integrate updates into change management, mandate updates before redeployment"
      - gap: "Model cards lack candor about limitations"
        indicator: "Model cards show performance metrics but omit known failure modes: 15% higher false rejection for protected groups"
        remediation: "Revise model cards to include known failures, document demographic performance gaps explicitly, legal review for appropriate transparency"
    risk_weight: LOW
  - id: Q-AIUC1-F001
    text: Are guardrails implemented or documented to prevent AI-enabled misuse for cyber attacks and
      exploitation?
    category: society
    status: mandatory
    frequency: Every 12 months
    controls:
      aiuc-1: F001
    canonical_question_id: SOCIETY-CYBER-001
    evidence_required:
      - type: provider_testing_results
        description: "Foundation model provider cyber capability testing results and safety documentation"
        examples:
          - "OpenAI GPT-4 System Card: Offensive cyber capability testing results showing malware generation risk assessment and mitigations"
          - "Anthropic Claude RSP (Responsible Scaling Policy): ASL-3 cyber capability testing with exploit development assessments"
          - "Provider red-teaming report: Cyber attack scenario testing results, jailbreaking resistance, and safety control effectiveness"
      - type: provider_attestation
        description: "Formal attestation from provider confirming cyber mitigations intact in deployed model version"
        examples:
          - "Formal letter from Anthropic (dated 2025-11-15) confirming Claude 3.5 Sonnet has cyber safety mitigations intact per ASL-3 testing"
          - "OpenAI attestation: GPT-4-turbo-2024-04-09 maintains offensive cyber capability mitigations from System Card testing"
          - "Vendor contract addendum: Provider commits to notify within 30 days if cyber safety mitigations materially change"
      - type: supplementary_controls
        description: "Supplementary content filtering or monitoring for cyber exploitation (if high-risk use case)"
        examples:
          - "Guardrails AI configuration blocking keywords: malware, exploit, shellcode, with cyber-specific validators"
          - "Usage monitoring logs showing rejected queries categorized as cyber-related (malware generation, vulnerability exploitation)"
          - "SOC integration: Cyber misuse alerts escalated to security team for investigation when >5 rejections per user detected"
      - type: attestation_management
        description: "Attestation renewal process and model version tracking"
        examples:
          - "Model inventory: AI System A uses Claude 3.5 Sonnet, cyber attestation dated 2025-11-15, expires 2026-11-15"
          - "Attestation renewal workflow: Annual reminder triggers attestation request, tracked in procurement system"
          - "Model update change control: Requires re-attestation before deploying new model version"
    scoring:
      full: Provider cyber attestation documented with testing results, attestation current (<12 months), supplementary controls for high-risk deployments
      partial: Provider relied upon for cyber safety but attestation informal or stale (>12 months), no supplementary monitoring
      none: No cyber safety attestation from provider, no cyber misuse guardrails documented
    sub_questions:
      - Are offensive cyber capability testing results from foundation model developer documented (malware generation, exploit development)?
      - Is formal attestation obtained confirming cyber mitigations intact in the deployed model version?
      - Is attestation current (dated within last 12 months or since last model update)?
      - Are supplementary cyber misuse controls implemented for high-risk use cases (coding assistants, public systems)?
      - Is model inventory tracking cyber attestation status and expiration dates?
    test_scenarios:
      - scenario: "Provider attestation completeness and currency"
        expected_evidence: ["Review model inventory, verify cyber attestation for each foundation model with testing results and attestation <12 months old"]
        pass_criteria: "All foundation models have formal cyber safety attestation current within 12 months"
      - scenario: "Attestation validation"
        expected_evidence: ["Review attestation content: testing scope (malware, exploits), mitigations implemented, model version covered"]
        pass_criteria: "Attestation references specific model version, testing methodologies, and mitigation commitments"
      - scenario: "Supplementary controls for high-risk systems"
        expected_evidence: ["Identify high-risk deployments (coding assistants, public systems), verify supplementary filtering or monitoring implemented"]
        pass_criteria: "High-risk systems have supplementary cyber misuse controls beyond provider safeguards"
    gap_examples:
      - gap: "No provider attestation obtained"
        indicator: "AI coding assistant deployed but no documentation of provider's cyber safety testing or attestation"
        remediation: "Request cyber safety documentation from provider, obtain formal attestation for deployed model version"
      - gap: "Attestation stale after model updates"
        indicator: "Claude attestation from 2024 but organization now uses Claude 3.5 Sonnet deployed in 2025"
        remediation: "Re-verify attestation with provider for current model version, establish re-attestation process for model updates"
      - gap: "Public coding assistant has no supplementary monitoring"
        indicator: "Coding assistant accessible to public relies solely on provider safeguards with zero cyber misuse logging"
        remediation: "Implement logging of rejected cyber-related queries, flag users with repeated violations, integrate with SOC"
    risk_weight: MEDIUM
  - id: Q-AIUC1-F002
    text: Are guardrails implemented or documented to prevent AI-enabled catastrophic misuse involving
      chemical, biological, radiological, or nuclear (CBRN) weapons development or mass harm
      scenarios?
    category: society
    status: mandatory
    frequency: Every 12 months
    controls:
      aiuc-1: F002
    canonical_question_id: SOCIETY-CBRN-001
    evidence_required:
      - type: provider_cbrn_testing
        description: "Foundation model provider CBRN capability testing documentation covering all CBRN categories"
        examples:
          - "Anthropic RSP ASL-3 CBRN Testing: Chemical synthesis pathway uplift assessment, biological agent information testing, radiological material queries"
          - "OpenAI Preparedness Framework CBRN Evaluations: Nuclear weapon design assistance testing, WMD information uplift vs public sources"
          - "Provider red-teaming report: CBRN scenario testing (chemical weapons, bioweapons, nuclear proliferation) with mitigation effectiveness"
      - type: cbrn_attestation
        description: "Formal attestation from provider confirming CBRN mitigations intact across all categories"
        examples:
          - "Formal letter from Google DeepMind confirming Gemini Pro has CBRN mitigations intact per Frontier Safety Framework (chemical, biological, radiological, nuclear)"
          - "Anthropic attestation: Claude 3.5 Sonnet maintains CBRN safety controls from ASL-3 testing, no material changes to mitigations"
          - "Vendor contract: Provider commits to immediate notification if CBRN mitigations degraded or removed"
      - type: evaluation_benchmarks
        description: "CBRN evaluation benchmark applicability assessment and results (if applicable)"
        examples:
          - "CAIS WMD Proxy Benchmark: Applied to GPT-4, results show low uplift risk for WMD development (detailed report attached)"
          - "NIST AI Safety Institute CBRN Evaluation: Assessment conducted Dec 2025, model classified as acceptable CBRN risk"
          - "Benchmark applicability rationale: CAIS WMD not applicable to narrow-domain AI with no scientific knowledge capabilities"
      - type: supplementary_cbrn_controls
        description: "Supplementary CBRN content filtering or monitoring (if high-risk use case)"
        examples:
          - "CBRN keyword filtering (domain expert-designed): Blocks weapons development queries while allowing legitimate chemistry/biology education"
          - "Usage monitoring logs: CBRN-related queries flagged (chemical synthesis for harmful agents, biological weapon production, radiological dispersal)"
          - "Domain expert consultation: Chemistry/biology/nuclear science advisors validated filter effectiveness with test cases"
    scoring:
      full: Provider CBRN attestation documented with testing results covering all categories, evaluation benchmarks assessed, attestation current (<12 months)
      partial: Provider CBRN attestation exists but incomplete (missing categories), testing results not detailed, or attestation stale (>12 months)
      none: No CBRN safety attestation from provider, no catastrophic misuse guardrails documented
    sub_questions:
      - Are CBRN capability testing results from foundation model developer documented covering chemical, biological, radiological, and nuclear categories?
      - Is formal attestation obtained confirming CBRN mitigations intact in the deployed model version?
      - Is attestation current (dated within last 12 months or since last model update)?
      - Have CBRN evaluation benchmarks been assessed for applicability (CAIS WMD, NIST evaluations)?
      - Are supplementary CBRN controls implemented for high-risk use cases (science assistance, research tools, educational systems)?
    test_scenarios:
      - scenario: "CBRN attestation completeness"
        expected_evidence: ["Review CBRN attestation to verify coverage of all categories: chemical, biological, radiological, nuclear with testing scope and mitigations"]
        pass_criteria: "Attestation covers all CBRN categories with specific testing methodologies and mitigation descriptions"
      - scenario: "CBRN evaluation benchmark assessment"
        expected_evidence: ["Review documented assessment of CBRN benchmark applicability (CAIS WMD, NIST), verify rationale if not used"]
        pass_criteria: "CBRN benchmarks assessed for applicability with results incorporated or rationale for non-use documented"
      - scenario: "Supplementary controls for science-capable systems"
        expected_evidence: ["Identify systems with scientific knowledge capabilities, verify CBRN filtering or monitoring for high-risk deployments"]
        pass_criteria: "High-risk science systems have supplementary CBRN controls distinguishing weapons development vs legitimate science"
    gap_examples:
      - gap: "No CBRN attestation for general-purpose AI"
        indicator: "LLM research assistant deployed with scientific knowledge but no CBRN attestation, assuming CBRN doesn't apply"
        remediation: "Recognize CBRN applies to any general-purpose AI with scientific knowledge, obtain CBRN attestation from provider"
      - gap: "CBRN attestation not validated for testing rigor"
        indicator: "Vendor said 'CBRN mitigations in place' but no review of actual testing methodology or uplift assessment"
        remediation: "Request detailed CBRN testing documentation (methodology, uplift results, red-teaming), validate rigor"
      - gap: "CBRN filtering blocks all chemistry content"
        indicator: "Overly broad filtering blocks high school chemistry, medical research, legitimate science (>40% false positive rate)"
        remediation: "Engage chemistry/biology domain experts to redesign filters distinguishing weapons vs education, reduce false positives <5%"
    risk_weight: MEDIUM
