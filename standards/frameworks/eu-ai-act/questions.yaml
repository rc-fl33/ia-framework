      - Disclosure notice and delivery mechanism documentation
      - Evidence disclosure reaches affected persons before or during exposure
    scoring:
      full: "All emotion recognition and biometric categorisation deployments have documented
        disclosure mechanism reaching affected persons"
      partial: "Disclosure exists for some deployments but not all, or delivery mechanism
        is unclear"
      none: "No disclosure to persons subject to emotion recognition or biometric categorisation"
    risk_weight: MEDIUM

