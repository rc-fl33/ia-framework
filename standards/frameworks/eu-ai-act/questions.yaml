questions:

  # ═══════════════════════════════════════════════════════════════════════════
  # CHAPTER II — PROHIBITED AI PRACTICES (Art 5)
  # Applies from: 2025-02-02
  # ═══════════════════════════════════════════════════════════════════════════

  - id: Q-EU-AI-ACT-CH2-001
    text: "Has the organization inventoried all AI systems in use and determined whether
      any fall under the prohibited practices listed in Article 5?"
    category: Chapter-II
    native_category: Chapter-II
    domain: governance
    controls:
      eu-ai-act: "Art-5"
      nist-ai-rmf: "MAP 5.1, GOVERN 6.1"
      iso-42001: "6.1.2, A.6.1.3"
      iso-24028: "Clause 8"
      aiuc-1: "A001, A002"
      iso-42005: "5.1, 5.2"
    evidence_required:
      - AI system inventory covering all deployed and procured AI systems
      - Documented assessment of each system against Article 5 prohibited categories
      - Written legal or compliance sign-off on non-prohibited status
    scoring:
      full: "Complete AI inventory with documented Art 5 assessment and legal sign-off for
        each system, confirmed no prohibited systems are in use"
      partial: "Inventory exists but assessment is incomplete or undocumented"
      none: "No inventory or no assessment of prohibited practice risk"
    risk_weight: HIGH

  - id: Q-EU-AI-ACT-CH2-002
    text: "Does the organization use or plan to use real-time remote biometric identification
      in publicly accessible spaces, and if so, is use strictly limited to the narrow law
      enforcement exceptions in Article 5(1)(h)?"
    category: Chapter-II
    native_category: Chapter-II
    domain: governance
    controls:
      eu-ai-act: "Art-5"
      nist-ai-rmf: "MAP 5.1, GOVERN 6.1"
      iso-42001: "6.1.2, A.6.1.3, A.2.2"
      iso-24028: "Clause 8"
      aiuc-1: "A001, B001"
      iso-42005: "5.1, 5.2"
    evidence_required:
      - Biometric AI system inventory
      - Legal basis documentation citing applicable Art 5(1)(h) exception
      - Prior authorisation from competent judicial or independent authority
      - Documented scope limitations and proportionality assessment
    scoring:
      full: "No real-time remote biometric identification used, or use is strictly within
        Art 5(1)(h) exceptions with documented authorisation and proportionality assessment"
      partial: "Biometric system used with partial legal basis documentation, or authorisation
        scope unclear"
      none: "Real-time remote biometric identification in public spaces without documented
        legal exception"
    risk_weight: HIGH

  - id: Q-EU-AI-ACT-CH2-003
    text: "Does the organization use AI systems for social scoring, emotion recognition in
      workplace or educational settings, or manipulation of human behaviour, and if so, have
      these been assessed and confirmed not to violate Article 5 prohibitions?"
    category: Chapter-II
    native_category: Chapter-II
    domain: governance
    controls:
      eu-ai-act: "Art-5"
      nist-ai-rmf: "MAP 5.1, GOVERN 1.1"
      iso-42001: "6.1.2, A.6.1.3"
      iso-24028: "Clause 8"
      aiuc-1: "A001, A002, B001"
      iso-42005: "5.2"
    evidence_required:
      - Documented assessment for any social scoring, emotion recognition, or persuasion systems
      - Legal and ethics review confirming compliance or non-use
      - Any deployed use cases with documented justification against prohibited categories
    scoring:
      full: "No prohibited systems in use, documented assessment confirms compliance"
      partial: "Assessment performed but incomplete or not covering all relevant system types"
      none: "Systems in use with no assessment, or systems confirmed to violate Art 5"
    risk_weight: HIGH

  # ═══════════════════════════════════════════════════════════════════════════
  # CHAPTER III — HIGH-RISK CLASSIFICATION (Art 6-7)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: Q-EU-AI-ACT-CH3-001
    text: "Has the organization determined whether its AI systems fall under the high-risk
      classification criteria in Article 6, covering both Annex I (regulated product safety
      components) and Annex III (listed use-case areas)?"
    category: Chapter-III
    native_category: Chapter-III
    domain: governance
    controls:
      eu-ai-act: "Art-6"
      nist-ai-rmf: "MAP 1.1, MAP 1.5"
      iso-42001: "6.1.2, A.6.1.1, A.6.1.2"
      iso-24028: "Clause 4, Clause 5"
      aiuc-1: "B001, B002, B003"
      iso-42005: "5.2, 5.3"
    evidence_required:
      - AI system classification assessment for each system against Art 6(1) and Art 6(2)
      - Annex I product category review for AI in regulated products
      - Annex III use-case area review (biometrics, critical infrastructure, education,
        employment, essential services, law enforcement, migration, justice)
      - Documented classification decisions with rationale
    scoring:
      full: "Complete classification assessment for all AI systems, documented against both
        Annex I and Annex III criteria, with legal or compliance sign-off"
      partial: "Classification assessment performed but not comprehensive or not covering
        all AI systems"
      none: "No formal classification assessment performed"
    risk_weight: HIGH

  - id: Q-EU-AI-ACT-CH3-002
    text: "For AI systems that are borderline or unclear in risk classification, has the
      organization established a process to monitor Commission delegated acts under Article 7
      that may add new Annex III categories?"
    category: Chapter-III
    native_category: Chapter-III
    domain: governance
    controls:
      eu-ai-act: "Art-7"
      nist-ai-rmf: "GOVERN 1.4, MAP 1.1"
      iso-42001: "6.1.2, 10.1"
      iso-24028: "Clause 4"
      aiuc-1: "B001, F001"
      iso-42005: "5.3"
    evidence_required:
      - Regulatory monitoring process for EU AI Act delegated acts
      - Designated owner for tracking Annex III updates
      - Review cadence documentation
    scoring:
      full: "Regulatory monitoring process in place with documented owner and review cadence"
      partial: "Some monitoring but no formal process or unclear ownership"
      none: "No monitoring of delegated act updates"
    risk_weight: MEDIUM

  # ═══════════════════════════════════════════════════════════════════════════
  # CHAPTER III — REQUIREMENTS FOR HIGH-RISK AI (Art 8-15)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: Q-EU-AI-ACT-CH3-002B
    text: "Has the organization confirmed that all high-risk AI systems comply with the
      requirements in Articles 9-15, taking into account their intended purpose and the
      generally acknowledged state of the art, as required by Article 8?"
    category: Chapter-III
    native_category: Chapter-III
    domain: governance
    controls:
      eu-ai-act: "Art-8"
      nist-ai-rmf: "GOVERN 1.1, GOVERN 1.2, MAP 1.6"
      iso-42001: "8.1, 9.1, A.6.1.3"
      iso-24028: "Clause 5"
      aiuc-1: "C001, F001"
      iso-42005: "5.1"
    evidence_required:
      - Compliance confirmation covering all Art 9-15 requirements for each high-risk AI system
      - State-of-the-art assessment documenting technical standards and best practices referenced
      - Documented intended purpose for each high-risk AI system used in compliance assessment
    scoring:
      full: "Documented compliance confirmation for all Art 9-15 requirements per high-risk AI
        system, referencing applicable technical standards and intended purpose"
      partial: "Compliance confirmed for some requirements or some systems but not comprehensively"
      none: "No compliance confirmation process for high-risk AI system requirements"
    risk_weight: HIGH

  - id: Q-EU-AI-ACT-CH3-003
    text: "Has the organization established and documented a risk management system per
      Article 9 that covers the full lifecycle of each high-risk AI system?"
    category: Chapter-III
    native_category: Chapter-III
    domain: governance
    controls:
      eu-ai-act: "Art-9"
      nist-ai-rmf: "GOVERN 1.3, MAP 1.1, MAP 2.1, MAP 2.2, MANAGE 1.1"
      iso-42001: "6.1.1, 6.1.2, 8.3"
      iso-24028: "Clause 7"
      aiuc-1: "C001, C002, C003"
      iso-42005: "5.1, 5.2, 5.3"
    evidence_required:
      - Risk management system documentation (iterative process, lifecycle coverage)
      - Risk register identifying known and reasonably foreseeable risks
      - Residual risk assessment and accepted risk levels
      - Evidence of risk management system updates based on operational experience
    scoring:
      full: "Documented iterative risk management system covering identification, analysis,
        estimation, evaluation, and mitigation of risks for all high-risk AI systems"
      partial: "Risk management system exists but is not iterative, not lifecycle-covering,
        or not documented for all high-risk systems"
      none: "No risk management system for high-risk AI systems"
    risk_weight: HIGH

  - id: Q-EU-AI-ACT-CH3-004
    text: "Are training, validation, and testing datasets for high-risk AI systems subject
      to data governance practices per Article 10, including bias identification and
      representativeness assessment?"
    category: Chapter-III
    native_category: Chapter-III
    domain: data_protection
    controls:
      eu-ai-act: "Art-10"
      nist-ai-rmf: "MAP 2.1, MAP 3.5, MEASURE 2.5"
      iso-42001: "8.3, A.7.1, A.7.2, A.7.3"
      iso-24028: "Clause 6, Clause 7"
      aiuc-1: "C003, D001, D002"
      iso-42005: "5.4"
    evidence_required:
      - Data governance procedures for training/validation/testing datasets
      - Dataset representativeness and completeness assessment records
      - Bias identification and mitigation records
      - Data quality metrics and monitoring records
    scoring:
      full: "Documented data governance practices covering relevance, representativeness,
        completeness, bias identification, and mitigation for all high-risk AI training data"
      partial: "Data governance practices exist but are incomplete or not covering all
        required elements"
      none: "No data governance practices for high-risk AI training data"
    risk_weight: HIGH

  - id: Q-EU-AI-ACT-CH3-005
    text: "Has the organization prepared and maintained technical documentation per Article 11
      and Annex IV for each high-risk AI system before placing it on the market or putting
      it into service?"
    category: Chapter-III
    native_category: Chapter-III
    domain: governance
    controls:
      eu-ai-act: "Art-11"
      nist-ai-rmf: "GOVERN 1.2, MAP 1.6, MEASURE 1.1"
      iso-42001: "7.5, A.6.2.1, A.6.2.2"
      iso-24028: "Clause 7"
      aiuc-1: "C004, D003"
      iso-42005: "6.1, 6.2"
    evidence_required:
      - Technical documentation per Annex IV for each high-risk AI system
      - Documentation version control records showing updates
      - Process for maintaining documentation currency throughout lifecycle
    scoring:
      full: "Complete Annex IV technical documentation for all high-risk AI systems, with
        version control and a process for ongoing updates"
      partial: "Technical documentation exists but is incomplete, out of date, or not
        covering all high-risk systems"
      none: "No technical documentation for high-risk AI systems"
    risk_weight: HIGH

  - id: Q-EU-AI-ACT-CH3-006
    text: "Do high-risk AI systems provide automatic logging capability per Article 12 to
      enable traceability, and are logs retained for the required minimum period?"
    category: Chapter-III
    native_category: Chapter-III
    domain: monitoring
    controls:
      eu-ai-act: "Art-12"
      nist-ai-rmf: "MEASURE 1.1, MEASURE 2.6, MANAGE 2.2"
      iso-42001: "7.5, A.6.2.5, 9.1"
      iso-24028: "Clause 7"
      aiuc-1: "C004, D004"
      iso-42005: "6.1"
    evidence_required:
      - Technical specification of logging capability in AI systems
      - Log retention policy (minimum 6 months per Art 19 for providers)
      - Evidence that logs capture events sufficient to identify risks and substantial
        modifications
    scoring:
      full: "Automatic logging implemented and documented; logs retained for required period;
        log content covers Art 12 traceability requirements"
      partial: "Logging exists but coverage is incomplete or retention period not met"
      none: "No logging capability in high-risk AI systems"
    risk_weight: MEDIUM

  - id: Q-EU-AI-ACT-CH3-007
    text: "Are high-risk AI systems accompanied by instructions for use per Article 13,
      enabling deployers to interpret outputs and comply with their own obligations?"
    category: Chapter-III
    native_category: Chapter-III
    domain: governance
    controls:
      eu-ai-act: "Art-13"
      nist-ai-rmf: "GOVERN 4.1, GOVERN 4.2, MAP 1.6"
      iso-42001: "A.8.3, A.8.4, 7.5"
      iso-24028: "Clause 5, Clause 6"
      aiuc-1: "D001, D002, D003"
      iso-42005: "5.4, 6.1"
    evidence_required:
      - Instructions for use documentation covering Art 13 required elements
      - Evidence instructions are provided to deployers at time of system delivery
      - "Elements covered: provider identity, system characteristics, performance metrics,\
        \ limitations, human oversight measures, computational requirements"
    scoring:
      full: "Complete instructions for use covering all Art 13 elements, provided to all
        deployers"
      partial: "Instructions provided but missing some Art 13 required elements"
      none: "No instructions for use provided to deployers"
    risk_weight: MEDIUM

  - id: Q-EU-AI-ACT-CH3-008
    text: "Are high-risk AI systems designed to enable meaningful human oversight per
      Article 14, including the ability to understand, monitor, intervene, and override
      the AI system?"
    category: Chapter-III
    native_category: Chapter-III
    domain: governance
    controls:
      eu-ai-act: "Art-14"
      nist-ai-rmf: "GOVERN 1.1, MANAGE 1.3, MANAGE 2.4"
      iso-42001: "A.6.1.4, A.8.5, 5.3"
      iso-24028: "Clause 6, Clause 7"
      aiuc-1: "D005, E001, E002"
      iso-42005: "5.2"
    evidence_required:
      - Design documentation showing human oversight mechanisms
      - Evidence that oversight persons can understand AI capabilities and limitations
      - Override and intervention capability documentation
      - Automation bias awareness measures
    scoring:
      full: "Human oversight mechanisms designed and documented covering all Art 14
        requirements: understanding, monitoring, override, intervention, bias awareness"
      partial: "Some oversight mechanisms but not covering all Art 14 elements"
      none: "No human oversight provisions in high-risk AI system design"
    risk_weight: HIGH

  - id: Q-EU-AI-ACT-CH3-009
    text: "Have accuracy, robustness, and cybersecurity requirements per Article 15 been
      addressed in the design and testing of high-risk AI systems, including resilience
      against adversarial attacks?"
    category: Chapter-III
    native_category: Chapter-III
    domain: governance
    controls:
      eu-ai-act: "Art-15"
      nist-ai-rmf: "MEASURE 2.1, MEASURE 2.2, MEASURE 2.7"
      iso-42001: "A.9.1, A.9.2, 8.1"
      iso-24028: "Clause 5, Clause 6"
      aiuc-1: "C005, C006, E003"
      iso-42005: "5.2"
    evidence_required:
      - Accuracy metrics and benchmarks for the intended purpose
      - Robustness testing records including edge cases
      - Cybersecurity assessment and adversarial testing records
      - Fallback plan documentation
    scoring:
      full: "Accuracy benchmarks defined and tested; robustness and adversarial testing
        performed and documented; cybersecurity measures implemented with fallback plans"
      partial: "Some elements addressed but not comprehensive testing across all Art 15
        requirements"
      none: "No accuracy, robustness, or cybersecurity assessment performed"
    risk_weight: HIGH

  # ═══════════════════════════════════════════════════════════════════════════
  # CHAPTER III — PROVIDER OBLIGATIONS (Art 16-21)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: Q-EU-AI-ACT-CH3-010
    text: "Has the provider established a quality management system per Article 17 ensuring
      ongoing compliance of high-risk AI systems throughout their lifecycle?"
    category: Chapter-III
    native_category: Chapter-III
    domain: governance
    controls:
      eu-ai-act: "Art-16, Art-17"
      nist-ai-rmf: "GOVERN 1.2, GOVERN 1.7, MANAGE 4.1"
      iso-42001: "4.4, 9.1, 10.1, 10.2"
      iso-24028: "Clause 7"
      aiuc-1: "F001, F002"
      iso-42005: "5.1"
    evidence_required:
      - Quality management system documentation
      - Written policies and procedures for AI compliance
      - Roles and responsibilities definition
      - QMS review and update records
    scoring:
      full: "Documented QMS covering strategy, design control, testing, roles, and review
        procedures for all high-risk AI systems"
      partial: "QMS exists but is incomplete or not formally documented"
      none: "No quality management system for AI systems"
    risk_weight: HIGH

  - id: Q-EU-AI-ACT-CH3-011
    text: "Does the provider retain technical documentation and EU declaration of conformity
      for 10 years per Article 18, and are automatically generated logs retained for at
      least 6 months per Article 19?"
    category: Chapter-III
    native_category: Chapter-III
    domain: governance
    controls:
      eu-ai-act: "Art-18, Art-19"
      nist-ai-rmf: "GOVERN 1.2, MANAGE 2.2, MEASURE 1.1"
      iso-42001: "7.5, A.6.2.1, A.6.2.5"
      iso-24028: "Clause 7"
      aiuc-1: "C004, F001"
      iso-42005: "6.1, 6.2"
    evidence_required:
      - Document retention policy specifying 10-year retention for Art 18 documentation
      - Log retention policy specifying minimum 6-month retention for Art 19 logs
      - Evidence of retention controls implementation
    scoring:
      full: "Retention policies implemented and enforced for both 10-year documentation
        and 6-month log requirements"
      partial: "Retention policies exist but retention periods or coverage is incomplete"
      none: "No retention policy or retention requirements not met"
    risk_weight: MEDIUM

  - id: Q-EU-AI-ACT-CH3-012
    text: "Does the provider have a process to take corrective actions and notify competent
      authorities and deployers per Article 20 when a high-risk AI system is found to be
      non-conforming or posing an unexpected risk?"
    category: Chapter-III
    native_category: Chapter-III
    domain: governance
    controls:
      eu-ai-act: "Art-20"
      nist-ai-rmf: "MANAGE 1.3, MANAGE 2.2, MANAGE 3.1"
      iso-42001: "10.2, A.9.3, 8.4"
      iso-24028: "Clause 7"
      aiuc-1: "E015, E016, F001"
      iso-42005: "5.5"
    evidence_required:
      - Corrective action procedure documentation
      - Notification templates and escalation paths for authorities and deployers
      - Documented incident response capability covering withdrawal and recall
    scoring:
      full: "Documented corrective action and notification process covering investigation,
        corrective measures, authority notification, and deployer notification"
      partial: "Some corrective action capability but notification process not formalized"
      none: "No corrective action or notification process"
    risk_weight: HIGH

  - id: Q-EU-AI-ACT-CH3-012B
    text: "Does the provider cooperate with national competent authorities and the AI Office
      per Article 21, including providing access to technical documentation and source code
      upon reasoned request?"
    category: Chapter-III
    native_category: Chapter-III
    domain: governance
    controls:
      eu-ai-act: "Art-21"
      nist-ai-rmf: "GOVERN 6.1, GOVERN 6.2, MANAGE 4.2"
      iso-42001: "9.1, A.2.6, 10.1"
      iso-24028: "Clause 4"
      aiuc-1: "F001, F002"
      iso-42005: "5.1"
    evidence_required:
      - Documented process for responding to authority requests for documentation or source code
      - Contact and escalation procedures for AI Office and national competent authority inquiries
      - Records of any prior authority interactions and cooperation evidence
    scoring:
      full: "Documented cooperation process covering access provision for technical documentation
        and source code upon request, with clear escalation paths and response timeframes"
      partial: "General cooperation intent documented but no formal process or unclear scope
        of what would be provided"
      none: "No process for cooperating with competent authorities; access not planned"
    risk_weight: HIGH

  - id: Q-EU-AI-ACT-CH3-013
    text: "For providers established outside the EU, has a written authorised representative
      in the EU been designated per Article 22 before placing high-risk AI systems on the
      EU market?"
    category: Chapter-III
    native_category: Chapter-III
    domain: governance
    controls:
      eu-ai-act: "Art-22"
      nist-ai-rmf: "GOVERN 1.2, GOVERN 6.1"
      iso-42001: "5.3, A.2.6"
      iso-24028: "Clause 4"
      aiuc-1: "F001, F002"
      iso-42005: "5.1"
    evidence_required:
      - Written mandate naming the EU authorised representative
      - Authorised representative contact details and responsibilities documented
      - Evidence representative is informed and capable of fulfilling obligations
    scoring:
      full: "Written authorised representative designation in place before EU market entry,
        with clear mandate and contact details"
      partial: "Representative designated but mandate is incomplete or not in writing"
      none: "No EU authorised representative despite provider being established outside EU"
    risk_weight: HIGH

  - id: Q-EU-AI-ACT-CH3-013B
    text: "Before placing a high-risk AI system on the market, has the importer verified
      that the provider has completed the conformity assessment, drawn up technical
      documentation, applied CE marking, and taken corrective action for any non-conformance,
      as required by Article 23?"
    category: Chapter-III
    native_category: Chapter-III
    domain: governance
    controls:
      eu-ai-act: "Art-23"
      nist-ai-rmf: "GOVERN 1.1, GOVERN 6.1, MAP 5.2"
      iso-42001: "8.4, A.2.6, A.10.1"
      iso-24028: "Clause 4"
      aiuc-1: "B003, F001"
      iso-42005: "5.3"
    evidence_required:
      - Importer due diligence checklist confirming provider conformity assessment completion
      - CE marking verification records for each imported high-risk AI system
      - Contractual provisions addressing provider obligations and importer verification rights
    scoring:
      full: "Documented importer due diligence process covering all Art 23 verification
        points, with records for each high-risk AI system placed on the EU market"
      partial: "Some verification performed but not covering all Art 23 requirements or
        not documented for all systems"
      none: "No importer verification process for provider conformity"
    risk_weight: HIGH

  - id: Q-EU-AI-ACT-CH3-013C
    text: "Before making a high-risk AI system available on the EU market, has the
      distributor verified CE marking, provider and importer obligation compliance, and
      that instructions for use accompany the system, as required by Article 24?"
    category: Chapter-III
    native_category: Chapter-III
    domain: governance
    controls:
      eu-ai-act: "Art-24"
      nist-ai-rmf: "GOVERN 1.1, MAP 5.2, MANAGE 4.2"
      iso-42001: "8.4, A.2.6, A.10.1"
      iso-24028: "Clause 4"
      aiuc-1: "B003, F001"
      iso-42005: "5.3"
    evidence_required:
      - Distributor verification checklist covering CE marking, provider/importer compliance,
        and instructions for use presence
      - Records of verification activities for each high-risk AI system distributed
      - Cooperation process documentation for responding to authority requests
    scoring:
      full: "Documented distributor verification process for all Art 24 requirements with
        records per system, and cooperation process for authority requests"
      partial: "Verification performed but not covering all requirements or not documented"
      none: "No distributor verification process for high-risk AI systems"
    risk_weight: MEDIUM

  # ═══════════════════════════════════════════════════════════════════════════
  # CHAPTER III — DEPLOYER OBLIGATIONS (Art 26-27)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: Q-EU-AI-ACT-CH3-014
    text: "Does the deployer use high-risk AI systems in accordance with the provider's
      instructions for use and maintain appropriate human oversight per Article 26?"
    category: Chapter-III
    native_category: Chapter-III
    domain: governance
    controls:
      eu-ai-act: "Art-26"
      nist-ai-rmf: "GOVERN 1.1, MANAGE 1.1, MANAGE 2.4"
      iso-42001: "8.1, A.6.1.4, A.8.5"
      iso-24028: "Clause 6, Clause 7"
      aiuc-1: "D001, D005, E001"
      iso-42005: "5.2, 5.3"
    evidence_required:
      - Deployment procedures referencing and incorporating provider instructions for use
      - Human oversight assignment and training records
      - Monitoring records for AI system operation
      - Incident reporting process to providers
    scoring:
      full: "Deployment follows provider instructions; documented human oversight assignments
        with trained personnel; monitoring records maintained; incident reporting process in place"
      partial: "Instructions followed but oversight documentation or monitoring incomplete"
      none: "No formal deployment procedures or human oversight arrangements"
    risk_weight: HIGH

  - id: Q-EU-AI-ACT-CH3-015
    text: "Has the deployer performed a Fundamental Rights Impact Assessment (FRIA) per
      Article 27 before deploying high-risk AI systems in public authority, critical
      infrastructure, education, employment, or law enforcement contexts?"
    category: Chapter-III
    native_category: Chapter-III
    domain: governance
    controls:
      eu-ai-act: "Art-27"
