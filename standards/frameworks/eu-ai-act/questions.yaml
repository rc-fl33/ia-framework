      - Cybersecurity protection documentation and testing records
    scoring:
      full: "All Art 55 obligations implemented and documented: evaluations, risk assessment,
        incident reporting process, cybersecurity measures"
      partial: "Some Art 55 obligations implemented but not all, or documentation incomplete"
      none: "No Art 55 obligations implemented for systemic risk GPAI models"
    risk_weight: HIGH

  - id: Q-EU-AI-ACT-CH5-004
    text: "Is the organization participating in or adhering to an approved code of practice
