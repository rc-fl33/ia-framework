      iso-42001: "10.1, 10.2, A.10.1"
      iso-24028: "Clause 4"
      aiuc-1: "F001, E016"
      owasp-llm: "LLM01"
    evidence_required:
      - Code of practice subscription or membership records
      - Compliance assessment against code of practice requirements
