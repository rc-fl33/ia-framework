  - id: Q-EU-AI-ACT-CH6-001
    text: "Has the provider established a post-market monitoring system per Article 72,
      including systematic collection and analysis of data throughout the high-risk AI
      system lifecycle?"
    category: Chapter-VI
    native_category: Chapter-VI
    domain: monitoring
    controls:
      eu-ai-act: "Art-72"
      nist-ai-rmf: "MEASURE 2.6, MEASURE 2.7, MANAGE 2.2, MANAGE 4.1"
      iso-42001: "9.1, A.9.1, A.9.3, 10.2"
      iso-24028: "Clause 7"
      aiuc-1: "E015, E016, F001"
      iso-42005: "5.5"
    evidence_required:
      - Post-market monitoring system documentation
      - Data collection and analysis procedures covering deployed system performance
      - Serious incident reporting procedures (Art 73)
      - Monitoring plan as part of technical documentation
    scoring:
      full: "Documented post-market monitoring system with data collection, analysis,
        incident reporting, and monitoring plan in technical documentation"
      partial: "Some monitoring in place but system not formalized or documented"
      none: "No post-market monitoring system for high-risk AI systems"
    risk_weight: MEDIUM

  - id: Q-EU-AI-ACT-CH6-001B
    text: "Does the organization have a process to respond to formal non-compliance findings
      by market surveillance authorities per Article 83, including procedures to eliminate
      identified risks, withdraw systems from the market, or recall them within required
      timeframes?"
    category: Chapter-VI
    native_category: Chapter-VI
    domain: governance
    controls:
      eu-ai-act: "Art-83"
      nist-ai-rmf: "GOVERN 6.1, GOVERN 6.2, MANAGE 3.1"
      iso-42001: "10.2, A.2.6, 9.2"
      iso-24028: "Clause 4"
      aiuc-1: "E015, E016, F001"
      iso-42005: "5.5"
    evidence_required:
      - Documented process for responding to formal non-compliance findings from market
        surveillance authorities
      - Risk elimination, withdrawal, and recall procedures with defined timeframes
      - Escalation and communication process covering authority notifications and deployer
        notifications upon formal non-compliance determination
    scoring:
      full: "Documented formal non-compliance response process covering risk elimination,
        withdrawal, and recall with defined timeframes and authority/deployer communication"
      partial: "General non-conformance process exists but not specifically addressing
        Art 83 formal findings or market withdrawal scenarios"
      none: "No process for responding to formal non-compliance findings from authorities"
    risk_weight: HIGH

  - id: Q-EU-AI-ACT-CH6-002
    text: "Is the organization aware of the Article 99 penalty structure, and has it
      implemented a compliance programme addressing the highest-penalty risk areas
      (Art 5 prohibited practices and Art 50 transparency obligations)?"
    category: Chapter-VI
    native_category: Chapter-VI
    domain: governance
    controls:
      eu-ai-act: "Art-99"
      nist-ai-rmf: "GOVERN 6.1, GOVERN 6.2"
      iso-42001: "A.2.6, 9.1, 10.2"
      iso-24028: "Clause 4"
      aiuc-1: "A001, F001, F002"
      iso-42005: "5.1"
    evidence_required:
