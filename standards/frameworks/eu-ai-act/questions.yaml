  # CHAPTER V — GENERAL-PURPOSE AI MODELS (Art 51-56)
  # Applies from: 2025-08-02
  # ═══════════════════════════════════════════════════════════════════════════

  - id: Q-EU-AI-ACT-CH5-001
    text: "If the organization provides a general-purpose AI (GPAI) model, has it assessed
      whether the model meets the systemic risk threshold (>10^25 FLOPs training compute)
      or has otherwise been designated as having systemic risk per Article 51?"
    category: Chapter-V
    native_category: Chapter-V
    domain: governance
    controls:
      eu-ai-act: "Art-51, Art-52"
      nist-ai-rmf: "MAP 1.1, MAP 1.5, MAP 5.1"
      iso-42001: "6.1.2, A.6.1.1, A.10.1"
      iso-24028: "Clause 4, Clause 5"
      aiuc-1: "B001, E001, E002"
      owasp-llm: "LLM01, LLM02"
    evidence_required:
      - Training compute assessment for GPAI models (FLOPs calculation or methodology)
      - Documentation of systemic risk determination with rationale
      - AI Office notification records if threshold is met
    scoring:
      full: "GPAI model training compute assessed; systemic risk determination documented;
        AI Office notified within 2 weeks if threshold met"
      partial: "Assessment performed but not documented, or AI Office not notified where required"
      none: "No systemic risk assessment for GPAI models"
    risk_weight: HIGH

  - id: Q-EU-AI-ACT-CH5-002
    text: "If the organization provides a GPAI model, has it prepared and maintained technical
      documentation per Annex XI, a copyright compliance policy, and a training data summary
      per Article 53?"
    category: Chapter-V
    native_category: Chapter-V
    domain: governance
    controls:
      eu-ai-act: "Art-53"
      nist-ai-rmf: "GOVERN 1.2, MAP 1.6, MEASURE 1.1"
      iso-42001: "7.5, A.6.2.1, A.7.1, A.10.1"
      iso-24028: "Clause 7"
      aiuc-1: "E001, E002, E003"
      owasp-llm: "LLM04, LLM07"
    evidence_required:
      - Technical documentation per Annex XI
      - Copyright compliance policy document
      - Training data content summary (publicly available or provided to AI Office)
      - Information provision records for downstream providers
    scoring:
      full: "Annex XI documentation complete; copyright policy in place; training data
        summary published; downstream provider information sharing in place"
      partial: "Some elements present but documentation or policy is incomplete"
      none: "No technical documentation, copyright policy, or training data summary"
    risk_weight: HIGH

  - id: Q-EU-AI-ACT-CH5-002B
    text: "For GPAI model providers established outside the EU, has a written authorised
      representative established in the Union been designated per Article 54, and has the
      representative been provided with necessary technical documentation and cooperation
      capabilities?"
    category: Chapter-V
    native_category: Chapter-V
    domain: governance
    controls:
      eu-ai-act: "Art-54"
      nist-ai-rmf: "GOVERN 1.2, GOVERN 6.1"
      iso-42001: "5.3, A.2.6, A.10.1"
      iso-24028: "Clause 4"
      aiuc-1: "F001, F002"
      owasp-llm: "LLM01"
      iso-42005: "5.1"
    evidence_required:
      - Written mandate designating EU authorised representative for GPAI model
      - Representative's contact details, scope, and responsibilities documented
      - Evidence that representative has access to technical documentation required for AI Office cooperation
    scoring:
      full: "Written authorised representative designation in place, representative has required
        technical documentation access, and cooperation capabilities with AI Office established"
      partial: "Representative designated but mandate is incomplete, or representative lacks
        documentation access needed to fulfill obligations"
      none: "No EU authorised representative for GPAI model despite provider being outside EU"
    risk_weight: HIGH

  - id: Q-EU-AI-ACT-CH5-003
    text: "For GPAI models classified as having systemic risk, has the organization implemented
      the additional obligations in Article 55: model evaluations, risk assessment and mitigation,
      serious incident reporting, and cybersecurity measures?"
    category: Chapter-V
    native_category: Chapter-V
    domain: governance
    controls:
      eu-ai-act: "Art-55"
      nist-ai-rmf: "MEASURE 2.1, MEASURE 2.6, MANAGE 2.2, MANAGE 3.1"
      iso-42001: "A.9.1, A.9.2, A.10.1, 10.2"
      iso-24028: "Clause 5, Clause 6"
      aiuc-1: "E001, E002, E015, E016"
      owasp-llm: "LLM01, LLM02, LLM09"
    evidence_required:
      - Model evaluation records using standardised protocols including adversarial testing
