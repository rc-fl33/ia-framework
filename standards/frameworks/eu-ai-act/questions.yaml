  # ═══════════════════════════════════════════════════════════════════════════
  # CHAPTER IV — TRANSPARENCY OBLIGATIONS (Art 50)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: Q-EU-AI-ACT-CH4-001
    text: "Where the organization deploys AI systems that interact directly with natural
      persons (e.g. chatbots), are those persons informed they are interacting with an
      AI system as required by Article 50?"
    category: Chapter-IV
    native_category: Chapter-IV
    domain: data_protection
    controls:
      eu-ai-act: "Art-50"
      nist-ai-rmf: "GOVERN 4.1, GOVERN 4.2, MANAGE 2.4"
      iso-42001: "A.8.3, A.8.4, A.7.4"
      iso-24028: "Clause 5, Clause 6"
      aiuc-1: "D001, D002, D003"
      iso-42005: "5.4"
    evidence_required:
      - Disclosure mechanism documentation (e.g. disclosure notice text, UX design)
      - Evidence disclosure is presented before or at the start of interaction
      - Exception documentation where AI nature is obvious from context
    scoring:
      full: "Clear AI disclosure presented to all users before or at start of interaction,
        with documented exceptions where obviously AI"
      partial: "Disclosure exists but is not consistently presented or clearly worded"
      none: "No disclosure to users that they are interacting with an AI system"
    risk_weight: MEDIUM

  - id: Q-EU-AI-ACT-CH4-002
    text: "Where the organization uses AI systems to generate or manipulate synthetic
      audio, image, video, or text content (deepfakes), are outputs labelled as AI-generated
      in machine-readable format per Article 50?"
    category: Chapter-IV
    native_category: Chapter-IV
    domain: data_protection
    controls:
      eu-ai-act: "Art-50"
      nist-ai-rmf: "GOVERN 4.1, GOVERN 4.2"
      iso-42001: "A.8.3, A.8.4"
      iso-24028: "Clause 5, Clause 6"
      aiuc-1: "D001, D002"
      owasp-llm: "LLM07"
      iso-42005: "5.4"
    evidence_required:
      - Technical implementation of machine-readable labelling (e.g. C2PA metadata, watermark)
      - Documentation of labelling mechanism and coverage
      - Exception documentation for legitimate purposes (law enforcement, satire) with scope
    scoring:
      full: "Machine-readable labelling applied to all AI-generated synthetic content, with
        documented technical implementation and appropriate exceptions"
      partial: "Labelling applied but not machine-readable, or not covering all synthetic
        content types"
      none: "No labelling of AI-generated content"
    risk_weight: MEDIUM

  - id: Q-EU-AI-ACT-CH4-003
    text: "Where the organization deploys emotion recognition or biometric categorisation
      systems, are natural persons informed of their exposure to these systems per Article 50?"
    category: Chapter-IV
    native_category: Chapter-IV
    domain: data_protection
    controls:
      eu-ai-act: "Art-50"
      nist-ai-rmf: "GOVERN 4.1, GOVERN 4.2"
      iso-42001: "A.8.3, A.8.4"
      iso-24028: "Clause 5, Clause 6"
      aiuc-1: "D001, D002, D003"
      iso-42005: "5.4"
    evidence_required:
