framework: iso-13485
version: "2016"
source: "ISO/IEC 13485:2016 - Medical Devices - Quality Management Systems - Requirements for Regulatory Purposes"
description: "Quality management system requirements for medical device organizations"
controls:
  - id: "4.1"
    title: "General Requirements"
    description: "The organization shall establish, document, implement, and maintain a quality management system and continually improve its effectiveness. The organization shall determine the scope of the QMS including details of and justification for any exclusions. When regulatory requirements permit exclusion of design and development controls, these can be used as a justification. The organization shall manage the interfaces between processes and ensure effectiveness. The organization shall identify processes needed for the QMS and apply the standard to all processes. All documentation, records, and purchased product must meet requirements. The organization must ensure regulatory requirements are met."
    type: "control"
  - id: "4.2"
    title: "Documentation Requirements"
    description: "Quality manual, documented procedures for control of documents and records. Required documentation includes quality policy, quality objectives, quality manual, documented procedures for 22 required processes, work instructions, records. Control of documents and records requirements apply to all documentation."
    type: "control"
  - id: "5.1"
    title: "Management Commitment"
    description: "Top management shall provide evidence of commitment to the development and implementation of the quality management system and maintaining its effectiveness. This includes communicating the importance of meeting regulatory and customer requirements, establishing quality policy and objectives, conducting management reviews, and ensuring resource availability."
    type: "control"
  - id: "5.2"
    title: "Quality Policy"
    description: "Top management shall establish a quality policy that is appropriate to the purpose of the organization, includes a commitment to the quality management system and its effectiveness, provides a framework for establishing and reviewing quality objectives, is communicated and understood within the organization, and is reviewed for continuing suitability."
    type: "control"
  - id: "5.3"
    title: "Quality Objectives and Planning"
    description: "Top management shall establish quality objectives at relevant functions and levels. Quality objectives shall be measurable and consistent with the quality policy. The organization shall plan actions to achieve quality objectives and maintain documented information on quality objectives and planning."
    type: "control"
  - id: "5.4"
    title: "Organizational Structure and Responsibility"
    description: "Top management shall ensure that responsibilities and authorities are defined and communicated. The organization shall define organizational structure, assign responsibility and authority, and provide independence for reporting on the functioning of the quality management system."
    type: "control"
  - id: "5.5"
    title: "Management Representative"
    description: "Top management shall appoint a management representative who has defined responsibility and authority for ensuring quality management system processes are established, reported to top management on QMS performance, and ensuring promotion of awareness of regulatory and customer requirements."
    type: "control"
  - id: "5.6"
    title: "Management Review"
    description: "Top management shall review the quality management system at planned intervals to ensure continuing suitability, adequacy, and effectiveness. Reviews shall include assessing opportunities for improvement and needs for changes. Input includes audit results, customer feedback, process performance, product conformity, and corrective action status. Output includes decisions and actions related to improvement, resource needs, and any changes to the quality management system."
    type: "control"
  - id: "6.1"
    title: "Provision of Resources"
    description: "The organization shall determine and provide resources needed to implement and maintain the quality management system and maintain effectiveness. Resources include personnel, infrastructure, work environment, and information. The organization shall consider capabilities and constraints of internal resources and determine what needs to be obtained from external providers."
    type: "control"
  - id: "6.2"
    title: "Human Resources"
    description: "Personnel performing work affecting product quality shall be competent on the basis of education, training, skills, and experience. The organization shall ensure personnel are aware of the relevance and importance of their activities. The organization shall maintain appropriate records of education, training, skills, and experience."
    type: "control"
  - id: "6.3"
    title: "Infrastructure"
    description: "The organization shall determine, provide, and maintain the infrastructure needed to achieve conformity to product requirements. Infrastructure includes buildings, workspace, process equipment, supporting services, and information systems. The organization shall maintain documented information on infrastructure."
    type: "control"
  - id: "6.4"
    title: "Work Environment and Contamination Control"
    description: "The organization shall determine and manage the work environment needed to achieve conformity to product requirements. Requirements include personnel health, cleanliness, and contamination. Where product reliability is affected, the organization shall control documented requirements for the work environment and monitor and control these environmental conditions. The organization shall ensure that personnel who are required to work in special environments are qualified or trained."
    type: "control"
  - id: "7.1"
    title: "Planning of Product Realization"
    description: "The organization shall plan and develop the processes needed for product realization. Planning of product realization shall be consistent with the requirements of other quality management system processes. The organization shall establish documented requirements for product quality plans, including acceptance criteria and the required verification, validation, monitoring, inspection, and test specific to the product. Records shall be maintained."
    type: "control"
  - id: "7.2"
    title: "Customer-Related Processes"
    description: "The organization shall determine customer requirements including statutory and regulatory requirements, and additional requirements considered necessary. The organization shall review requirements related to product including contract or order requirements differing from previous ones and determine ability to meet defined requirements. Records of review and decisions shall be maintained. For customer requirements that are not stated by the customer but are necessary for specified use, the organization shall meet those requirements. The organization shall communicate with customers about product information, inquiries, contracts, order handling, and customer feedback including complaints."
    type: "control"
  - id: "7.3"
    title: "Design and Development"
    description: "The organization shall establish documented procedures for design and development. Design and development planning, input, output, review, verification, validation, and transfer shall be controlled. Design input shall include functional, performance, safety, and regulatory requirements. Design output shall provide sufficient information for purchasing, production, and service provision. Design review, verification, and validation shall be conducted at suitable intervals. Design changes shall be identified, documented, reviewed, and approved before implementation."
    type: "control"
  - id: "7.4"
    title: "Purchasing"
    description: "The organization shall establish documented procedures for purchasing to ensure purchased product conforms to specified purchase requirements. Evaluation and selection of suppliers shall be based on ability to meet requirements including quality history and audit results. The organization shall establish the type and extent of control over suppliers. Purchased product shall be verified at receipt. Records of verification and acceptance shall be maintained."
    type: "control"
  - id: "7.5"
    title: "Production and Service Provision"
    description: "The organization shall plan and carry out production and service provision under controlled conditions. This includes availability of documented information specifying product characteristics, availability of work instructions, use of suitable equipment, availability and use of monitoring and measuring equipment, implementation of monitoring and measurement, implementation of release, delivery, and post-delivery activities."
    type: "control"
  - id: "7.6"
    title: "Control of Monitoring and Measuring Equipment"
    description: "The organization shall determine monitoring and measurement to be undertaken and the equipment needed to provide evidence of product conformity. Monitoring and measuring equipment shall be controlled and calibrated or verified at specified intervals. Equipment shall be protected from adjustments that would invalidate results. The organization shall assess and record the validity of previous measurement results when equipment is found to be out of calibration. Records of calibration and verification shall be maintained."
    type: "control"
  - id: "8.1"
    title: "General Requirements - Measurement, Analysis and Improvement"
    description: "The organization shall plan and implement monitoring, measurement, analysis, and improvement processes needed to demonstrate conformity to product requirements and ensure quality management system conformity. This includes determining applicable methods, including statistical techniques and their extent."
    type: "control"
  - id: "8.2"
    title: "Monitoring and Measurement"
    description: "The organization shall conduct ongoing feedback on product quality, customer perception, and quality management system processes. The organization shall have a documented feedback system to gather and use feedback. For regulatory compliance, the organization shall gather and document post-market surveillance information. The organization shall conduct audits at planned intervals to determine if the quality management system conforms to planned arrangements and is effectively implemented and maintained."
    type: "control"
  - id: "8.3"
    title: "Control of Nonconforming Product"
    description: "The organization shall ensure product that does not conform to specified requirements is identified and controlled to prevent unintended use or delivery. Controls and related responsibilities and authorities for nonconforming product shall be defined in documented procedures. The organization shall deal with nonconforming product by采取措施 including segregation, containment, return, suspension, and granting of concession. The organization shall verify that nonconforming product conforms to original or modified requirements before release."
    type: "control"
  - id: "8.4"
    title: "Analysis of Data"
    description: "The organization shall collect and analyze appropriate data to demonstrate quality management system suitability and effectiveness. Data analysis shall provide information on customer satisfaction, product conformity, process and product characteristics trends, supplier information, and audit results. The organization shall maintain records of analysis results."
    type: "control"
  - id: "8.5"
    title: "Improvement"
    description: "The organization shall identify and implement changes needed to ensure and maintain product and quality management system conformity. The organization shall take action to eliminate causes of nonconformities to prevent recurrence. Corrective actions shall be appropriate to the effects of the nonconformities encountered. The organization shall maintain records of corrective action results."
    type: "control"
  - id: "8.6"
    title: "Corrective Action and Preventive Action (CAPA)"
    description: "The organization shall take action to eliminate the cause of nonconformities to prevent recurrence. Corrective action procedures shall include reviewing nonconformities including customer complaints, determining causes, evaluating need for action, implementing and recording action, and reviewing effectiveness. The organization shall determine if potential nonconformities exist, determine and implement necessary preventive action, and evaluate need for action to eliminate causes."
    type: "control"
