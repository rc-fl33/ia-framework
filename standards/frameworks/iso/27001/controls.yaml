framework: iso-27001
version: "2022"
source: "ISO/IEC 27001:2022, ISO/IEC 27002:2022"
controls:
  # A.5 Organizational Controls (5.1 - 5.31)
  - id: "A.5.1"
    title: "Policies for information security"
    description: "A set of policies for information security shall be defined, approved by management, published and communicated to employees and relevant external parties."
    category: "organizational"
    type: "control"

  - id: "A.5.2"
    title: "Information security roles and responsibilities"
    description: "Information security roles and responsibilities shall be defined and allocated in accordance with the organization's needs."
    category: "organizational"
    type: "control"

  - id: "A.5.3"
    title: "Segregation of duties"
    description: "Conflicting duties and areas of responsibility shall be segregated to reduce opportunities for unauthorized or unintentional modification or misuse of the organization's assets."
    category: "organizational"
    type: "control"

  - id: "A.5.4"
    title: "Management responsibilities"
    description: "Management shall require all personnel to apply information security in accordance with the established policies, procedures and practices of the organization."
    category: "organizational"
    type: "control"

  - id: "A.5.5"
    title: "Contact with authorities"
    description: "Appropriate contacts with relevant authorities shall be maintained."
    category: "organizational"
    type: "control"

  - id: "A.5.6"
    title: "Contact with special interest groups"
    description: "Appropriate contacts with special interest groups or other specialist security forums and professional associations shall be maintained."
    category: "organizational"
    type: "control"

  - id: "A.5.7"
    title: "Threat intelligence"
    description: "Information about information security threats shall be collected and analyzed to produce threat intelligence."
    category: "organizational"
    type: "control"

  - id: "A.5.8"
    title: "Information security continuity"
    description: "Information security continuity shall be embedded in business continuity management systems to ensure the required resilience."
    category: "organizational"
    type: "control"

  - id: "A.5.9"
    title: "Redundancy"
    description: "Redundancy in information processing facilities shall be implemented to meet availability requirements."
    category: "organizational"
    type: "control"

  - id: "A.5.10"
    title: "Acceptable use of information"
    description: "Rules for the acceptable use of information, information processing facilities and services shall be identified, documented and implemented."
    category: "organizational"
    type: "control"

  - id: "A.5.11"
    title: "Acceptable use of assets"
    description: "Rules for the acceptable use of assets associated with information and information processing facilities shall be identified, documented and implemented."
    category: "organizational"
    type: "control"

  - id: "A.5.12"
    title: "Classification of information"
    description: "Information shall be classified in terms of legal requirements, value, criticality and sensitivity to unauthorized disclosure or modification."
    category: "organizational"
    type: "control"

  - id: "A.5.13"
    title: "Labelling of information"
    description: "An information labelling scheme shall be developed and implemented in accordance with the information classification scheme adopted by the organization."
    category: "organizational"
    type: "control"

  - id: "A.5.14"
    title: "Information transfer"
    description: "Rules and procedures for transfer of information within the organization and to any external entity shall be defined, documented and implemented."
    category: "organizational"
    type: "control"

  - id: "A.5.15"
    title: "Access control"
    description: "A topic-specific policy and rules for access control shall be defined, documented and implemented based on business and information security requirements."
    category: "organizational"
    type: "control"

  - id: "A.5.16"
    title: "Identity management"
    description: "The lifecycle of identities shall be managed based on a topic-specific policy and defined processes."
    category: "organizational"
    type: "control"

  - id: "A.5.17"
    title: "Authentication information"
    description: "The allocation and management of authentication information shall be controlled by a management process, including guidance on appropriate selection, protection and strength of authentication information."
    category: "organizational"
    type: "control"

  - id: "A.5.18"
    title: "Access rights"
    description: "A formal user registration and de-registration process shall be implemented to enable assignment of access rights."
    category: "organizational"
    type: "control"

  - id: "A.5.19"
    title: "Supplier relationships"
    description: "Information security requirements shall be agreed with each supplier based on the type and extent of interaction and the associated information security risks."
    category: "organizational"
    type: "control"

  - id: "A.5.20"
    title: "Addressing information security in supplier agreements"
    description: "All relevant information security requirements shall be agreed with each supplier and documented in supplier agreements."
    category: "organizational"
    type: "control"

  - id: "A.5.21"
    title: "Managing information security in the ICT supply chain"
    description: "Information security requirements shall be agreed with each party in the ICT supply chain based on the type and extent of interaction and the associated information security risks."
    category: "organizational"
    type: "control"

  - id: "A.5.22"
    title: "Monitoring and review of services provided by suppliers"
    description: "The organization shall regularly monitor, review, evaluate and manage changes to supplier services and delivery."
    category: "organizational"
    type: "control"

  - id: "A.5.23"
    title: "Information security for use of cloud services"
    description: "A process for the acquisition, use, management and discontinuation of cloud services shall be defined and implemented."
    category: "organizational"
    type: "control"

  - id: "A.5.24"
    title: "Information security incident management planning and preparation"
    description: "Management direction and organizational support for information security incident management shall be planned and prepared."
    category: "organizational"
    type: "control"

  - id: "A.5.25"
    title: "Assessment and decision on information security events"
    description: "Information security events shall be assessed and it shall be decided whether they are to be categorized as information security incidents."
    category: "organizational"
    type: "control"

  - id: "A.5.26"
    title: "Response to information security incidents"
    description: "Responsibilities and procedures for managing information security incidents shall be established to ensure effective and coordinated response."
    category: "organizational"
    type: "control"

  - id: "A.5.27"
    title: "Learning from information security incidents"
    description: "Knowledge gained from information security incidents shall be used to strengthen and improve information security controls."
    category: "organizational"
    type: "control"

  - id: "A.5.28"
    title: "Collection of evidence"
    description: "The organization shall define and implement procedures for the collection, preservation and presentation of evidence relating to information security incidents."
    category: "organizational"
    type: "control"

  - id: "A.5.29"
    title: "Discontinuation of use of information"
    description: "Ownership and responsibilities for information shall be defined and assigned when the use of information is discontinued."
    category: "organizational"
    type: "control"

  - id: "A.5.30"
    title: "Business continuity frameworks"
    description: "A business continuity framework shall be defined, documented and implemented to maintain operational resilience."
    category: "organizational"
    type: "control"

  - id: "A.5.31"
    title: "Legal, statutory, regulatory, and contractual requirements"
    description: "All relevant statutory, regulatory, and contractual requirements and the organization's approach to meet these requirements shall be identified, documented and kept up to date."
    category: "organizational"
    type: "control"

  # A.6 People Controls (6.1 - 6.8)
  - id: "A.6.1"
    title: "Screening"
    description: "Background verification checks on candidates for employment shall be carried out in accordance with relevant laws, regulations and ethics."
    category: "people"
    type: "control"

  - id: "A.6.2"
    title: "Terms of employment"
    description: "Employment agreements shall state responsibilities for information security and requirements defined by the organization."
    category: "people"
    type: "control"

  - id: "A.6.3"
    title: "Information security awareness, education and training"
    description: "Personnel shall receive information security awareness, education and training at least annually, and more frequently when changes occur."
    category: "people"
    type: "control"

  - id: "A.6.4"
    title: "Disciplinary process"
    description: "A disciplinary process for information security policy violations shall be established and communicated."
    category: "people"
    type: "control"

  - id: "A.6.5"
    title: "Termination responsibilities"
    description: "Management responsibilities for terminating employment shall be defined and assigned."
    category: "people"
    type: "control"

  - id: "A.6.6"
    title: "Confidentiality or non-disclosure agreements"
    description: "Confidentiality or non-disclosure agreements reflecting the organization's needs for information protection shall be documented and signed."
    category: "people"
    type: "control"

  - id: "A.6.7"
    title: "Remote work"
    description: "A policy and supporting security measures shall be adopted to manage the risks of working remotely."
    category: "people"
    type: "control"

  - id: "A.6.8"
    title: "Information security event reporting"
    description: "Personnel shall be required to report observed or suspected information security events through appropriate channels in a timely manner."
    category: "people"
    type: "control"

  # A.7 Physical Controls (7.1 - 7.10)
  - id: "A.7.1"
    title: "Perimeter security"
    description: "Perimeter security shall be defined and implemented to protect information processing facilities and areas containing sensitive or critical information and information processing facilities."
    category: "physical"
    type: "control"

  - id: "A.7.2"
    title: "Physical entry"
    description: "Secure areas shall be protected by appropriate entry controls to ensure only authorized access is allowed."
    category: "physical"
    type: "control"

  - id: "A.7.3"
    title: "Securing offices, rooms and facilities"
    description: "Physical security for offices, rooms and facilities shall be designed and implemented."
    category: "physical"
    type: "control"

  - id: "A.7.4"
    title: "Physical security monitoring"
    description: "All areas shall be continuously monitored with appropriate physical entry controls and surveillance."
    category: "physical"
    type: "control"

  - id: "A.7.5"
    title: "Protecting against physical and environmental threats"
    description: "Protection against physical and environmental threats, such as natural disasters, fire, flood, earthquake, explosion, civil unrest and other forms of environmental or human-made threats shall be designed and implemented."
    category: "physical"
    type: "control"

  - id: "A.7.6"
    title: "Working in secure areas"
    description: "Security rules and procedures for working in secure areas shall be defined and implemented."
    category: "physical"
    type: "control"

  - id: "A.7.7"
    title: "Clear desk and clear screen"
    description: "A clear desk policy for papers and removable storage media and a clear screen policy for information processing facilities shall be adopted."
    category: "physical"
    type: "control"

  - id: "A.7.8"
    title: "Equipment siting and protection"
    description: "Equipment shall be sited and protected to reduce the risks from environmental threats and hazards, and opportunities for unauthorized access."
    category: "physical"
    type: "control"

  - id: "A.7.9"
    title: "Security of assets off-premises"
    description: "Security shall be applied to off-site assets taking into account the different risks of working outside the organization's premises."
    category: "physical"
    type: "control"

  - id: "A.7.10"
    title: "Storage media"
    description: "Storage media shall be managed throughout its lifecycle, from acquisition to disposal, in accordance with the organization's requirements and information classification scheme."
    category: "physical"
    type: "control"

  # A.8 Technological Controls (8.1 - 8.43)
  - id: "A.8.1"
    title: "User endpoint devices"
    description: "Information stored or processed on user endpoint devices shall be protected."
    category: "technological"
    type: "control"

  - id: "A.8.2"
    title: "Privileged access rights"
    description: "The allocation and use of privileged access rights shall be restricted and managed."
    category: "technological"
    type: "control"

  - id: "A.8.3"
    title: "Information access restriction"
    description: "Access to information shall be restricted in accordance with access control policy."
    category: "technological"
    type: "control"

  - id: "A.8.4"
    title: "Access to source code"
    description: "Read and write access to source code, development tools and software libraries shall be appropriately managed."
    category: "technological"
    type: "control"

  - id: "A.8.5"
    title: "Secure authentication"
    description: "Secure authentication technologies and procedures shall be implemented based on the access control policy and information classification requirements."
    category: "technological"
    type: "control"

  - id: "A.8.6"
    title: "Capacity management"
    description: "The use of resources shall be monitored and adjusted to meet current and future capacity requirements."
    category: "technological"
    type: "control"

  - id: "A.8.7"
    title: "Protection from malware"
    description: "Detection, prevention and recovery controls to protect against malware shall be implemented, combined with appropriate user awareness."
    category: "technological"
    type: "control"

  - id: "A.8.8"
    title: "Management of technical vulnerabilities"
    description: "Information about technical vulnerabilities of information systems shall be obtained, the organization's exposure to such vulnerabilities shall be evaluated and appropriate measures shall be taken."
    category: "technological"
    type: "control"

  - id: "A.8.9"
    title: "Configuration management"
    description: "Hardware, software, networks and all changes to them shall be documented, implemented, monitored and reviewed."
    category: "technological"
    type: "control"

  - id: "A.8.10"
    title: "Information deletion"
    description: "Information no longer required shall be deleted in a secure manner using approved methods."
    category: "technological"
    type: "control"

  - id: "A.8.11"
    title: "Data masking"
    description: "Data masking shall be used in accordance with the organization's access control policy and business requirements, taking into account applicable legislation."
    category: "technological"
    type: "control"

  - id: "A.8.12"
    title: "Data leakage prevention"
    description: "Data leakage prevention measures shall be applied to systems, networks and any devices that process, store or transmit sensitive information."
    category: "technological"
    type: "control"

  - id: "A.8.13"
    title: "Backup management"
    description: "Backup copies of information, software and system images shall be maintained and regularly tested in accordance with the organization's backup policy."
    category: "technological"
    type: "control"

  - id: "A.8.14"
    title: "Redundancy of information processing facilities"
    description: "Information processing facilities shall be implemented with redundancy to meet availability requirements."
    category: "technological"
    type: "control"

  - id: "A.8.15"
    title: "Logging"
    description: "Logs that record activities shall be produced, stored, protected and retained to the extent necessary to enable event reconstruction, anomaly investigation and the detection of attempts to violate information security."
    category: "technological"
    type: "control"

  - id: "A.8.16"
    title: "Monitoring activities"
    description: "Networks, systems and applications shall be monitored for anomalous behavior and appropriate actions taken to evaluate potential information security incidents."
    category: "technological"
    type: "control"

  - id: "A.8.17"
    title: "Clock synchronization"
    description: "The clocks of all relevant information processing systems shall be synchronized to a single reference time source."
    category: "technological"
    type: "control"

  - id: "A.8.18"
    title: "Use of privileged utility programs"
    description: "The use of utility programs that can circumvent system and logical access controls shall be restricted and tightly controlled."
    category: "technological"
    type: "control"

  - id: "A.8.19"
    title: "Installation of software on operational systems"
    description: "Procedures and measures shall be defined and implemented to securely manage software installation on operational systems."
    category: "technological"
    type: "control"

  - id: "A.8.20"
    title: "Networks security"
    description: "Networks and network services shall be secured and protected from unauthorized access."
    category: "technological"
    type: "control"

  - id: "A.8.21"
    title: "Security of network services"
    description: "Security mechanisms, service levels and service requirements of network services shall be identified, implemented and monitored."
    category: "technological"
    type: "control"

  - id: "A.8.22"
    title: "Application security requirements"
    description: "Information security requirements shall be included in the requirements for new systems or enhancements to existing systems."
    category: "technological"
    type: "control"

  - id: "A.8.23"
    title: "Secure coding"
    description: "Secure coding principles shall be applied to software development in accordance with the organization's software development methodology."
    category: "technological"
    type: "control"

  - id: "A.8.24"
    title: "Security testing in development and acceptance"
    description: "Security testing processes shall be defined and implemented in the development lifecycle."
    category: "technological"
    type: "control"

  - id: "A.8.25"
    title: "Outsourced development"
    description: "The organization shall supervise and monitor the activity of outsourced system development."
    category: "technological"
    type: "control"

  - id: "A.8.26"
    title: "System security requirements"
    description: "Security requirements shall be included in the acceptance criteria for new systems, enhancements to existing systems or acquired systems."
    category: "technological"
    type: "control"

  - id: "A.8.27"
    title: "Secure development lifecycle"
    description: "A software development methodology incorporating security shall be established and applied."
    category: "technological"
    type: "control"

  - id: "A.8.28"
    title: "Security of test environments"
    description: "Test environments shall be secured and managed to protect live systems and sensitive information."
    category: "technological"
    type: "control"

  - id: "A.8.29"
    title: "Change management"
    description: "Changes to information processing facilities and information systems shall be subject to a formal change management process."
    category: "technological"
    type: "control"

  - id: "A.8.30"
    title: "Test data"
    description: "Test data shall be selected carefully, protected and managed securely."
    category: "technological"
    type: "control"

  - id: "A.8.31"
    title: "Network segmentation"
    description: "Networks shall be segmented into separate security domains based on the trust level, entities and information security requirements."
    category: "technological"
    type: "control"

  - id: "A.8.32"
    title: "End user computing security"
    description: "Policies and supporting security measures shall be adopted to manage the risks introduced by using end user computing devices."
    category: "technological"
    type: "control"

  - id: "A.8.33"
    title: "Protecting from ransomware"
    description: "The organization shall implement controls to protect against ransomware and minimize the risk of successful ransomware attacks."
    category: "technological"
    type: "control"

  - id: "A.8.34"
    title: "Web filtering"
    description: "Access to external websites shall be managed to reduce exposure to malicious content."
    category: "technological"
    type: "control"

  - id: "A.8.35"
    title: "Secure mail solutions"
    description: "Secure mail solutions shall be implemented and maintained to protect the organization from threats caused by email."
    category: "technological"
    type: "control"

  - id: "A.8.36"
    title: "Protective technology"
    description: "Security mechanisms, configurations and procedures shall be implemented to protect systems and data in accordance with the organization's data loss prevention strategy."
    category: "technological"
    type: "control"

  - id: "A.8.37"
    title: "Business continuity and crisis management"
    description: "A business continuity and crisis management capability shall be established, maintained and tested."
    category: "technological"
    type: "control"

  - id: "A.8.38"
    title: "Incident management"
    description: "An incident management process shall be established, communicated and maintained."
    category: "technological"
    type: "control"

  - id: "A.8.39"
    title: "Change management"
    description: "Changes to organizational structures, processes, facilities and systems shall be managed through a formal change management process."
    category: "technological"
    type: "control"

  - id: "A.8.40"
    title: "Performance and capacity management"
    description: "Performance and capacity of systems shall be monitored and projections made of future capacity requirements to ensure adequate processing power and storage."
    category: "technological"
    type: "control"

  - id: "A.8.41"
    title: "Vulnerability management"
    description: "A vulnerability management process shall be established, implemented and maintained."
    category: "technological"
    type: "control"

  - id: "A.8.42"
    title: "Security monitoring"
    description: "Information security shall be continuously monitored through collection and analysis of information from multiple sources."
    category: "technological"
    type: "control"

  - id: "A.8.43"
    title: "Penetration testing"
    description: "Security testing and vulnerability assessments shall be conducted and repeated at least annually, or when significant changes occur."
    category: "technological"
    type: "control"

  - id: "A.8.44"
    title: "Security testing and assessment"
    description: "Security testing and vulnerability assessments of systems and networks shall be conducted and repeated at least annually, or when significant changes occur."
    category: "technological"
    type: "control"
