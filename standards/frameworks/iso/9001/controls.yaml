framework: iso-9001
version: "2015"
source: "ISO/IEC 9001:2015"
controls:
  # Clause 5 - Leadership
  - id: "5.1"
    title: "Leadership and commitment"
    description: "Top management must demonstrate leadership and commitment with respect to the quality management system by ensuring that the quality policy and quality objectives are established and are compatible with the strategic direction of the organization. Top management must ensure that the quality policy includes a commitment to meet applicable requirements and to continually improve the quality management system. Top management must ensure that the integration of the quality management system requirements into the organization's business processes is communicated, promoted and ensured. Top management must ensure that the resources needed for the quality management system are available. Top management must communicate the importance of meeting customer and regulatory requirements. Top management must ensure that the quality management system achieves its intended outcomes. Top management must engage, direct and support persons to contribute to the effectiveness of the quality management system. Top management must promote continual improvement. Top management must support other relevant management roles to demonstrate their leadership in their areas of responsibility."
    type: "control"
  - id: "5.2"
    title: "Quality policy"
    description: "Top management must establish, implement and maintain a quality policy that is appropriate to the purpose and context of the organization and supports its strategic direction. The quality policy must provide a framework for setting quality objectives, include a commitment to meet applicable requirements, include a commitment to continual improvement of the quality management system, be communicated, understood and applied within the organization, be available to relevant interested parties, as appropriate, and be reviewed for continuing suitability."
    type: "control"
  - id: "5.3"
    title: "Organizational roles, responsibilities and authorities"
    description: "Top management must ensure that the responsibilities and authorities for relevant roles are assigned, communicated and understood within the organization. Top management must assign the responsibility and authority for ensuring that the quality management system conforms to the requirements of this document, for ensuring that the processes are delivering their intended outputs, for reporting on the performance of the quality management system and on opportunities for improvement, in particular to top management, and for ensuring the promotion of customer focus throughout the organization."
    type: "control"

  # Clause 6 - Planning
  - id: "6.1"
    title: "Actions to address risks and opportunities"
    description: "When planning for the quality management system, the organization must consider the issues referred to in 4.1 and the requirements referred to in 4.2 and determine the risks and opportunities that need to be addressed to give assurance that the quality management system can achieve its intended outcome(s), prevent, or reduce, undesired effects and achieve continual improvement. The organization must plan actions to address these risks and opportunities, integrate and implement the actions into its quality management system processes, evaluate the effectiveness of these actions, and handle risks and opportunities proportionate to the potential impact on product and service conformity."
    type: "control"
  - id: "6.2.1"
    title: "Quality objectives"
    description: "The organization must establish quality objectives at relevant functions, levels and processes needed for the quality management system. The quality objectives must be consistent with the quality policy, be measurable, take into account applicable requirements, be relevant to conformity of products and services and to customer satisfaction, be monitored, be communicated, and be updated as appropriate. The organization must retain documented information on the quality objectives."
    type: "control"
  - id: "6.2.2"
    title: "Planning actions to achieve quality objectives"
    description: "When planning how to achieve its quality objectives, the organization must determine what will be done, what resources will be required, who will be responsible, when it will be completed, and how the results will be evaluated."
    type: "control"
  - id: "6.3"
    title: "Planning of changes"
    description: "When the organization determines the need for changes to the quality management system, the changes must be carried out in a planned manner. The organization must consider the purpose of the changes and their potential consequences, the integrity of the quality management system, the availability of resources, and the allocation or reallocation of responsibilities and authorities."
    type: "control"

  # Clause 7 - Support
  - id: "7.1.1"
    title: "Resources - General"
    description: "The organization must determine and provide the resources needed to establish, implement, maintain and continually improve the quality management system. The organization must consider the capabilities and constraints of existing internal resources and what needs to be obtained from external providers."
    type: "control"
  - id: "7.1.2"
    title: "People"
    description: "The organization must determine and provide the persons necessary for the effective implementation of the quality management system and for the operation and control of its processes."
    type: "control"
  - id: "7.1.3"
    title: "Infrastructure"
    description: "The organization must provide, operate and maintain the infrastructure necessary for the operation of its processes and to achieve conformity of products and services. Infrastructure can include buildings and associated utilities, process equipment (both hardware and software), and supporting services such as transport, communication or information systems."
    type: "control"
  - id: "7.1.4"
    title: "Environment for the operation of processes"
    description: "The organization must provide, operate and maintain the environment necessary for the operation of its processes. Environment can be a combination of human and physical factors, such as social, psychological and physical factors, and can include temperature, humidity, ergonomics and atmospheric factors."
    type: "control"
  - id: "7.1.5.1"
    title: "Monitoring and measuring resources - General"
    description: "The organization must ensure that monitoring and measuring resources provided are suitable for the specific type of monitoring and measuring activities and are maintained to ensure continued fitness for their purpose. The organization must retain appropriate documented information as evidence of fitness for purpose of the monitoring and measuring resources."
    type: "control"
  - id: "7.1.5.2"
    title: "Measurement traceability"
    description: "When measurement traceability is a requirement, or is considered by the organization to be an essential part of providing confidence in the validity of measurement results, measuring equipment must be verified or calibrated at specified intervals, or prior to use, against measurement standards traceable to international or national measurement standards. The organization must define the process for the verification or calibration of measuring equipment, including details of equipment type, unique identification, location, frequency of verification or calibration, acceptance criteria and the action to be taken when results are not satisfactory. The organization must retain documented information on measurement equipment and on the validity of the previous measuring results whenever doubt exists as to the validity of results."
    type: "control"
  - id: "7.1.6"
    title: "Organizational knowledge"
    description: "The organization must determine the knowledge necessary for the operation of its processes and to achieve conformity of products and services. This knowledge must be maintained and be made available to the extent necessary. When addressing changing needs and trends, the organization must consider its current knowledge and determine how to acquire or access the necessary additional knowledge. The organization must consider knowledge acquired from previous experience and lessons learned from failures, and must identify knowledge that could be lost, such as when personnel leave or processes change."
    type: "control"
  - id: "7.2"
    title: "Competence"
    description: "The organization must ensure that personnel are competent on the basis of appropriate education, training or experience. The organization must ensure that personnel are aware of the relevance and importance of their activities and how they contribute to the achievement of the quality objectives. Where applicable, the organization must take actions to acquire the necessary competence and evaluate the effectiveness of the actions taken. The organization must retain appropriate documented information as evidence of competence."
    type: "control"
  - id: "7.3"
    title: "Awareness"
    description: "The organization must ensure that personnel are aware of the quality policy, relevant quality objectives, their contribution to the effectiveness of the quality management system, and the benefits of improved quality performance."
    type: "control"
  - id: "7.4"
    title: "Communication"
    description: "The organization must determine the relevant internal and external communications relevant to the quality management system, including what to communicate, when to communicate, with whom to communicate, how to communicate, and who communicates."
    type: "control"
  - id: "7.5.1"
    title: "Documented information - General"
    description: "The organization's quality management system must include documented information required by this document and determined by the organization as necessary for the effectiveness of the quality management system. The quality manual and documented information required by the quality management system must be controlled. A documented procedure must be defined to define the controls needed for the identification, storage, protection, retrieval, retention and disposition of documented information."
    type: "control"
  - id: "7.5.2"
    title: "Creating and updating"
    description: "When creating and updating documented information, the organization must ensure appropriate format and identification, and appropriate review and approval for suitability and adequacy."
    type: "control"
  - id: "7.5.3"
    title: "Control of documented information"
    description: "Documented information required by the quality management system and by this document must be controlled to ensure it is available and suitable for use, where and when it is needed, and that it is adequately protected. Controls must include distribution, access, retrieval and use, storage and preservation, control of changes, retention and disposition, and preventing use of obsolete documented information."
    type: "control"

  # Clause 8 - Operation
  - id: "8.1"
    title: "Operational planning and control"
    description: "The organization must plan, implement and control the processes needed to meet requirements for the provision of products and services, and to implement the actions determined in Clause 6, by determining the requirements for products and services, establishing criteria for the processes and the acceptance of products and services, controlling the processes to meet the criteria, and maintaining and retaining documented information to the extent necessary to have confidence that the processes have been carried out as planned and to demonstrate conformity of products and services."
    type: "control"
  - id: "8.2.1"
    title: "Customer communication"
    description: "The organization must determine and implement effective arrangements for communicating with customers in relation to products and services, customer feedback, or customer contracts or order handling including amendments, and obtaining customer views about the organization and its products and services."
    type: "control"
  - id: "8.2.2"
    title: "Determining requirements related to products and services"
    description: "When determining requirements for products and services to be offered to customers, the organization must ensure that requirements for products and services are defined, statutory and regulatory requirements applicable to products and services are identified, and the organization can meet the claims for the products and services it offers."
    type: "control"
  - id: "8.2.3.1"
    title: "Review of requirements related to products and services - General"
    description: "The organization must ensure that it has the ability to meet the defined requirements for products and services to be offered to customers. The organization must conduct a review before committing to supply products and services to a customer, including customer requirements for delivery and post-delivery activities, and requirements not stated by the customer but necessary for the specified or intended use. The organization must ensure that contract or order requirements differing from those previously defined are resolved. The organization must retain documented information on the results of the review and on any new requirements for the products and services."
    type: "control"
  - id: "8.2.3.2"
    title: "Review of requirements for products and services - Customer requirements that differ from previously stated requirements"
    description: "The organization must ensure that the customer requirements that differ from previously stated requirements are resolved before acceptance."
    type: "control"
  - id: "8.2.4"
    title: "Changes to requirements for products and services"
    description: "The organization must ensure that relevant documented information is amended, and that relevant persons are made aware of the changed requirements, when requirements for products and services are changed."
    type: "control"
  - id: "8.3.1"
    title: "Design and development of products and services - General"
    description: "The organization must establish, implement and maintain a design and development process that is appropriate to ensure the subsequent provision of products and services."
    type: "control"
  - id: "8.3.2"
    title: "Design and development planning"
    description: "The organization must determine the stages and controls for design and development, and the organization must apply those controls to design and development. During design and development planning, the organization must determine the design and development stages, the review, verification and validation that are appropriate to each design and development stage, and the responsibilities and authorities for design and development. The organization must manage the interfaces between different groups involved in design and development to ensure effective communication and clear assignment of responsibility. The organization must retain documented information on design and development activities."
    type: "control"
  - id: "8.3.3"
    title: "Design and development inputs"
    description: "The organization must determine the requirements essential for the design and development of products and services. Inputs must be adequate for design and development purposes, complete and unambiguous, and must be reviewed for adequacy. Requirements must include functional and performance requirements, applicable statutory and regulatory requirements, standards or codes of practice, and characteristics of products and services to be produced, delivered or provided. Other important inputs include information from previous design and development, generic lessons learned, knowledge, and customer requirements. The organization must retain documented information on design and development inputs."
    type: "control"
  - id: "8.3.4"
    title: "Design and development controls"
    description: "The organization must apply controls to the design and development process. The reviews, verification and validation must be carried out in accordance with the planned arrangements, and responsibilities and authorities for these activities must be defined. The organization must retain documented information on these activities."
    type: "control"
  - id: "8.3.5"
    title: "Design and development outputs"
    description: "The organization must ensure that design and development outputs meet the input requirements, are adequate for the subsequent processes for the provision of products and services, include or reference monitoring and measuring acceptance criteria, and specify the characteristics of products and services that are essential for their intended purpose. The organization must retain documented information on design and development outputs."
    type: "control"
  - id: "8.3.6"
    title: "Design and development changes"
    description: "The organization must identify, review and control changes made during design and development to ensure there is no adverse impact on conformity to requirements. The organization must retain documented information on design and development changes, including the results of the review and the authorization of the changes."
    type: "control"
  - id: "8.4.1"
    title: "External provision of processes, products and services - General"
    description: "The organization must ensure that externally provided processes, products and services conform to requirements. The organization must determine the controls to be applied to external providers. The organization must take into account the potential impact of externally provided processes, products and services on the organization's ability to meet customer and regulatory requirements, and the effectiveness of the quality management system."
    type: "control"
  - id: "8.4.2"
    title: "Control type and extent"
    description: "The organization must ensure that externally provided processes, products and services do not adversely affect the organization's ability to consistently deliver conforming products and services to its customers. The organization must apply controls to external providers that can include methods for evaluating, selecting, monitoring the performance of, and re-evaluating external providers. The organization must determine the verification or other activities necessary to ensure that externally provided processes, products and services meet requirements."
    type: "control"
  - id: "8.4.3"
    title: "Information for external providers"
    description: "The organization must ensure the adequacy of requirements prior to their communication to the external provider. The organization must communicate to external providers its requirements for the processes, products and services to be provided, the requirements for approval of products and services, processes, equipment and personnel, the requirements for the external provider's quality management system, and the requirements for control and monitoring of the external provider's performance."
    type: "control"
  - id: "8.5.1"
    title: "Control of production and service provision"
    description: "The organization must implement production and service provision under controlled conditions. Controlled conditions must include the availability of documented information that defines the characteristics of products and services, the availability of documented information that specifies the activities to be performed and the results to be achieved, the use of suitable equipment, the availability and use of monitoring and measuring resources, the implementation of monitoring and measurement activities at appropriate stages to verify that criteria for control of processes or outputs, and the use of suitable infrastructure and environment. The organization must retain documented information on production and service provision, including any related traceability information."
    type: "control"
  - id: "8.5.2"
    title: "Identification and traceability"
    description: "The organization must use suitable means to identify outputs throughout production and service provision when necessary to ensure the conformity of products and services. The organization must identify the status of outputs with respect to monitoring and measurement requirements throughout production and service provision. Where traceability is a requirement, the organization must control the unique identification of the outputs and retain documented information to enable traceability."
    type: "control"
  - id: "8.5.3"
    title: "Property belonging to customers or external providers"
    description: "The organization must exercise care with property belonging to a customer or external provider while it is under the organization's control or being used by the organization. The organization must identify, verify, protect and safeguard customer or external provider property provided for use or incorporation into the products and services. If property belonging to a customer or external provider is lost, damaged or otherwise found to be unsuitable for use, the organization must report this to the customer or external provider and retain documented information on what has occurred."
    type: "control"
  - id: "8.5.4"
    title: "Preservation"
    description: "The organization must preserve the outputs during production and service provision to the extent necessary to ensure conformity to requirements. Preservation must include identification, handling, contamination control, packaging, storage and transmission or transportation."
    type: "control"
  - id: "8.5.5"
    title: "Post-delivery activities"
    description: "The organization must meet requirements for post-delivery activities associated with products and services. In determining the extent of post-delivery activities required, the organization must consider legal and statutory requirements, the nature, use and intended lifetime of its products and services, customer requirements, and customer feedback."
    type: "control"
  - id: "8.5.6"
    title: "Control of changes"
    description: "The organization must review and control changes for production or service provision to the extent necessary to ensure continuing conformity with requirements. The organization must retain documented information describing the results of the review of changes and the authorization of the changes."
    type: "control"
  - id: "8.6"
    title: "Release of products and services"
    description: "The organization must implement planned arrangements at appropriate stages to verify that product and service requirements have been met. The release of products and services to the customer must not proceed until the planned arrangements have been satisfactorily completed. The organization must retain documented information on the release of products and services, including evidence of conformity with the acceptance criteria and the person(s) authorizing the release."
    type: "control"
  - id: "8.7"
    title: "Control of nonconforming outputs"
    description: "The organization must ensure that outputs that do not conform to requirements are identified and controlled to prevent their unintended use or delivery. The organization must take appropriate actions based on the nature of the nonconformity and its effect on the conformity of products and services. The organization must deal with nonconforming outputs by one or more of the following: correction, segregation, containment, return, suspension of provision of products and services, informing the customer, or obtaining authorization for use as-is. The organization must retain documented information that describes the nonconformity, describes the actions taken, describes any concessions obtained, and identifies the authority that decided on the action."
    type: "control"

  # Clause 9 - Performance evaluation
  - id: "9.1.1"
    title: "Monitoring, measurement, analysis and evaluation - General"
    description: "The organization must determine what needs to be monitored and measured, the methods for monitoring, measurement, analysis and evaluation to ensure valid results, when the monitoring and measuring must be performed, and when the results from monitoring and measurement must be analyzed and evaluated. The organization must retain appropriate documented information as evidence of the results."
    type: "control"
  - id: "9.1.2"
    title: "Customer satisfaction"
    description: "The organization must monitor customers' perceptions of the degree to which their needs and expectations have been fulfilled. The organization must obtain and review information relating to customer views about the organization and its products and services."
    type: "control"
  - id: "9.2.1"
    title: "Internal audit - General"
    description: "The organization must conduct internal audits at planned intervals to provide information on whether the quality management system conforms to the organization's own requirements and the requirements of this document, and is effectively implemented and maintained."
    type: "control"
  - id: "9.2.2"
    title: "Internal audit programme"
    description: "The organization must plan, establish, implement and maintain an audit programme including the frequency, methods, responsibilities, planning requirements and reporting. The organization must define the audit criteria and scope for each audit, select auditors and conduct audits to ensure objectivity and impartiality, ensure that the results of the audits are reported to relevant management, and retain documented information as evidence of the implementation of the audit programme and the audit results."
    type: "control"
  - id: "9.3.1"
    title: "Management review - General"
    description: "Top management must review the organization's quality management system at planned intervals to ensure its continuing suitability, adequacy, effectiveness and alignment with the strategic direction of the organization."
    type: "control"
  - id: "9.3.2"
    title: "Management review inputs"
    description: "Management review must be planned and carried out considering the status of actions from previous management reviews, changes in external and internal issues relevant to the quality management system, customer satisfaction and feedback, performance and conformity of products and services, results of audits, performance of external providers, process performance and conformity of the quality management system, nonconformities and corrective actions, risks and opportunities, and improvements."
    type: "control"
  - id: "9.3.3"
    title: "Management review outputs"
    description: "The management review must include decisions and actions related to opportunities for improvement, any need for changes to the quality management system, and resource needs. The organization must retain documented information as evidence of the results of management reviews."
    type: "control"

  # Clause 10 - Improvement
  - id: "10.1"
    title: "General"
    description: "The organization must consider the results of analysis and evaluation, and the outputs from management review, to identify opportunities for improvement and implement any necessary actions. The organization must continually improve the suitability, adequacy and effectiveness of the quality management system."
    type: "control"
  - id: "10.2"
    title: "Nonconformity and corrective action"
    description: "When a nonconformity occurs, the organization must react to the nonconformity, take action to control and correct it, deal with the consequences, evaluate the need for action to eliminate the cause, determine the causes of the nonconformity, review and analyze the nonconformity, and determine if similar nonconformities exist or could occur. The organization must implement any action needed, review the effectiveness of any corrective action taken, and update risks and opportunities determined during planning, if necessary. The organization must retain documented information as evidence of the nature of the nonconformities and any subsequent actions taken, and the results of any corrective action."
    type: "control"
  - id: "10.3"
    title: "Continual improvement"
    description: "The organization must continually improve the quality management system through the use of the quality policy, quality objectives, audit results, analysis of evaluation of performance, corrective actions and management review."
    type: "control"
