framework: iso-42005
version: "2025"
source: "ISO/IEC 42005:2025"
controls:
  # Clause 4: Context of the Organization
  - id: "4.1"
    title: "Understanding the organization and its context"
    description: "The organization shall determine external and internal issues that are relevant to its purpose and that affect the achievement of the intended outcome(s) of the AI MS. The organization shall monitor and review the information about these external and internal issues."
    type: "control"
  - id: "4.2"
    title: "Understanding the needs and expectations of interested parties"
    description: "The organization shall determine interested parties that are relevant to the AI MS and the requirements of these interested parties. The organization shall monitor and review the information about these interested parties and their relevant requirements."
    type: "control"
  - id: "4.3"
    title: "Determining the scope of the AI MS"
    description: "The organization shall determine the boundaries and applicability of the AI MS to establish its scope. The scope shall be available as documented information."
    type: "control"
  - id: "4.4"
    title: "AI management system"
    description: "The organization shall establish, implement, maintain, and continually improve an AI management system (AI MS), including the processes needed and their interactions, in accordance with the requirements of this document."
    type: "control"

  # Clause 5: Leadership
  - id: "5.1"
    title: "Leadership and commitment"
    description: "Top management shall demonstrate leadership and commitment with respect to the AI MS by ensuring the integration of AI management system requirements into the organization's business processes, ensuring that the AI management system requirements are compatible with the organization's strategy and direction, ensuring the use of the process approach and risk-based thinking, ensuring that resources for the AI MS are available, communicating the importance of effective AI management and of conforming to AI MS requirements, ensuring that the AI MS achieves its intended outcome(s), directing and supporting persons to contribute to the effectiveness of the AI MS, promoting continual improvement, supporting other relevant management roles to demonstrate their leadership as it applies to their areas of responsibility."
    type: "control"
  - id: "5.2"
    title: "Information security, AI safety, and security policy"
    description: "Top management shall establish an information security, AI safety, and security policy that includes a commitment to satisfy applicable requirements, includes a commitment to continual improvement of the AI MS, provides a framework for setting objectives, is available as documented information, is communicated within the organization, and is available to relevant interested parties, as appropriate."
    type: "control"
  - id: "5.3"
    title: "Organizational roles, responsibilities, and authorities"
    description: "Top management shall ensure that the responsibilities and authorities for relevant roles are assigned and communicated. Top management shall assign the responsibility and authority for ensuring that the AI MS conforms to the requirements of this document, and for reporting on the performance of the AI MS to top management."
    type: "control"

  # Clause 6: Planning
  - id: "6.1.1"
    title: "General planning"
    description: "When planning for the AI MS, the organization shall consider the issues referred to in 4.1 and the requirements referred to in 4.2 and 4.3 and determine the risks and opportunities that need to be addressed to give assurance that the AI MS can achieve its intended outcome(s), achieve intended outcomes of the AI system, prevent or reduce undesired effects, and achieve continual improvement."
    type: "control"
  - id: "6.1.2"
    title: "AI system risk and opportunity assessment"
    description: "The organization shall define and implement a process(es) for AI system risk and opportunity assessment that includes criteria for assessing AI system risk (such as likelihood and consequence), identification of the AI system risks and opportunities, analysis and evaluation of AI system risks against criteria, identification of opportunities, and documentation of the AI system risk and opportunity assessment results."
    type: "control"
  - id: "6.2"
    title: "Addressing risks and opportunities"
    description: "The organization shall plan actions to address risks and opportunities. The organization shall plan how to integrate and implement the actions into AI MS processes and evaluate the effectiveness of these actions."
    type: "control"
  - id: "6.3"
    title: "AI system impact assessment"
    description: "The organization shall define and implement a process(es) for AI system impact assessment that includes purpose and scope of the AI system, description of the AI system, definition of the stakeholders, affected parties, and potentially affected groups, assessment of potential impact on individuals, groups, society, and the environment, determination of the level of impact (low, medium, high, or unacceptable), and documentation of the AI system impact assessment results."
    type: "control"
  - id: "6.4"
    title: "Risk treatment"
    description: "The organization shall define and implement a process(es) for AI system risk treatment that includes selection of risk treatment options (avoid, mitigate, transfer, or accept), determination of the residual risk, definition of actions to treat identified AI system risks, evaluation of the effectiveness of the risk treatment, and documentation of the risk treatment plan and its results."
    type: "control"

  # Clause 7: Support
  - id: "7.1"
    title: "Resources"
    description: "The organization shall determine and provide the resources needed for the establishment, implementation, maintenance, and continual improvement of the AI MS, including human resources (with necessary competence), infrastructure, and organizational environment."
    type: "control"
  - id: "7.2"
    title: "Competence"
    description: "The organization shall ensure that the persons doing work under the organization's control are competent on the basis of appropriate education, training, or experience. The organization shall ensure that appropriate personnel have competence on AI governance, AI system risk management, AI system impact assessment, AI technical aspects, data governance, and relevant ethical issues."
    type: "control"
  - id: "7.3"
    title: "Awareness"
    description: "The organization shall ensure that persons doing work under the organization's control are aware of the information security, AI safety, and security policy, relevant AI MS objectives, their contribution to the effectiveness of the AI MS, and the benefits of improved AI MS performance."
    type: "control"
  - id: "7.4"
    title: "Communication"
    description: "The organization shall determine relevant internal and external communications for the AI MS, including what to communicate, when to communicate, with whom to communicate, who shall communicate, and the process for communication."
    type: "control"
  - id: "7.5"
    title: "Documented information"
    description: "The organization's AI MS shall include documented information required by this document and documented information determined by the organization as necessary for the effectiveness of the AI MS. The organization shall ensure appropriate protection of documented information, including control of distribution, access, retrieval, use, legibility, storage and preservation, control of changes, retention and disposition, and preservation of documented information."
    type: "control"
