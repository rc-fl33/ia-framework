framework: mitre-atlas
version: "5.1.0"
# Total includes parent techniques and sub-techniques as enumerated in changelog
total_techniques: 84
total_sub_techniques: 56
# controls below = parent techniques only (sub-techniques are noted inline)
controls:

  # ── AI Model Access (AML.TA0000) ─────────────────────────────────────────

  - id: AML.T0040
    title: AI Model Inference API Access
    tactic: AML.TA0000
    category: AI Model Access
    description: >
      Adversaries may gain access to a model via legitimate access to the inference API.
      Inference API access can be a source of information to the adversary, a means of
      staging the attack, or for introducing data to the target system for Impact. Many
      systems rely on the same models provided via an inference API, sharing the same
      vulnerabilities. Adversaries may use their access to model APIs to identify
      vulnerabilities such as jailbreaks or hallucinations and then target applications
      that use the same models.
    status: active

  - id: AML.T0047
    title: AI-Enabled Product or Service
    tactic: AML.TA0000
    category: AI Model Access
    description: >
      Adversaries may use a product or service that uses artificial intelligence under
      the hood to gain access to the underlying AI model. This type of indirect model
      access may reveal details of the AI model or its inferences in logs or metadata.
    status: active

  - id: AML.T0041
    title: Physical Environment Access
    tactic: AML.TA0000
    category: AI Model Access
    description: >
      In addition to the attacks that take place purely in the digital domain, adversaries
      may also exploit the physical environment for their attacks. If the model is
      interacting with data collected from the real world, the adversary can influence
      the model through access to wherever the data is being collected.
    status: active

  - id: AML.T0044
    title: Full AI Model Access
    tactic: AML.TA0000
    category: AI Model Access
    description: >
      Adversaries may gain full "white-box" access to an AI model. This means the
      adversary has complete knowledge of the model architecture, its parameters, and
      class ontology. They may exfiltrate the model to craft adversarial examples and
      verify attacks in an offline setting where it is hard to detect their behavior.
    status: active

  # ── AI Attack Staging (AML.TA0001) ───────────────────────────────────────

  - id: AML.T0005
    title: Create Proxy AI Model
    tactic: AML.TA0001
    category: AI Attack Staging
    description: >
      Adversaries may obtain models to serve as proxies for the target model in use at
      the victim organization. Proxy models are used to simulate complete access to the
      target model in a fully offline manner. Adversaries may train models from
      representative datasets, attempt to replicate models from victim inference APIs,
      or use available pre-trained models.
    sub_techniques:
      - AML.T0005.000  # Train Proxy via Gathered AI Artifacts
      - AML.T0005.001  # Train Proxy via Replication
      - AML.T0005.002  # Use Pre-Trained Model
    status: active

  - id: AML.T0042
    title: Verify Attack
    tactic: AML.TA0001
    category: AI Attack Staging
    description: >
      Adversaries can verify the efficacy of their attack via an inference API or access
      to an offline copy of the target model. This gives the adversary confidence that
      their approach works and allows them to carry out the attack at a later time of
      their choosing.
    status: active

  - id: AML.T0043
    title: Craft Adversarial Data
    tactic: AML.TA0001
    category: AI Attack Staging
    description: >
      Adversarial data are inputs to an AI model that have been modified such that they
      cause the adversary's desired effect in the target model. Effects can range from
      misclassification, to missed detections, to maximizing energy consumption.
      Modification is typically constrained so that a human still perceives the data
      as unmodified.
    sub_techniques:
      - AML.T0043.000  # White-Box Optimization
      - AML.T0043.001  # Black-Box Optimization
      - AML.T0043.002  # Black-Box Transfer
      - AML.T0043.003  # Manual Modification
      - AML.T0043.004  # Insert Backdoor Trigger
    status: active

  - id: AML.T0018
    title: Manipulate AI Model
    tactic: AML.TA0001
    category: AI Attack Staging
    description: >
      Adversaries may directly manipulate an AI model to change its behavior or introduce
      malicious code. Manipulating a model gives the adversary a persistent change in
      the system. This can include poisoning the model by changing its weights, modifying
      the model architecture to change its behavior, and embedding malware which may be
      executed when the model is loaded.
    sub_techniques:
      - AML.T0018.000  # Poison AI Model
      - AML.T0018.001  # Modify AI Model Architecture
      - AML.T0018.002  # Embed Malware
    status: active

  - id: AML.T0088
    title: Generate Deepfakes
    tactic: AML.TA0001
    category: AI Attack Staging
    description: >
      Adversaries may use generative artificial intelligence to create synthetic media
      (imagery, video, audio, and text) that appear authentic. These deepfakes may mimic
      a real person or depict fictional personas. Adversaries may use deepfakes for
      impersonation to conduct phishing or to evade AI applications such as biometric
      identity verification systems.
    status: active

  # ── Reconnaissance (AML.TA0002) ──────────────────────────────────────────

  - id: AML.T0000
    title: Search Open Technical Databases
    tactic: AML.TA0002
    category: Reconnaissance
    description: >
      Adversaries may search for publicly available research and technical documentation
      to learn how and where AI is used within a victim organization. The adversary can
      use this information to identify targets for attack, or to tailor an existing
      attack to make it more effective.
    sub_techniques:
      - AML.T0000.000  # Journals and Conference Proceedings
      - AML.T0000.001  # Pre-Print Repositories
      - AML.T0000.002  # Technical Blogs
    status: active

  - id: AML.T0001
    title: Search Open AI Vulnerability Analysis
    tactic: AML.TA0002
    category: Reconnaissance
    description: >
      There is often ample research available on the vulnerabilities of common AI models.
      Once a target has been identified, an adversary will try to identify any pre-existing
      work done for this class of models, including academic papers that may identify
      the particulars of a successful attack and pre-existing implementations of those attacks.
    status: active

  - id: AML.T0003
    title: Search Victim-Owned Websites
    tactic: AML.TA0002
    category: Reconnaissance
    description: >
      Adversaries may search websites owned by the victim for information that can be
      used during targeting. Victim-owned websites may contain technical details about
      their AI-enabled products or services, including names of departments/divisions,
      physical locations, and data about key employees.
    status: active

  - id: AML.T0004
    title: Search Application Repositories
    tactic: AML.TA0002
    category: Reconnaissance
    description: >
      Adversaries may search open application repositories during targeting. Examples
      include Google Play, the iOS App Store, the macOS App Store, and the Microsoft
      Store. Adversaries may craft search queries seeking applications that contain
      AI-enabled components.
    status: active

  - id: AML.T0006
    title: Active Scanning
    tactic: AML.TA0002
    category: Reconnaissance
    description: >
      An adversary may probe or scan the victim system to gather information for
      targeting. Adversaries may scan for open ports on a potential victim's network,
      which can indicate specific services or tools the victim is utilizing, including
      tools related to AI DevOps or AI services such as public AI chat agents.
    status: active

  - id: AML.T0064
    title: Gather RAG-Indexed Targets
    tactic: AML.TA0002
    category: Reconnaissance
    description: >
      Adversaries may identify data sources used in retrieval augmented generation (RAG)
      systems for targeting purposes. By pinpointing these sources, attackers can focus
      on poisoning or otherwise manipulating the external data repositories the AI relies on.
    status: active

  - id: AML.T0087
    title: Gather Victim Identity Information
    tactic: AML.TA0002
    category: Reconnaissance
    description: >
      Adversaries may gather information about the victim's identity including personal
      data (employee names, email addresses, photos) as well as sensitive details such
      as credentials or MFA configurations. Adversaries may use the gathered victim data
      to create deepfakes and impersonate them in a convincing manner.
    status: active

  - id: AML.T0095
    title: Search Open Websites/Domains
    tactic: AML.TA0002
    category: Reconnaissance
    description: >
      Adversaries may search public websites and/or domains for information about victims
      that can be used during targeting. Information about victims may be available in
      various online sites, such as social media, news sites, or domains owned by the victim.
    status: active

  # ── Resource Development (AML.TA0003) ────────────────────────────────────

  - id: AML.T0002
    title: Acquire Public AI Artifacts
    tactic: AML.TA0003
    category: Resource Development
    description: >
      Adversaries may search public sources to identify AI artifacts including the
      software stack used to train and deploy models, training and testing data, model
      configurations and parameters. An adversary will be particularly interested in
      artifacts hosted by or associated with the victim organization.
    sub_techniques:
      - AML.T0002.000  # Datasets
      - AML.T0002.001  # Models
    status: active

  - id: AML.T0016
    title: Obtain Capabilities
    tactic: AML.TA0003
    category: Resource Development
    description: >
      Adversaries may search for and obtain software capabilities for use in their
      operations. Capabilities may be specific to AI-based attacks or generic software
      tools repurposed for malicious intent.
    sub_techniques:
      - AML.T0016.000  # Adversarial AI Attack Implementations
      - AML.T0016.001  # Software Tools
      - AML.T0016.002  # Generative AI
    status: active

  - id: AML.T0017
    title: Develop Capabilities
    tactic: AML.TA0003
    category: Resource Development
    description: >
      Adversaries may develop their own capabilities to support operations. This process
      encompasses identifying requirements, building solutions, and deploying capabilities.
      Capabilities used to support attacks on AI-enabled systems are not necessarily
      AI-based themselves.
    sub_techniques:
      - AML.T0017.000  # Adversarial AI Attacks
    status: active

  - id: AML.T0008
    title: Acquire Infrastructure
    tactic: AML.TA0003
    category: Resource Development
    description: >
      Adversaries may buy, lease, or rent infrastructure for use throughout their
      operation. Infrastructure solutions include physical or cloud servers, domains,
      mobile devices, and third-party web services, as well as physical components
      such as countermeasures that degrade AI components or sensors.
    sub_techniques:
      - AML.T0008.000  # AI Development Workspaces
      - AML.T0008.001  # Consumer Hardware
      - AML.T0008.002  # Domains
      - AML.T0008.003  # Physical Countermeasures
      - AML.T0008.004  # Serverless
    status: active

  - id: AML.T0019
    title: Publish Poisoned Datasets
    tactic: AML.TA0003
    category: Resource Development
    description: >
      Adversaries may poison datasets and publish them to a public location. The poisoned
      dataset may be a novel dataset or a poisoned variant of an existing open source
      dataset. This data may be introduced to a victim system via supply chain compromise.
    status: active

  - id: AML.T0020
    title: Poison Training Data
    tactic: AML.TA0003
    category: Resource Development
    description: >
      Adversaries may attempt to poison datasets used by an AI model by modifying the
      underlying data or its labels. This allows the adversary to embed vulnerabilities
      in AI models trained on the data that may not be easily detectable.
    status: active

  - id: AML.T0021
    title: Establish Accounts
    tactic: AML.TA0003
    category: Resource Development
    description: >
      Adversaries may create accounts with various services for use in targeting, to
      gain access to resources needed in AI Attack Staging, or for victim impersonation.
    status: active

  - id: AML.T0058
    title: Publish Poisoned Models
    tactic: AML.TA0003
    category: Resource Development
    description: >
      Adversaries may publish a poisoned model to a public location such as a model
      registry or code repository. The poisoned model may be a novel model or a
      poisoned variant of an existing open-source model.
    status: active

  - id: AML.T0060
    title: Publish Hallucinated Entities
    tactic: AML.TA0003
    category: Resource Development
    description: >
      Adversaries may create an entity they control, such as a software package, website,
      or email address tied to a source hallucinated by an LLM. When the victim interacts
      with the adversary-controlled entity, the attack can proceed.
    status: active

  - id: AML.T0065
    title: LLM Prompt Crafting
    tactic: AML.TA0003
    category: Resource Development
    description: >
      Adversaries may use their acquired knowledge of the target generative AI system
      to craft prompts that bypass its defenses and allow malicious instructions to be
      executed. The adversary may iterate on the prompt to ensure that it works
      as-intended consistently.
    status: active

  - id: AML.T0066
    title: Retrieval Content Crafting
    tactic: AML.TA0003
    category: Resource Development
    description: >
      Adversaries may write content designed to be retrieved by user queries and influence
      a user of the system. The crafted content can be combined with a prompt injection.
      The adversary must get the crafted content into the victim's database, such as a
      vector database used in a retrieval augmented generation (RAG) system.
    status: active

  - id: AML.T0079
    title: Stage Capabilities
    tactic: AML.TA0003
    category: Resource Development
    description: >
      Adversaries may upload, install, or otherwise set up capabilities that can be used
      during targeting. Capabilities may be staged on infrastructure under adversary
      control, or on web services such as GitHub, model registries like Hugging Face,
      or container registries.
    status: active

  # ── Initial Access (AML.TA0004) ───────────────────────────────────────────

  - id: AML.T0010
    title: AI Supply Chain Compromise
    tactic: AML.TA0004
    category: Initial Access
    description: >
      Adversaries may gain initial access to a system by compromising the unique portions
      of the AI supply chain. This could include hardware, data and its annotations,
      parts of the AI software stack, or the model itself.
    sub_techniques:
      - AML.T0010.000  # Hardware
      - AML.T0010.001  # AI Software
      - AML.T0010.002  # Data
      - AML.T0010.003  # Model
      - AML.T0010.004  # Container Registry
    status: active

  - id: AML.T0012
    title: Valid Accounts
    tactic: AML.TA0004
    category: Initial Access
    description: >
      Adversaries may obtain and abuse credentials of existing accounts as a means of
      gaining Initial Access. Credentials may take the form of usernames and passwords
      of individual user accounts or API keys that provide access to various AI resources
      and services.
    status: active

  - id: AML.T0015
    title: Evade AI Model
    tactic: AML.TA0004
    category: Initial Access
    description: >
      Adversaries can craft adversarial inputs that prevent an AI model from correctly
      identifying the contents of the data, or generate deepfakes that fool an AI model
      expecting authentic data. AI model evasion through deepfake generation may provide
      initial access to systems that use AI-based biometric authentication.
    status: active

  - id: AML.T0049
    title: Exploit Public-Facing Application
    tactic: AML.TA0004
    category: Initial Access
    description: >
      Adversaries may attempt to take advantage of a weakness in an Internet-facing
      computer or program using software, data, or commands in order to cause unintended
      or unanticipated behavior. These applications are often websites, databases, or
      standard services with Internet accessible open sockets.
    status: active

  - id: AML.T0052
    title: Phishing
    tactic: AML.TA0004
    category: Initial Access
    description: >
      Adversaries may send phishing messages to gain access to victim systems. Generative
      AI, including LLMs that generate synthetic text, visual deepfakes of faces, and
      audio deepfakes of speech, is enabling adversaries to scale targeted phishing
      campaigns.
    sub_techniques:
      - AML.T0052.000  # Spearphishing via Social Engineering LLM
    status: active

  - id: AML.T0078
    title: Drive-by Compromise
    tactic: AML.TA0004
    category: Initial Access
    description: >
      Adversaries may gain access to an AI system through a user visiting a website
      over the normal course of browsing, or an AI agent retrieving information from
      the web on behalf of a user. Websites can contain an LLM prompt injection which,
      when executed, can change the behavior of the AI model.
    status: active

  - id: AML.T0093
    title: Prompt Infiltration via Public-Facing Application
    tactic: AML.TA0004
    category: Initial Access
    description: >
      An adversary may introduce malicious prompts into the victim's system via a
      public-facing application with the intention of it being ingested by an AI at
      some point in the future and ultimately having a downstream effect. Any public-facing
      application that accepts text input could be a target.
    status: active

  # ── Execution (AML.TA0005) ────────────────────────────────────────────────

  - id: AML.T0011
    title: User Execution
    tactic: AML.TA0005
    category: Execution
    description: >
      An adversary may rely upon specific actions by a user in order to gain execution.
      Users may inadvertently execute unsafe code introduced via supply chain compromise.
      Users may be subjected to social engineering to get them to execute malicious code
      by, for example, opening a malicious document file or link.
    sub_techniques:
      - AML.T0011.000  # Unsafe AI Artifacts
      - AML.T0011.001  # Malicious Package
    status: active

  - id: AML.T0050
    title: Command and Scripting Interpreter
    tactic: AML.TA0005
    category: Execution
    description: >
      Adversaries may abuse command and script interpreters to execute commands, scripts,
      or binaries. These interfaces provide ways of interacting with computer systems
      and are a common feature across many different platforms. Adversaries may abuse
      these technologies as a means of executing arbitrary commands.
    status: active

  - id: AML.T0051
    title: LLM Prompt Injection
    tactic: AML.TA0005
    category: Execution
    description: >
      An adversary may craft malicious prompts as inputs to an LLM that cause the LLM
      to act in unintended ways. These prompt injections are often designed to cause the
      model to ignore aspects of its original instructions and follow the adversary's
      instructions instead. Prompt injections can be an initial access vector to the LLM.
    sub_techniques:
      - AML.T0051.000  # Direct
      - AML.T0051.001  # Indirect
      - AML.T0051.002  # Triggered
    status: active

  - id: AML.T0053
    title: AI Agent Tool Invocation
    tactic: AML.TA0005
    category: Execution
    description: >
      Adversaries may use their access to an AI agent to invoke tools the agent has
      access to. LLMs are often connected to other services or resources via tools to
      increase their capabilities. This may allow adversaries to execute API calls to
      integrated applications or services, providing the adversary with increased
      privileges on the system.
    status: active

  # ── Persistence (AML.TA0006) ──────────────────────────────────────────────

  - id: AML.T0020_persistence
    title: Poison Training Data
    tactic: AML.TA0006
    category: Persistence
    description: >
      Adversaries may attempt to poison datasets used by an AI model. Poisoned data can
      be introduced via supply chain compromise or the data may be poisoned after the
      adversary gains initial access to the system, creating a persistent vulnerability.
    notes: "Also appears under Resource Development (AML.TA0003)"
    status: active

  - id: AML.T0061
    title: LLM Prompt Self-Replication
    tactic: AML.TA0006
    category: Persistence
    description: >
      An adversary may use a carefully crafted LLM prompt injection designed to cause
      the LLM to replicate the prompt as part of its output. This allows the prompt to
      propagate to other LLMs and persist on the system.
    status: active

  - id: AML.T0070
    title: RAG Poisoning
    tactic: AML.TA0006
    category: Persistence
    description: >
      Adversaries may inject malicious content into data indexed by a retrieval augmented
      generation (RAG) system to contaminate a future thread through RAG-based search
      results. The content may include false or misleading information or prompt injections
      with malicious instructions.
    status: active

  - id: AML.T0080
    title: AI Agent Context Poisoning
    tactic: AML.TA0006
    category: Persistence
    description: >
      Adversaries may attempt to manipulate the context used by an AI agent's large
      language model to influence the responses it generates or actions it takes.
      This allows an adversary to persistently change the behavior of the target agent.
    sub_techniques:
      - AML.T0080.000  # Memory
      - AML.T0080.001  # Thread
    status: active

  - id: AML.T0081
    title: Modify AI Agent Configuration
    tactic: AML.TA0006
    category: Persistence
    description: >
      Adversaries may modify the configuration files for AI agents on a system. This
      allows malicious changes to persist beyond the life of a single agent and affects
      any agents that share the configuration. Configuration changes may include
      modifications to the system prompt, tampering with knowledge sources, or
      modification to settings of connected tools.
    status: active

  - id: AML.T0093_persistence
    title: Prompt Infiltration via Public-Facing Application
    tactic: AML.TA0006
    category: Persistence
    description: >
      An adversary may introduce malicious prompts into the victim's system via a
      public-facing application. The malicious prompts may persist on the victim system
      for an extended period and could affect multiple users and various AI tools.
    notes: "Also appears under Initial Access (AML.TA0004)"
    status: active

  # ── Defense Evasion (AML.TA0007) ──────────────────────────────────────────

  - id: AML.T0015_defense
    title: Evade AI Model
    tactic: AML.TA0007
    category: Defense Evasion
    description: >
      Adversaries can craft adversarial inputs that prevent an AI model from correctly
      identifying the contents of the data. This technique can be used to evade
      AI-based virus/malware detection or network scanning towards the goal of a
      traditional cyber attack.
    notes: "Also appears under Initial Access (AML.TA0004) and Impact (AML.TA0011)"
    status: active

  - id: AML.T0054
    title: LLM Jailbreak
    tactic: AML.TA0007
    category: Defense Evasion
    description: >
      An adversary may use a carefully crafted LLM prompt injection designed to place
      an LLM in a state in which it will freely respond to any user input, bypassing any
      controls, restrictions, or guardrails placed on the LLM.
    status: active

  - id: AML.T0067
    title: LLM Trusted Output Components Manipulation
    tactic: AML.TA0007
    category: Defense Evasion
    description: >
      Adversaries may utilize prompts to an LLM which manipulate various components of
      its response in order to make it appear trustworthy to the user. This helps the
      adversary continue to operate in the victim's environment and evade detection.
    sub_techniques:
      - AML.T0067.000  # Citations
    status: active

  - id: AML.T0068
    title: LLM Prompt Obfuscation
    tactic: AML.TA0007
    category: Defense Evasion
    description: >
      Adversaries may hide or otherwise obfuscate prompt injections or retrieval content
      from the user to avoid detection. This may include modifying how the injection is
      rendered such as small text, text colored the same as the background, or hidden
      HTML elements.
    status: active

  - id: AML.T0071
    title: False RAG Entry Injection
    tactic: AML.TA0007
    category: Defense Evasion
    description: >
      Adversaries may introduce false entries into a victim's retrieval augmented
      generation (RAG) database. Content designed to be interpreted as a document by
      the LLM is included in a data source being ingested into the RAG database. By
      including a false RAG document inside a regular RAG entry, it bypasses data
      monitoring tools.
    status: active

  - id: AML.T0073
    title: Impersonation
    tactic: AML.TA0007
    category: Defense Evasion
    description: >
      Adversaries may impersonate a trusted person or organization in order to persuade
      and trick a target into performing some action on their behalf. Adversaries may
      target resources that are part of the AI DevOps lifecycle, such as model
      repositories, container registries, and software registries.
    status: active

  - id: AML.T0074
    title: Masquerading
    tactic: AML.TA0007
    category: Defense Evasion
    description: >
      Adversaries may attempt to manipulate features of their artifacts to make them
      appear legitimate or benign to users and/or security tools. This may include
      manipulating file metadata, tricking users into misidentifying the file type,
      and giving legitimate task or service names.
    status: active

  - id: AML.T0076
    title: Corrupt AI Model
    tactic: AML.TA0007
    category: Defense Evasion
    description: >
      An adversary may purposefully corrupt a malicious AI model file so that it cannot
      be successfully deserialized in order to evade detection by a model scanner. The
      corrupt model may still successfully execute malicious code before deserialization fails.
    status: active

  - id: AML.T0092
    title: Manipulate User LLM Chat History
    tactic: AML.TA0007
    category: Defense Evasion
    description: >
      Adversaries may manipulate a user's LLM chat history to cover the tracks of their
      malicious behavior. They may hide persistent changes they have made to the LLM's
      behavior, or obscure their attempts at discovering private information about the user.
    status: active

  - id: AML.T0094
    title: Delay Execution of LLM Instructions
    tactic: AML.TA0007
    category: Defense Evasion
    description: >
      Adversaries may include instructions to be followed by the AI system in response
      to a future event, such as a specific keyword or the next interaction, in order
      to evade detection or bypass controls placed on the AI system.
    status: active

  # ── Discovery (AML.TA0008) ────────────────────────────────────────────────

  - id: AML.T0013
    title: Discover AI Model Ontology
    tactic: AML.TA0008
    category: Discovery
    description: >
      Adversaries may discover the ontology of an AI model's output space, for example,
      the types of objects a model can detect. The adversary may discover the ontology
      by repeated queries to the model, forcing it to enumerate its output space, or
      the ontology may be discovered in a configuration file or documentation.
    status: active

  - id: AML.T0014
    title: Discover AI Model Family
    tactic: AML.TA0008
    category: Discovery
    description: >
      Adversaries may discover the general family of model. General information about
      the model may be revealed in documentation, or the adversary may use carefully
      constructed examples and analyze the model's responses to categorize it.
    status: active

  - id: AML.T0007
    title: Discover AI Artifacts
    tactic: AML.TA0008
    category: Discovery
    description: >
      Adversaries may search private sources to identify AI learning artifacts that
      exist on the system and gather information about them. These artifacts can include
      the software stack used to train and deploy models, training and testing data
      management systems, container registries, software repositories, and model zoos.
    status: active

  - id: AML.T0062
    title: Discover LLM Hallucinations
    tactic: AML.TA0008
    category: Discovery
    description: >
      Adversaries may prompt large language models and identify hallucinated entities.
      They may request software packages, commands, URLs, organization names, or email
      addresses, and identify hallucinations with no connected real-world source.
      Discovered hallucinations provide the adversary with potential targets to publish
      adversary-controlled entities.
    status: active

  - id: AML.T0063
    title: Discover AI Model Outputs
    tactic: AML.TA0008
    category: Discovery
    description: >
      Adversaries may discover model outputs, such as class scores, whose presence is
      not required for the system to function and are not intended for use by the end user.
      Model outputs may be found in logs or may be included in API responses, enabling
      the adversary to identify weaknesses in the model.
    status: active

  - id: AML.T0069
    title: Discover LLM System Information
    tactic: AML.TA0008
    category: Discovery
    description: >
      The adversary is trying to discover something about the large language model's
      system information. This may be found in a configuration file containing the system
      instructions or extracted via interactions with the LLM.
    sub_techniques:
      - AML.T0069.000  # Special Character Sets
      - AML.T0069.001  # System Instruction Keywords
      - AML.T0069.002  # System Prompt
    status: active

  - id: AML.T0075
    title: Cloud Service Discovery
    tactic: AML.TA0008
    category: Discovery
    description: >
      An adversary may attempt to enumerate the cloud services running on a system after
      gaining access. Many services exist throughout the various cloud providers and can
      include CI/CD, Lambda Functions, and security/logging services. Adversaries may
      attempt to discover information about the services enabled throughout the environment.
    status: active

  - id: AML.T0084
    title: Discover AI Agent Configuration
    tactic: AML.TA0008
    category: Discovery
    description: >
      Adversaries may attempt to discover configuration information for AI agents present
      on the victim's system. Agent configurations can include tools or services they
      have access to. Adversaries can use the discovered information about AI agents to
      help with targeting.
    sub_techniques:
      - AML.T0084.000  # Embedded Knowledge
      - AML.T0084.001  # Tool Definitions
      - AML.T0084.002  # Activation Triggers
    status: active

  - id: AML.T0089
    title: Process Discovery
    tactic: AML.TA0008
    category: Discovery
    description: >
      Adversaries may attempt to get information about processes running on a system.
      Once obtained, this information could be used to gain an understanding of common
      AI-related software/applications running on systems within the network. Identifying
      the AI software stack can then lead an adversary to new targets and attack pathways.
    status: active

  # ── Collection (AML.TA0009) ───────────────────────────────────────────────

  - id: AML.T0035
    title: AI Artifact Collection
    tactic: AML.TA0009
    category: Collection
    description: >
      Adversaries may collect AI artifacts for exfiltration or for use in AI Attack
      Staging. AI artifacts include models and datasets as well as other telemetry data
      produced when interacting with a model.
    status: active

  - id: AML.T0036
    title: Data from Information Repositories
    tactic: AML.TA0009
    category: Collection
    description: >
      Adversaries may leverage information repositories to mine valuable information.
      Information repositories are tools that allow for storage of information to
      facilitate collaboration or information sharing between users, and can store a
      wide variety of data that may aid adversaries in further objectives.
    status: active

  - id: AML.T0037
    title: Data from Local System
    tactic: AML.TA0009
    category: Collection
    description: >
      Adversaries may search local system sources, such as file systems and configuration
      files or local databases, to find files of interest and sensitive data prior to
      exfiltration. This can include basic fingerprinting information and sensitive data
      such as SSH keys.
    status: active

  - id: AML.T0085
    title: Data from AI Services
    tactic: AML.TA0009
    category: Collection
    description: >
      Adversaries may use their access to a victim organization's AI-enabled services
      to collect proprietary or otherwise sensitive information. AI agents may be
      configured to have access to tools and data sources that are not directly
      accessible by users.
    sub_techniques:
      - AML.T0085.000  # RAG Databases
      - AML.T0085.001  # AI Agent Tools
    status: active

  # ── Exfiltration (AML.TA0010) ─────────────────────────────────────────────

  - id: AML.T0024
    title: Exfiltration via AI Inference API
    tactic: AML.TA0010
    category: Exfiltration
    description: >
      Adversaries may exfiltrate private information via the AI inference API. AI Models
      have been shown to leak private information about their training data. Exfiltration
      of information relating to private training data raises privacy concerns including
      PII and other protected data.
    sub_techniques:
      - AML.T0024.000  # Infer Training Data Membership
      - AML.T0024.001  # Invert AI Model
      - AML.T0024.002  # Extract AI Model
    status: active

  - id: AML.T0025
    title: Exfiltration via Cyber Means
    tactic: AML.TA0010
    category: Exfiltration
    description: >
      Adversaries may exfiltrate AI artifacts or other information relevant to their
      goals via traditional cyber means.
    status: active

  - id: AML.T0056
    title: Extract LLM System Prompt
    tactic: AML.TA0010
    category: Exfiltration
    description: >
      Adversaries may attempt to extract a large language model's system prompt. This
      can be done via prompt injection to induce the model to reveal its own system
      prompt or may be extracted from a configuration file. System prompts can be a
      portion of an AI provider's competitive advantage and are thus valuable IP.
    status: active

  - id: AML.T0057
    title: LLM Data Leakage
    tactic: AML.TA0010
    category: Exfiltration
    description: >
      Adversaries may craft prompts that induce the LLM to leak sensitive information.
      This can include private user data or proprietary information. The leaked
      information may come from proprietary training data, data sources the LLM is
      connected to, or information from other users of the LLM.
    status: active

  - id: AML.T0077
    title: LLM Response Rendering
    tactic: AML.TA0010
    category: Exfiltration
    description: >
      An adversary may get a large language model to respond with private information
      that is hidden from the user when the response is rendered by the user's client.
      The private information is then exfiltrated. This can take the form of rendered
      images which automatically make a request to an adversary-controlled server.
    status: active

  - id: AML.T0086
    title: Exfiltration via AI Agent Tool Invocation
    tactic: AML.TA0010
    category: Exfiltration
    description: >
      Adversaries may use prompts to invoke an agent's tool capable of performing write
      operations to exfiltrate data. Sensitive information can be encoded into the tool's
      input parameters and transmitted as part of a seemingly legitimate action. Variants
      include sending emails, creating or modifying documents, or updating CRM records.
    status: active

  # ── Impact (AML.TA0011) ───────────────────────────────────────────────────

  - id: AML.T0029
    title: Denial of AI Service
    tactic: AML.TA0011
    category: Impact
    description: >
      Adversaries may target AI-enabled systems with a flood of requests for the purpose
      of degrading or shutting down the service. Since many AI systems require significant
      amounts of specialized compute, they are often expensive bottlenecks that can
      become overloaded. Adversaries can intentionally craft inputs that require heavy
      amounts of useless compute from the AI system.
    status: active

  - id: AML.T0046
    title: Spamming AI System with Chaff Data
    tactic: AML.TA0011
    category: Impact
    description: >
      Adversaries may spam the AI system with chaff data that causes an increase in the
      number of detections. This can cause analysts at the victim organization to waste
      time reviewing and correcting incorrect inferences.
    status: active

  - id: AML.T0031
    title: Erode AI Model Integrity
    tactic: AML.TA0011
    category: Impact
    description: >
      Adversaries may degrade the target model's performance with adversarial data inputs
      to erode confidence in the system over time. This can lead to the victim organization
      wasting time and money attempting to fix the system and performing the tasks it was
      meant to automate by hand.
    status: active

  - id: AML.T0034
    title: Cost Harvesting
    tactic: AML.TA0011
    category: Impact
    description: >
      Adversaries may target different AI services to send useless queries or
      computationally expensive inputs to increase the cost of running services at the
      victim organization. Sponge examples are a particular type of adversarial data
      designed to maximize energy consumption and thus operating cost.
    status: active

  - id: AML.T0048
    title: External Harms
    tactic: AML.TA0011
    category: Impact
    description: >
      Adversaries may abuse their access to a victim system and use its resources or
      capabilities to further their goals by causing harms external to that system.
      These harms could affect the organization (Financial Harm, Reputational Harm),
      its users (User Harm), or the general public (Societal Harm).
    sub_techniques:
      - AML.T0048.000  # Financial Harm
      - AML.T0048.001  # Reputational Harm
      - AML.T0048.002  # Societal Harm
      - AML.T0048.003  # User Harm
      - AML.T0048.004  # AI Intellectual Property Theft
    status: active

  - id: AML.T0059
    title: Erode Dataset Integrity
    tactic: AML.TA0011
    category: Impact
    description: >
      Adversaries may poison or manipulate portions of a dataset to reduce its usefulness,
      reduce trust, and cause users to waste resources correcting errors.
    status: active

  # ── Privilege Escalation (AML.TA0012) ─────────────────────────────────────

  - id: AML.T0053_priv
    title: AI Agent Tool Invocation
    tactic: AML.TA0012
    category: Privilege Escalation
    description: >
      Adversaries may use their access to an AI agent to invoke tools the agent has
      access to, providing the adversary with increased privileges on the system. AI
      agents may be configured to have access to tools that are not directly accessible
      by users, allowing adversaries to gain access to tools they otherwise wouldn't be
      able to use.
    notes: "Also appears under Execution (AML.TA0005)"
    status: active

  - id: AML.T0054_priv
    title: LLM Jailbreak
    tactic: AML.TA0012
    category: Privilege Escalation
    description: >
      An adversary may use a carefully crafted LLM prompt injection designed to place
      an LLM in a state in which it will freely respond to any user input, bypassing
      any controls, restrictions, or guardrails placed on the LLM. Once successfully
      jailbroken, the LLM can be used in unintended ways by the adversary.
    notes: "Also appears under Defense Evasion (AML.TA0007)"
    status: active

  # ── Credential Access (AML.TA0013) ────────────────────────────────────────

  - id: AML.T0055
    title: Unsecured Credentials
    tactic: AML.TA0013
    category: Credential Access
    description: >
      Adversaries may search compromised systems to find and obtain insecurely stored
      credentials. These credentials can be stored and/or misplaced in many locations
      on a system, including plaintext files, environment variables, operating system,
      or application-specific repositories, or other specialized files/artifacts.
    status: active

  - id: AML.T0082
    title: RAG Credential Harvesting
    tactic: AML.TA0013
    category: Credential Access
    description: >
      Adversaries may attempt to use their access to a large language model on the
      victim's system to collect credentials. Credentials may be stored in internal
      documents which can inadvertently be ingested into a RAG database, where they can
      ultimately be retrieved by an AI agent.
    status: active

  - id: AML.T0083
    title: Credentials from AI Agent Configuration
    tactic: AML.TA0013
    category: Credential Access
    description: >
      Adversaries may access the credentials of other tools or services on a system from
      the configuration of an AI agent. AI Agents often utilize external tools or services
      to take actions, and credentials like API keys, tokens, and connection strings are
      frequently stored in configuration files.
    status: active

  - id: AML.T0090
    title: OS Credential Dumping
    tactic: AML.TA0013
    category: Credential Access
    description: >
      Adversaries may extract credentials from OS caches, application memory, or other
      sources on a compromised system. Credentials can be used to perform lateral
      movement to access other AI services such as AI agents, LLMs, or AI inference
      APIs.
    status: active

  # ── Command and Control (AML.TA0014) ──────────────────────────────────────

  - id: AML.T0072
    title: Reverse Shell
    tactic: AML.TA0014
    category: Command and Control
    description: >
      Adversaries may utilize a reverse shell to communicate and control the victim
      system. With a reverse shell, the adversary is listening for incoming connections
      initiated from the victim system, rather than initiating the connection themselves.
    status: active

  # ── Lateral Movement (AML.TA0015) ─────────────────────────────────────────

  - id: AML.T0091
    title: Use Alternate Authentication Material
    tactic: AML.TA0015
    category: Lateral Movement
    description: >
      Adversaries may use alternate authentication material, such as password hashes,
      Kerberos tickets, and application access tokens, in order to move laterally within
      an environment and bypass normal system access controls. AI services commonly use
      alternate authentication material as a primary means for users to make queries.
    sub_techniques:
      - AML.T0091.000  # Application Access Token
    status: active
