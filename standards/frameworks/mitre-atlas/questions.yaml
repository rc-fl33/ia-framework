framework: mitre-atlas
version: "5.1.0"
total_questions: 44

questions:

  # ── AI Attack Staging (AML.TA0001) ── highest-priority: techniques used in nearly every ATLAS case study

  - id: Q-ATLAS-TA0001-001
    text: "Does the organization have controls to detect or prevent adversaries from crafting and using proxy AI models to stage attacks against production models?"
    category: ai_attack_staging
    native_category: AML.TA0001
    domain: monitoring
    controls:
      mitre-atlas: "AML.T0005"
      nist-ai-rmf: "MEASURE 2.6, MANAGE 2.4, MAP 5.2"
      nist-800-53: "AC-3, SC-28, AU-12, SI-4"
      owasp-llm: "LLM02, LLM09"
      iso-42001: "A.6.2.3, 8.3"
      aiuc-1: "D001, D002"
      eu-ai-act: "Art-9, Art-15"
    evidence_required:
      - API rate limiting and anomaly detection logs for inference endpoints
      - Records of inference query volume monitoring
      - Access controls on inference API endpoints
    scoring:
      full: "Inference APIs are authenticated, rate-limited, and monitored; anomalous query patterns trigger alerts"
      partial: "Rate limiting is in place but query patterns are not monitored for model extraction behavior"
      none: "Inference APIs are unauthenticated or unmonitored"
    risk_weight: HIGH

  - id: Q-ATLAS-TA0001-002
    text: "Does the organization validate AI models for backdoor triggers or adversarial influence before deploying them to production?"
    category: ai_attack_staging
    native_category: AML.TA0001
    domain: governance
    controls:
      mitre-atlas: "AML.T0018"
      nist-ai-rmf: "MEASURE 2.5, MANAGE 2.4, MAP 5.1"
      nist-800-53: "SI-7, CM-3, SA-10, AU-12"
      owasp-llm: "LLM04, LLM09"
      iso-42001: "A.8.4, 8.3, A.9.3"
      aiuc-1: "D003, D005"
      eu-ai-act: "Art-9, Art-15"
    evidence_required:
      - Model validation/testing procedures
      - Evidence of backdoor testing or red team exercises
      - Model integrity verification records
    scoring:
      full: "Formal model validation process tests for backdoors, data poisoning artifacts, and adversarial inputs before every deployment"
      partial: "Models are tested for performance but not specifically for adversarial manipulation"
      none: "No model validation process prior to deployment"
    risk_weight: HIGH

  - id: Q-ATLAS-TA0001-003
    text: "Does the organization have processes to prevent or detect adversarial data crafted to manipulate AI model outputs?"
    category: ai_attack_staging
