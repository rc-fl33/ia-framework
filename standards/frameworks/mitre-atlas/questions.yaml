  # ── Execution (AML.TA0005) ──

  - id: Q-ATLAS-TA0005-001
    text: "Does the organization restrict loading of unsafe AI artifacts such as pickle files and enforce code signing for AI model files?"
    category: execution
    native_category: AML.TA0005
    domain: governance
    controls:
      mitre-atlas: "AML.T0011"
