      eu-ai-act: "Art-9, Art-15"
    evidence_required:
      - Library loading restrictions or allowlists for AI artifact formats
      - Code signing policy for AI model files
      - Vulnerability scanning records for AI artifacts
    scoring:
      full: "AI artifact formats are restricted to safe serialization formats; code signing is enforced; artifacts are scanned before loading"
      partial: "Some restrictions on artifact formats or scanning exists, but code signing is not enforced"
      none: "No restrictions on loading AI artifacts; pickle or other unsafe formats are used without validation"
    risk_weight: HIGH

  - id: Q-ATLAS-TA0005-002
    text: "Does the organization have controls to detect or prevent AI agent tool invocation abuse, where an adversary uses prompt injection to invoke agent tools?"
    category: execution
    native_category: AML.TA0005
    domain: monitoring
    controls:
      mitre-atlas: "AML.T0053"
