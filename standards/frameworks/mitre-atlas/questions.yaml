  # ── Initial Access (AML.TA0004) ──

  - id: Q-ATLAS-TA0004-001
    text: "Does the organization have controls to detect or prevent supply chain compromise of AI artifacts including models, datasets, and AI software frameworks?"
    category: initial_access
    native_category: AML.TA0004
    domain: governance
    controls:
