      nist-ai-rmf: "MEASURE 2.5, MANAGE 2.2, MAP 5.2"
      nist-800-53: "SI-3, SI-10, RA-5"
      owasp-llm: "LLM01, LLM09"
      iso-42001: "A.9.3, 8.4"
      aiuc-1: "D005, E005"
      eu-ai-act: "Art-9, Art-15"
    evidence_required:
      - Adversarial input detection implementation documentation
      - Input preprocessing or validation pipeline records
      - Monitoring alerts for anomalous model inputs
    scoring:
      full: "Adversarial input detection is implemented inline before model inference, with alerting and blocking"
      partial: "Input validation exists but does not specifically target adversarial perturbations"
      none: "No adversarial input detection in place"
    risk_weight: HIGH

  - id: Q-ATLAS-TA0001-004
    text: "Does the organization have controls to detect attack verification activity, including adversaries using inference APIs to test whether adversarial examples transfer to production models?"
    category: ai_attack_staging
    native_category: AML.TA0001
    domain: monitoring
    controls:
      mitre-atlas: "AML.T0042"
      nist-ai-rmf: "MEASURE 2.6, MAP 5.2"
