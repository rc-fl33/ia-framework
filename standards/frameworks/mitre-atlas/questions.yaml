      owasp-llm: "LLM02, LLM09"
      iso-42001: "8.3, A.9.3"
      aiuc-1: "D001, E005"
      eu-ai-act: "Art-9, Art-15"
    evidence_required:
      - Inference API telemetry logging configuration
      - Anomaly detection rules for unusual query sequences
      - Rate limiting policies for inference endpoints
    scoring:
      full: "Behavioral anomaly detection identifies patterns consistent with attack verification; alerts are generated and investigated"
      partial: "Query volumes are rate-limited but sequential attack verification patterns are not specifically detected"
      none: "No monitoring for inference API abuse patterns"
    risk_weight: MEDIUM

  - id: Q-ATLAS-TA0001-005
