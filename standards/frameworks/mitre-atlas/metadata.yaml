notes: >
  ATLAS is modeled after MITRE ATT&CK and is complementary to it.
  Techniques are organized across two ATLAS-unique tactics (AI Model Access, AI Attack Staging)
  and 14 tactics that mirror ATT&CK (Reconnaissance through Lateral Movement).
  The framework covers both classical adversarial ML attacks (evasion, poisoning, extraction)
  and newer LLM/GenAI attack patterns (prompt injection, jailbreak, agent compromise).
  Case studies are included in the source data and document real-world incidents
  such as PoisonGPT, Morris II Worm, and ChatGPT Package Hallucination.
