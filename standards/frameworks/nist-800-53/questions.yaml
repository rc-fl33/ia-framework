# NIST SP 800-53 Rev 5 Control-Tagged Questions
# Version: 1.0
# Reference: NIST Special Publication 800-53 Revision 5
# Control Family: Native NIST 800-53 Rev 5
# Purpose: Comprehensive control assessment for federal and non-federal systems

framework: nist-800-53
version: "Rev 5"
total_questions: 40
industry_focus:
  - federal_government
  - contractors
  - critical_infrastructure
  - healthcare
  - financial

# Control Families (20 families, 1189 controls with enhancements)
control_families:
  - id: AC
    name: Access Control
    control_family: AC
  - id: AT
    name: Awareness and Training
    control_family: AT
  - id: AU
    name: Audit and Accountability
    control_family: AU
  - id: CA
    name: Assessment, Authorization, and Monitoring
    control_family: CA
  - id: CM
    name: Configuration Management
    control_family: CM
  - id: CP
    name: Contingency Planning
    control_family: CP
  - id: IA
    name: Identification and Authentication
    control_family: IA
  - id: IR
    name: Incident Response
    control_family: IR
  - id: MA
    name: Maintenance
    control_family: MA
  - id: MP
    name: Media Protection
    control_family: MP
  - id: PE
    name: Physical and Environmental Protection
    control_family: PE
  - id: PL
    name: Planning
    control_family: PL
  - id: PM
    name: Program Management
    control_family: PM
  - id: PS
    name: Personnel Security
    control_family: PS
  - id: PT
    name: PII Processing and Transparency
    control_family: PT
  - id: RA
    name: Risk Assessment
    control_family: RA
  - id: SA
    name: System and Services Acquisition
    control_family: SA
  - id: SC
    name: System and Communications Protection
    control_family: SC
  - id: SI
    name: System and Information Integrity
    control_family: SI
  - id: SR
    name: Supply Chain Risk Management
    control_family: SR

# Baseline mapping (controls required per impact level)
baselines:
  low: "FedRAMP Low, basic federal systems"
  moderate: "FedRAMP Moderate, most federal systems"
  high: "FedRAMP High, critical/sensitive systems"

questions:
  # ═══════════════════════════════════════════════════════════════════════════
  # AC - ACCESS CONTROL
  # ═══════════════════════════════════════════════════════════════════════════

  - id: Q-800-53-AC-001
    text: "How does the organization manage user access accounts throughout their lifecycle?"
    category: access_control
    control_family: AC
    controls:
      nist-800-53: "AC-2, AC-2(1), AC-2(2), AC-2(3), AC-2(4)"
      nist-csf: "PR.AA-02, PR.AA-05"
      iso-27001: "A.8.2"
      fedramp: "AC-2"
      soc2: "CC6.1, CC6.2"
      pci-dss: "8.1, 8.2"
      cis-v8: "5.1, 5.2"
    baseline: [low, moderate, high]
    evidence_required:
      - Account management policy
      - User provisioning procedures
      - Access request forms
      - Periodic review records
      - Termination procedures
    scoring:
      full: "Documented account lifecycle with automated workflows and regular reviews"
      partial: "Account management exists but manual and inconsistent"
      none: "No formal account management process"
    sub_questions:
      - "Are accounts reviewed at least annually?"
      - "Is account creation documented and approved?"
      - "Are inactive accounts disabled within defined timeframes?"
      - "Are temporary/emergency accounts time-limited?"
    risk_weight: HIGH

  - id: Q-800-53-AC-002
    text: "How is least privilege implemented across system access?"
    category: access_control
    control_family: AC
    controls:
      nist-800-53: "AC-6, AC-6(1), AC-6(2), AC-6(5), AC-6(9), AC-6(10)"
      nist-csf: "PR.AA-05"
      iso-27001: "A.8.2, A.8.3"
      fedramp: "AC-6"
      soc2: "CC6.1"
      pci-dss: "7.1, 7.2"
      hipaa: "§164.312(a)(1)"
      cis-v8: "6.1, 6.2"
    baseline: [low, moderate, high]
    evidence_required:
      - Least privilege policy
      - Role-based access matrix
      - Privileged account inventory
      - Access justification records
    scoring:
      full: "Role-based access with documented justification and logging"
      partial: "Some access controls but least privilege not consistently applied"
      none: "No least privilege implementation"
    sub_questions:
      - "Are privileges limited to functions required for job duties?"
      - "Are privileged accounts separate from regular accounts?"
      - "Is privileged access logged and audited?"
      - "Are privileges reviewed and adjusted when roles change?"
    risk_weight: HIGH

  - id: Q-800-53-AC-003
    text: "How does the organization control remote access to information systems?"
    category: access_control
    control_family: AC
    controls:
      nist-800-53: "AC-17, AC-17(1), AC-17(2), AC-17(3), AC-17(4)"
      nist-csf: "PR.AA-01, PR.DS-02"
      iso-27001: "A.8.5"
      fedramp: "AC-17"
      soc2: "CC6.1, CC6.6"
      pci-dss: "8.3"
      cis-v8: "6.5, 6.6"
    baseline: [low, moderate, high]
    evidence_required:
      - Remote access policy
      - VPN configuration
      - Encryption standards
      - Remote session management
    scoring:
      full: "Encrypted remote access with MFA and session controls"
      partial: "Remote access controlled but encryption or MFA incomplete"
      none: "No controlled remote access"
    sub_questions:
      - "Is remote access encrypted (VPN, TLS)?"
      - "Is multi-factor authentication required for remote access?"
      - "Are remote sessions monitored and logged?"
      - "Are remote access methods documented and authorized?"
    risk_weight: HIGH

  - id: Q-800-53-AC-004
    text: "How are information flow and access restrictions between system boundaries enforced?"
    category: access_control
    control_family: AC
    controls:
      nist-800-53: "AC-4, AC-4(4), SC-7, SC-7(4), SC-7(5)"
      nist-csf: "PR.DS-05"
      iso-27001: "A.8.22"
      fedramp: "AC-4, SC-7"
      soc2: "CC6.6"
      pci-dss: "1.2, 1.3"
      cis-v8: "12.1, 12.2"
    baseline: [moderate, high]
    evidence_required:
      - Information flow policy
      - Network diagrams
      - Boundary protection documentation
      - Data flow diagrams
    scoring:
      full: "Documented information flow with boundary controls and monitoring"
      partial: "Some boundary controls but not comprehensive"
      none: "No information flow controls"
    sub_questions:
      - "Are network boundaries clearly defined and documented?"
      - "Are data flows between boundaries controlled?"
      - "Is traffic filtered at boundaries?"
      - "Are deny-all, permit-by-exception policies enforced?"
    risk_weight: HIGH

  # ═══════════════════════════════════════════════════════════════════════════
  # AT - AWARENESS AND TRAINING
  # ═══════════════════════════════════════════════════════════════════════════

  - id: Q-800-53-AT-001
    text: "Does the organization provide security awareness training to all users?"
    category: awareness_training
    control_family: AT
    controls:
      nist-800-53: "AT-2, AT-2(1), AT-2(2), AT-2(3)"
      nist-csf: "PR.AT-01, PR.AT-02"
      iso-27001: "A.6.3"
      fedramp: "AT-2"
      soc2: "CC1.4"
      hipaa: "§164.308(a)(5)"
      pci-dss: "12.6"
      cis-v8: "14.1, 14.2"
    baseline: [low, moderate, high]
    evidence_required:
      - Training program documentation
      - Training materials
      - Completion records
      - Refresher training schedule
    scoring:
      full: "Comprehensive awareness program with regular updates and tracking"
      partial: "Training exists but not comprehensive or tracked"
      none: "No formal security awareness training"
    sub_questions:
      - "Is training provided upon hire and annually?"
      - "Does training cover current threats (phishing, social engineering)?"
      - "Is training completion tracked and enforced?"
      - "Are simulated attacks (phishing tests) conducted?"
    risk_weight: MEDIUM

  - id: Q-800-53-AT-002
    text: "Is role-based security training provided to users with specialized security responsibilities?"
    category: awareness_training
    control_family: AT
    controls:
      nist-800-53: "AT-3, AT-3(1), AT-3(2)"
      nist-csf: "PR.AT-02"
      iso-27001: "A.6.3"
      fedramp: "AT-3"
      soc2: "CC1.4"
      cis-v8: "14.4"
    baseline: [low, moderate, high]
    evidence_required:
      - Role-based training curriculum
      - Specialized training records
      - Certification requirements
    scoring:
      full: "Role-specific training with practical exercises and certifications"
      partial: "Some role-based training but not comprehensive"
      none: "No specialized security training"
    sub_questions:
      - "Do administrators receive specialized training?"
      - "Do developers receive secure coding training?"
      - "Is training tailored to specific job functions?"
      - "Are certifications required for specialized roles?"
    risk_weight: MEDIUM

  # ═══════════════════════════════════════════════════════════════════════════
  # AU - AUDIT AND ACCOUNTABILITY
  # ═══════════════════════════════════════════════════════════════════════════

  - id: Q-800-53-AU-001
    text: "What audit events are captured and retained for system components?"
    category: audit_accountability
    control_family: AU
    controls:
      nist-800-53: "AU-2, AU-3, AU-3(1), AU-11"
      nist-csf: "DE.CM-03"
      iso-27001: "A.8.15"
      fedramp: "AU-2, AU-3"
      soc2: "CC7.1"
      hipaa: "§164.312(b)"
      pci-dss: "10.2"
      cis-v8: "8.2, 8.5"
    baseline: [low, moderate, high]
    evidence_required:
      - Audit event list
      - Log content requirements
      - Retention policy
      - Log storage documentation
    scoring:
      full: "Comprehensive audit logging with defined retention and content standards"
      partial: "Some audit logging but coverage or retention incomplete"
      none: "No formal audit logging"
    sub_questions:
      - "Are all security-relevant events logged?"
      - "Do logs include who, what, when, where, outcome?"
      - "How long are logs retained?"
      - "Are audit records protected from modification?"
    risk_weight: HIGH

  - id: Q-800-53-AU-002
    text: "How are audit logs reviewed, analyzed, and reported?"
    category: audit_accountability
    control_family: AU
    controls:
      nist-800-53: "AU-6, AU-6(1), AU-6(3), AU-6(5), AU-6(6)"
      nist-csf: "DE.AE-02, DE.AE-03"
      iso-27001: "A.8.15"
      fedramp: "AU-6"
      soc2: "CC4.1, CC7.2"
      pci-dss: "10.4, 10.6"
      cis-v8: "8.11"
    baseline: [low, moderate, high]
    evidence_required:
      - Log review procedures
      - Analysis tools (SIEM)
      - Alert thresholds
      - Reporting procedures
    scoring:
      full: "Automated log analysis with alerting and regular review"
      partial: "Logs reviewed but not consistently or automatically"
      none: "Logs not reviewed"
    sub_questions:
      - "Is log analysis automated (SIEM, log management)?"
      - "Are anomalies and indicators of compromise detected?"
      - "How frequently are logs reviewed?"
      - "Are log analysis findings reported to management?"
    risk_weight: HIGH

  # ═══════════════════════════════════════════════════════════════════════════
  # CA - ASSESSMENT, AUTHORIZATION, AND MONITORING
  # ═══════════════════════════════════════════════════════════════════════════

  - id: Q-800-53-CA-001
    text: "How are security controls assessed for effectiveness?"
    category: assessment_authorization
    control_family: CA
    controls:
      nist-800-53: "CA-2, CA-2(1), CA-2(2)"
      nist-csf: "ID.IM-03"
      iso-27001: "A.5.35"
      fedramp: "CA-2"
      soc2: "CC4.1"
    baseline: [low, moderate, high]
    evidence_required:
      - Assessment plan
      - Assessment reports
      - Control test procedures
      - Assessor qualifications
    scoring:
      full: "Regular independent assessments with documented methodology"
      partial: "Some assessments but not comprehensive or independent"
      none: "No formal control assessments"
    sub_questions:
      - "Are controls assessed at least annually?"
      - "Are assessments performed by independent parties?"
      - "Is assessment methodology documented?"
      - "Are assessment findings tracked to remediation?"
    risk_weight: HIGH

  - id: Q-800-53-CA-002
    text: "How is the system's authorization to operate managed?"
    category: assessment_authorization
    control_family: CA
    controls:
      nist-800-53: "CA-6, CA-6(1)"
      nist-csf: "GV.OV-02"
      fedramp: "CA-6"
    baseline: [low, moderate, high]
    evidence_required:
      - Authorization documentation (ATO)
      - Security authorization package
      - Authorizing official designation
      - Authorization renewal records
    scoring:
      full: "Current authorization with documented risk acceptance"
      partial: "Authorization exists but outdated or incomplete"
      none: "No formal authorization"
    sub_questions:
      - "Is there a current Authority to Operate (ATO)?"
      - "Who is the designated authorizing official?"
      - "Are significant changes re-authorized?"
      - "Is authorization renewed at required intervals?"
    risk_weight: HIGH

  # ═══════════════════════════════════════════════════════════════════════════
  # CM - CONFIGURATION MANAGEMENT
  # ═══════════════════════════════════════════════════════════════════════════

  - id: Q-800-53-CM-001
    text: "How is a baseline configuration established and maintained?"
    category: configuration_management
    control_family: CM
    controls:
      nist-800-53: "CM-2, CM-2(1), CM-2(2), CM-2(3)"
      nist-csf: "PR.IP-01"
      iso-27001: "A.8.9"
      fedramp: "CM-2"
      soc2: "CC8.1"
      pci-dss: "2.2"
      cis-v8: "4.1, 4.2"
    baseline: [low, moderate, high]
    evidence_required:
      - Baseline configuration documentation
      - Configuration standards (CIS benchmarks, STIGs)
      - Deviation documentation
      - Baseline review records
    scoring:
      full: "Documented baselines with automated enforcement and deviation tracking"
      partial: "Baselines exist but not consistently maintained"
      none: "No baseline configurations"
    sub_questions:
      - "Are baseline configurations documented for all system types?"
      - "Are security configuration guides (CIS, DISA STIGs) used?"
      - "How are deviations from baseline documented and approved?"
      - "Are baselines reviewed and updated regularly?"
    risk_weight: HIGH

  - id: Q-800-53-CM-002
    text: "How are configuration changes controlled and documented?"
    category: configuration_management
    control_family: CM
    controls:
      nist-800-53: "CM-3, CM-3(1), CM-3(2), CM-3(4), CM-4"
      nist-csf: "PR.IP-03"
      iso-27001: "A.8.32"
      fedramp: "CM-3, CM-4"
      soc2: "CC8.1"
      pci-dss: "6.4"
      cis-v8: "2.5"
    baseline: [low, moderate, high]
    evidence_required:
      - Change management policy
      - Change request records
      - Impact analysis documentation
      - Approval records
    scoring:
      full: "Formal change control with impact analysis and approval workflow"
      partial: "Change process exists but not consistently followed"
      none: "No formal change control"
    sub_questions:
      - "Are changes analyzed for security impact?"
      - "Are changes approved before implementation?"
      - "Is there a change advisory board or equivalent?"
      - "Are emergency changes documented and reviewed?"
    risk_weight: HIGH

  - id: Q-800-53-CM-003
    text: "How is a system inventory maintained?"
    category: configuration_management
    control_family: CM
    controls:
      nist-800-53: "CM-8, CM-8(1), CM-8(3)"
      nist-csf: "ID.AM-01, ID.AM-02"
      iso-27001: "A.5.9"
      fedramp: "CM-8"
      soc2: "CC6.1"
      pci-dss: "2.4"
      cis-v8: "1.1, 1.2, 2.1"
    baseline: [low, moderate, high]
    evidence_required:
      - System inventory
      - Software inventory
      - Component tracking
      - Inventory update procedures
    scoring:
      full: "Automated inventory with complete hardware/software tracking"
      partial: "Inventory exists but not comprehensive or current"
      none: "No system inventory"
    sub_questions:
      - "Is there a complete inventory of hardware assets?"
      - "Is there a complete inventory of software?"
      - "Is inventory automatically updated?"
      - "Are unauthorized components detected?"
    risk_weight: HIGH

  # ═══════════════════════════════════════════════════════════════════════════
  # CP - CONTINGENCY PLANNING
  # ═══════════════════════════════════════════════════════════════════════════

  - id: Q-800-53-CP-001
    text: "Does the organization have a comprehensive contingency plan?"
    category: contingency_planning
    control_family: CP
    controls:
      nist-800-53: "CP-1, CP-2, CP-2(1), CP-2(3), CP-2(8)"
      nist-csf: "PR.IP-09, RC.RP-01"
      iso-27001: "A.5.29, A.5.30"
      fedramp: "CP-2"
      soc2: "CC9.1"
      hipaa: "§164.308(a)(7)"
      pci-dss: "12.10"
    baseline: [low, moderate, high]
    evidence_required:
      - Contingency plan
      - Business impact analysis
      - Recovery priorities
      - Contact lists
    scoring:
      full: "Comprehensive plan with BIA, priorities, and procedures"
      partial: "Plan exists but incomplete or outdated"
      none: "No contingency plan"
    sub_questions:
      - "Is there a documented contingency plan?"
      - "Is a business impact analysis performed?"
      - "Are recovery time objectives (RTO) defined?"
      - "Are recovery point objectives (RPO) defined?"
    risk_weight: HIGH

  - id: Q-800-53-CP-002
    text: "Are contingency plans tested and updated regularly?"
    category: contingency_planning
    control_family: CP
    controls:
      nist-800-53: "CP-4, CP-4(1), CP-4(2)"
      nist-csf: "PR.IP-10"
      iso-27001: "A.5.30"
      fedramp: "CP-4"
      soc2: "A1.3"
      hipaa: "§164.308(a)(7)"
    baseline: [low, moderate, high]
    evidence_required:
      - Test plans and results
      - Lessons learned
      - Plan updates
      - Test schedules
    scoring:
      full: "Annual testing with documented results and plan updates"
      partial: "Some testing but not comprehensive or regular"
      none: "Plans not tested"
    sub_questions:
      - "Are plans tested at least annually?"
      - "Do tests include full recovery exercises?"
      - "Are lessons learned incorporated?"
      - "Are plan updates made based on test results?"
    risk_weight: HIGH

  - id: Q-800-53-CP-003
    text: "How does the organization manage system backups?"
    category: contingency_planning
    control_family: CP
    controls:
      nist-800-53: "CP-9, CP-9(1), CP-9(2), CP-9(3), CP-9(8)"
      nist-csf: "PR.DS-11"
      iso-27001: "A.8.13"
      fedramp: "CP-9"
      soc2: "A1.2"
      hipaa: "§164.308(a)(7)(ii)"
      pci-dss: "9.5"
      cis-v8: "11.1, 11.2"
    baseline: [low, moderate, high]
    evidence_required:
      - Backup policy
      - Backup schedules
      - Backup verification records
      - Restoration test records
    scoring:
      full: "Automated backups with verification, encryption, and tested restoration"
      partial: "Backups performed but not verified or tested"
      none: "No formal backup process"
    sub_questions:
      - "Are backups performed on defined schedules?"
      - "Are backups stored at separate locations?"
      - "Are backups encrypted?"
      - "Is restoration tested regularly?"
    risk_weight: HIGH

  # ═══════════════════════════════════════════════════════════════════════════
  # IA - IDENTIFICATION AND AUTHENTICATION
  # ═══════════════════════════════════════════════════════════════════════════

  - id: Q-800-53-IA-001
    text: "How are users uniquely identified and authenticated?"
    category: identification_authentication
    control_family: IA
    controls:
      nist-800-53: "IA-2, IA-2(1), IA-2(2), IA-2(5), IA-2(8)"
      nist-csf: "PR.AA-01, PR.AA-03"
      iso-27001: "A.8.5"
      fedramp: "IA-2"
      soc2: "CC6.1"
      hipaa: "§164.312(d)"
      pci-dss: "8.2, 8.3"
      cis-v8: "6.3, 6.4"
    baseline: [low, moderate, high]
    evidence_required:
      - Authentication policy
      - MFA implementation documentation
      - Authenticator management
      - Session controls
    scoring:
      full: "Unique IDs with MFA for all privileged and remote access"
      partial: "User identification exists but MFA incomplete"
      none: "No formal identification/authentication controls"
    sub_questions:
      - "Are all users assigned unique identifiers?"
      - "Is multi-factor authentication implemented?"
      - "Is MFA required for privileged access?"
      - "Is MFA required for remote access?"
    risk_weight: HIGH

  - id: Q-800-53-IA-002
    text: "How are authenticators (passwords, tokens, certificates) managed?"
    category: identification_authentication
    control_family: IA
    controls:
      nist-800-53: "IA-5, IA-5(1), IA-5(2), IA-5(6)"
      nist-csf: "PR.AA-03"
      iso-27001: "A.8.5"
      fedramp: "IA-5"
      soc2: "CC6.1"
      pci-dss: "8.2, 8.4"
      cis-v8: "6.5"
    baseline: [low, moderate, high]
    evidence_required:
      - Authenticator policy
      - Password requirements
      - Certificate management
      - Authenticator lifecycle procedures
    scoring:
      full: "Comprehensive authenticator management with strength requirements"
      partial: "Some authenticator controls but incomplete"
      none: "No authenticator management"
    sub_questions:
      - "Are password complexity requirements enforced?"
      - "Is password minimum length at least 12 characters?"
      - "Are certificates properly managed and renewed?"
      - "Are default passwords changed?"
    risk_weight: HIGH

  # ═══════════════════════════════════════════════════════════════════════════
  # IR - INCIDENT RESPONSE
  # ═══════════════════════════════════════════════════════════════════════════

  - id: Q-800-53-IR-001
    text: "Does the organization have a documented incident response capability?"
    category: incident_response
    control_family: IR
    controls:
      nist-800-53: "IR-1, IR-4, IR-4(1), IR-4(4)"
      nist-csf: "RS.MA-01, RS.MA-02"
      iso-27001: "A.5.24, A.5.25"
      fedramp: "IR-4"
      soc2: "CC7.3"
      hipaa: "§164.308(a)(6)"
      pci-dss: "12.10"
    baseline: [low, moderate, high]
    evidence_required:
      - Incident response plan
      - Incident classification matrix
      - Response procedures
      - Contact lists
    scoring:
      full: "Documented IR capability with automated detection and correlation"
      partial: "IR procedures exist but not comprehensive"
      none: "No formal incident response"
    sub_questions:
      - "Is there a documented incident response plan?"
      - "Are incidents classified by severity?"
      - "Are response procedures defined for each classification?"
      - "Is there 24/7 incident response capability?"
    risk_weight: HIGH

  - id: Q-800-53-IR-002
    text: "How are incidents reported internally and externally?"
    category: incident_response
    control_family: IR
    controls:
      nist-800-53: "IR-6, IR-6(1), IR-6(2)"
      nist-csf: "RS.CO-02, RS.CO-03"
      iso-27001: "A.5.26"
      fedramp: "IR-6"
      hipaa: "§164.308(a)(6)"
    baseline: [low, moderate, high]
    evidence_required:
      - Incident reporting procedures
      - Reporting timelines
      - External reporting requirements (CISA, regulators)
      - Reporting records
    scoring:
      full: "Documented reporting with defined timelines and regulatory compliance"
      partial: "Reporting occurs but procedures not formalized"
      none: "No formal incident reporting"
    sub_questions:
      - "Are incident reporting timelines defined?"
      - "Is there automated incident alerting?"
      - "Are regulatory reporting requirements addressed?"
      - "Is there a defined external reporting process (CISA, law enforcement)?"
    risk_weight: HIGH

  # ═══════════════════════════════════════════════════════════════════════════
  # MA - MAINTENANCE
  # ═══════════════════════════════════════════════════════════════════════════

  - id: Q-800-53-MA-001
    text: "How is system maintenance performed and documented?"
    category: maintenance
    control_family: MA
    controls:
      nist-800-53: "MA-2, MA-2(1), MA-2(2)"
      nist-csf: "PR.MA-01"
      iso-27001: "A.8.9"
      fedramp: "MA-2"
    baseline: [low, moderate, high]
    evidence_required:
      - Maintenance policy
      - Maintenance schedules
      - Maintenance records
