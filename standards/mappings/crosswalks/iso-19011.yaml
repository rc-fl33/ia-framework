framework: iso-19011
version: "2018"
description: ISO 19011:2018 Auditing Guidelines cross-framework mappings to management system standards and CB requirements
last_updated: 2026-02-22
mappings:
  - control: "4.a"
    title: Principle — Integrity
    external_mappings:
      iso-17021-1:
        - "9.1"
        - "9.3"
      nist-csf:
        - GV.PO-01
        - GV.RR-04
    confidence: high
    evidence:
      - ISO 17021-1 Section 9 covers impartiality and integrity for CBs
    notes: >
      ISO 17021-1 Section 9 (Impartiality) and Section 9.3 make integrity requirements
      mandatory for accredited CBs. ISO 19011 makes integrity a guideline for all auditors.

  - control: "4.b"
    title: Principle — Fair presentation
    external_mappings:
      iso-17021-1:
        - "7.3"
        - "7.4"
      nist-csf:
        - GV.PO-01
    confidence: high
    evidence:
      - ISO 17021-1 Section 7.3 and 7.4 cover CB reporting requirements
    notes: CB audit reports must accurately represent audit findings; ISO 19011 provides methodology guidance

  - control: "4.e"
    title: Principle — Independence
    external_mappings:
      iso-17021-1:
        - "9.1"
        - "9.2"
        - "9.3"
      iso-9001:
        - "9.2"
      iso-27001:
        - "9.2"
      nist-csf:
        - GV.RR-04
    confidence: high
    evidence:
      - Independence is a mandatory requirement for accredited CBs (ISO 17021-1)
      - ISO 9001 Clause 9.2 states internal auditors shall be objective and impartial
    notes: >
      ISO 17021-1 Section 9 makes independence mandatory for accredited certification bodies.
      ISO 9001 and ISO 27001 require internal auditors to be impartial (not audit own work).

  - control: "4.f"
    title: Principle — Evidence-based approach
    external_mappings:
      iso-17021-1:
        - "7.3"
      nist-csf:
        - ID.IM-01
    confidence: high
    evidence:
      - Evidence-based auditing is foundational to all ISO audit standards
    notes: All audit findings must be supported by verifiable evidence per ISO 19011 and ISO 17021-1

  - control: "4.g"
    title: Principle — Risk-based approach (2018 addition)
    external_mappings:
      iso-9001:
        - "6.1"
      iso-27001:
        - "6.1"
      iso-42001:
        - "6.1"
      nist-csf:
        - GV.RM-01
        - GV.RM-02
    confidence: high
    evidence:
      - Risk-based approach aligns with risk management requirements across HLS standards
    notes: >
      Added in 2018 edition to align ISO 19011 with the risk-based thinking approach
      introduced across all HLS management system standards.

  - control: "5.1"
    title: Establishing an audit programme
    external_mappings:
      iso-9001:
        - "9.2"
      iso-13485:
        - "8.2.4"
      iso-27001:
        - "9.2"
      iso-42001:
        - "9.2"
      nist-csf:
        - ID.IM-01
        - ID.IM-02
    confidence: high
    evidence:
      - ISO 9001, 13485, 27001, and 42001 all require internal audit programmes
    notes: >
      ISO 19011 Clause 5 provides the methodology guidance for implementing the audit
      programme requirements found in all major ISO management system standards.

  - control: "5.3"
    title: Establishing the audit programme extent
    external_mappings:
      iso-17021-1:
        - "9.1"
        - "9.4"
      iso-9001:
        - "9.2"
      iso-42006:
        - "All"
      nist-csf:
        - ID.IM-02
    confidence: high
    evidence:
      - Audit programme extent decisions affect all management system audit programmes
    notes: >
      ISO 17021-1 Section 9.4 defines CB requirements for audit programme planning.
      ISO 42006 provides CB requirements for AIMS auditing (ISO 42001).

  - control: "5.4"
    title: Implementing the audit programme
    external_mappings:
      iso-17021-1:
        - "9.4"
        - "9.5"
      iso-9001:
        - "9.2"
      nist-csf:
        - ID.IM-01
    confidence: high
    evidence:
      - Audit implementation methodology applies to internal and external audits
    notes: >
      ISO 17021-1 Sections 9.4 and 9.5 define CB implementation requirements.
      ISO 19011 provides generic methodology for all audit types.

  - control: "6.2"
    title: Initiating the audit
    external_mappings:
      iso-17021-1:
        - "9.4"
      nist-csf:
        - ID.IM-01
    confidence: medium
    evidence:
      - Audit initiation procedures apply to both internal and external audits
    notes: CB audit initiation follows ISO 19011 methodology within ISO 17021-1 framework

  - control: "6.3"
    title: Preparing audit activities
    external_mappings:
      iso-17021-1:
        - "9.4"
      iso-9001:
        - "9.2"
      nist-csf:
        - ID.IM-01
    confidence: medium
    evidence:
      - Document review before on-site audit is best practice across all audit types
    notes: Pre-audit document review methodology from ISO 19011 applies to ISO 9001 internal audits

  - control: "6.4"
    title: Conducting the audit activities
    external_mappings:
      iso-17021-1:
        - "9.4"
        - "9.5"
      iso-9001:
        - "9.2"
      iso-13485:
        - "8.2.4"
      iso-27001:
        - "9.2"
      nist-csf:
        - ID.IM-01
        - ID.IM-02
    confidence: high
    evidence:
      - On-site audit methodology from ISO 19011 is the universal reference for all audits
    notes: >
      ISO 19011 Clause 6.4 is the definitive guidance for conducting audits of any management
      system. All ISO management system standards (9001, 13485, 27001, 42001) rely on
      ISO 19011 for internal audit methodology.

  - control: "6.5"
    title: Preparing and distributing the audit report
    external_mappings:
      iso-17021-1:
        - "9.5"
        - "9.6"
      iso-9001:
        - "9.2"
      nist-csf:
        - ID.IM-02
    confidence: high
    evidence:
      - Audit reporting requirements align across ISO 19011 and ISO 17021-1
    notes: >
      ISO 17021-1 Section 9.5 and 9.6 define CB reporting requirements for certification.
      ISO 19011 provides the methodology for what constitutes an adequate audit report.

  - control: "6.7"
    title: Conducting audit follow-up
    external_mappings:
      iso-9001:
        - "10.2"
      iso-13485:
        - "8.5.2"
      iso-27001:
        - "10.2"
      iso-17021-1:
        - "9.7"
      nist-csf:
        - RS.MI-01
        - ID.IM-01
    confidence: high
    evidence:
      - Corrective action follow-up required by all management system standards and CBs
    notes: >
      ISO 17021-1 Section 9.7 defines CB requirements for follow-up on nonconformities.
      ISO 19011 provides methodology guidance for effectiveness verification.

  - control: "7.2"
    title: Determining auditor competence
    external_mappings:
      iso-17021-1:
        - "7.1"
        - "7.2"
      iso-17021-3:
        - "All"
      iso-42006:
        - "Clause 7"
      nist-csf:
        - PR.AT-01
    confidence: high
    evidence:
      - Auditor competence requirements defined in ISO 19011 and made mandatory by ISO 17021-1
    notes: >
      ISO 17021-1 Section 7.1 and 7.2 define mandatory CB personnel competence requirements.
      ISO 17021-3 specifies competence requirements specifically for QMS (ISO 9001) auditors.
      ISO 42006 specifies competence for AIMS (ISO 42001) auditors.

  - control: "7.3"
    title: Establishing auditor evaluation criteria
    external_mappings:
      iso-17021-1:
        - "7.2"
      iso-17021-3:
        - "All"
      nist-csf:
        - GV.RR-02
    confidence: high
    evidence:
      - Auditor qualification criteria defined by ISO 19011 and specified in discipline-specific standards
    notes: >
      ISO 17021-3 provides specific competence criteria for ISO 9001 auditors.
      Similar discipline-specific standards exist for ISO 14001 (ISO 17021-2),
      ISO 45001 (ISO 17021-10), and ISO 27001 (ISO 27006).

  - control: "7.4"
    title: Selecting the appropriate auditor evaluation method
    external_mappings:
      iso-17021-1:
        - "7.2"
      nist-csf:
        - PR.AT-02
    confidence: medium
    evidence:
      - Auditor evaluation methods align with CB personnel competence assessment requirements
    notes: Witness audits (observation during actual audit) are the CB method for auditor evaluation

  - control: "7.6"
    title: Maintaining and improving auditor competence
    external_mappings:
      iso-17021-1:
        - "7.2"
      nist-csf:
        - PR.AT-01
        - PR.AT-02
    confidence: high
    evidence:
      - Continuing professional development requirements for CB auditors in ISO 17021-1
    notes: >
      ISO 17021-1 requires CBs to have a process for maintaining auditor competence.
      ISO 19011 provides methodology guidance for CPD and minimum audit frequency.
