      - ISO 42005 Annex A maps 6.8 to ISO 42001 A.5.4, A.5.5, B.5.4, B.5.5

  - guidance_element: G.6.9
    title: Measures to address harms and benefits
    external_mappings:
      iso-42001:
        - A.5.2   # Impact assessment process — treatment element
        - 6.1.4   # Risk treatment as output of impact assessment
        - "8.3"   # Design and development of AI systems (technical measures)
      nist-ai-rmf:
