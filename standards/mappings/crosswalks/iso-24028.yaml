framework: iso-24028
version: "2020"
description: ISO/IEC TR 24028:2020 Overview of Trustworthiness in AI cross-framework mappings
last_updated: 2026-02-22
note: >
  ISO 24028 is a Technical Report providing a trustworthiness taxonomy. Mappings are from
  trustworthiness properties and threat categories to specific controls in other frameworks.
  Confidence is generally medium where alignment is conceptual rather than explicit citation.
  ISO 42001 does not cite ISO 24028 by name in its normative controls but Annex B controls
  reference trustworthiness objectives consistent with 24028 properties.

mappings:

  # ─────────────────────────────────────────────────────────────────────────
  # TRUSTWORTHINESS PROPERTY MAPPINGS
  # ─────────────────────────────────────────────────────────────────────────

  - trustworthiness_property: TP.1
    title: Availability
    external_mappings:
      iso-42001:
        - A.6.2.3   # AI system operational environment — availability requirements
        - A.6.2.5   # Testing includes availability/reliability testing
      nist-ai-rmf:
        - MEASURE 2.5   # AI system performance against stated objectives
        - MANAGE 4.1    # Post-deployment monitoring including availability
      aiuc-1:
        - B008          # Security measures for AI model deployment environments
    confidence: medium
    evidence:
      - ISO 24028 clause 6.1 availability definition aligns with ISO 42001 operational requirements
    notes: Availability is primarily addressed through infrastructure controls, not AI-specific controls.

  - trustworthiness_property: TP.2
    title: Resiliency
    external_mappings:
      iso-42001:
        - A.6.2.4   # AI system verification — robustness testing
        - A.6.2.5   # Testing — adversarial and edge case scenarios
        - A.5.5     # Safety and security of AI systems
      nist-ai-rmf:
        - MEASURE 2.7   # AI system security — adversarial robustness
        - MEASURE 2.5   # Performance under distribution shift
      eu-ai-act:
        - Article 15    # Accuracy, robustness, and cybersecurity for high-risk AI
      aiuc-1:
        - B001          # Adversarial testing program
        - B002          # Monitoring for adversarial inputs
    confidence: high
    evidence:
      - ISO 24028 resiliency aligns directly with NIST AI RMF MEASURE 2.7 adversarial robustness
      - EU AI Act Article 15 explicitly uses "robustness" language consistent with ISO 24028

  - trustworthiness_property: TP.3
    title: Reliability
    external_mappings:
      iso-42001:
        - A.6.2.4   # Verification of AI system performance
        - A.6.2.5   # Testing and validation
        - A.6.2.6   # Monitoring in deployed AI systems
      nist-ai-rmf:
        - MEASURE 2.5   # AI system performance evaluated
        - MEASURE 4.3   # All identified AI risks monitored over time
      eu-ai-act:
        - Article 15    # Accuracy, robustness, and cybersecurity (includes reliability)
    confidence: high
    evidence:
      - ISO 24028 reliability definition maps to ISO 42001 verification and monitoring controls

  - trustworthiness_property: TP.4
    title: Accuracy
    external_mappings:
      iso-42001:
        - A.7.2    # Data for development of AI systems — data quality for accuracy
        - A.7.3    # Data governance
        - A.6.2.4  # Verification — accuracy metrics
        - A.6.2.5  # Testing — accuracy evaluation
      nist-ai-rmf:
        - MEASURE 2.5   # AI system performance against stated objectives
        - MEASURE 2.3   # AI system performance evaluation
      eu-ai-act:
        - Article 10    # Data and data governance — data quality for accuracy
        - Article 15    # Accuracy requirements for high-risk AI
      aiuc-1:
        - D001          # Safeguards against hallucinated outputs (accuracy failure)
    confidence: high
    evidence:
      - ISO 24028 accuracy property maps to ISO 42001 data quality and verification controls

  - trustworthiness_property: TP.5
    title: Safety
    external_mappings:
      iso-42001:
        - A.5.5     # Safety and security of AI systems (closest explicit safety control)
        - A.6.1.2   # Control objectives include safety
        - A.9.2     # Human oversight — critical for safety
        - 6.1.4     # Impact assessment identifies safety impacts
      iso-42005:
        - G.6.8     # Impact analysis including safety dimension
      nist-ai-rmf:
        - MAP 1.5   # AI systems likely to impact critical infrastructure or safety
        - MANAGE 1.3  # Risk responses for safety impacts
      eu-ai-act:
        - Article 9   # Risk management including safety analysis for high-risk AI
        - Article 14  # Human oversight — safety-critical decisions
        - Annex III   # High-risk AI categories (safety-critical domains)
    confidence: high
    evidence:
      - ISO 24028 safety property aligns with ISO 42001 A.5.5 and EU AI Act safety requirements

  - trustworthiness_property: TP.6
    title: Security
    external_mappings:
      iso-42001:
        - A.5.5    # Safety and security of AI systems
        - A.7.4    # Data security
      iso-27001:
        - A.8      # Technology controls (covers model and data security)
        - A.5.23   # Information security for use of cloud services
      nist-ai-rmf:
        - MEASURE 2.6   # Adversarial robustness/attack
        - MEASURE 2.7   # AI system security
        - GOVERN 4.3    # Organizational risk of AI security attacks
      eu-ai-act:
        - Article 15    # Cybersecurity for high-risk AI
        - Article 72    # Post-market monitoring — security incidents
      aiuc-1:
        - B001          # Adversarial testing
        - B002          # Monitoring for adversarial inputs
        - B003          # Model architecture confidentiality
        - B008          # Deployment security
    confidence: high
    evidence:
      - ISO 24028 security maps to ISO 42001 A.5.5 (explicit) and ISO 27001 security controls
      - NIST AI RMF MEASURE 2.6 and 2.7 directly address AI security consistent with ISO 24028

  - trustworthiness_property: TP.7
    title: Privacy
    external_mappings:
      iso-42001:
        - A.7.5    # PII in AI systems (explicit privacy control)
        - A.6.1.3  # Processes for responsible design — privacy by design
      iso-42005:
        - G.6.8    # Impact analysis — privacy dimension (6.8.2.5)
      iso-29100:
        - All      # Privacy framework — cross-reference for AI privacy implementation
      nist-ai-rmf:
        - MEASURE 2.10  # Privacy risks associated with AI
        - GOVERN 6.1    # Privacy commitments in AI development
      eu-ai-act:
        - Article 10    # Data governance — data quality and privacy
        - Article 72    # Post-market monitoring including privacy incidents
      aiuc-1:
        - A001          # AI input data policies covering customer data
        - A003          # Restrict AI agent data access
        - A006          # Prevent personal data leakage through AI outputs
    confidence: high
    evidence:
      - ISO 42001 A.7.5 explicitly addresses PII in AI systems — direct alignment with ISO 24028 privacy property

  - trustworthiness_property: TP.8
    title: Fairness
    external_mappings:
      iso-42001:
        - A.5.4    # Assessing AI system impact on individuals and groups
        - A.5.5    # Assessing societal impacts of AI systems
        - 6.1.4    # Impact assessment planning — fairness impacts
      iso-42005:
        - G.6.8    # Impact analysis — fairness/discrimination dimension (6.8.2.4)
      nist-ai-rmf:
        - MEASURE 2.11  # Fairness and bias impacts
        - MANAGE 1.3    # Risk responses for fairness impacts
        - MAP 1.5       # Impact likelihood — discriminatory outcomes
      eu-ai-act:
        - Article 10    # Data governance — representative and non-discriminatory data
        - Article 9     # Risk management including non-discrimination risks
        - Article 27    # Fundamental rights impact assessment
      aiuc-1:
        - C001          # Risk taxonomy including fairness risks
    confidence: high
    evidence:
      - ISO 42001 A.5.4 and A.5.5 cover individual and societal impacts — directly aligned with fairness property
      - NIST AI RMF MEASURE 2.11 is the most direct external mapping to ISO 24028 fairness

  - trustworthiness_property: TP.9
    title: Accountability
    external_mappings:
      iso-42001:
        - A.2.2    # AI policy — accountability statement
        - A.3.2    # Roles and responsibilities for AI systems
        - A.8.2    # Information for interested parties — accountability information
        - "5.3"    # Organizational roles, responsibilities, authorities (HLS)
      nist-ai-rmf:
        - GOVERN 2.1   # Roles and responsibilities documented
        - GOVERN 3.2   # Executive accountability for AI risk
        - MANAGE 4.1   # Post-deployment accountability and monitoring
      eu-ai-act:
        - Article 16   # Obligations of providers of high-risk AI
        - Article 26   # Obligations of deployers
        - Article 17   # Quality management system — accountability structure
      aiuc-1:
        - E004          # AI system changes documented and approved
        - E007          # Approval processes for material changes
        - E008          # Internal reviews of AI governance processes
    confidence: high
    evidence:
      - ISO 42001 A.3.2 directly addresses roles and responsibilities — accountability foundation per ISO 24028

  - trustworthiness_property: TP.10
    title: Transparency and Explicability
    external_mappings:
      iso-42001:
        - A.8.2    # Information for interested parties of AI systems
        - A.8.3    # AI system documentation
        - A.8.4    # Use and oversight information
        - A.4.3    # AI system documentation — technical documentation
      iso-42005:
        - G.6.8    # Impact analysis — transparency dimension (6.8.2.3)
      nist-ai-rmf:
        - MEASURE 2.9   # Risk of using AI systems is communicated
        - MEASURE 2.8   # AI risk management practices reviewed and communicated
        - MAP 2.2       # Scientific findings, context, and constraints communicated
      eu-ai-act:
        - Article 13    # Transparency and provision of information to deployers
        - Article 50    # Transparency obligations for general-purpose AI
      aiuc-1:
        - E016          # Disclosure mechanisms for AI interaction
        - E017          # System transparency policy with model cards
    confidence: high
    evidence:
      - ISO 42001 A.8.2 directly addresses transparency information for interested parties
      - EU AI Act Article 13 is the most direct regulatory implementation of transparency property

  # ─────────────────────────────────────────────────────────────────────────
  # THREAT CATEGORY MAPPINGS
  # ─────────────────────────────────────────────────────────────────────────

  - threat_category: T.1
    title: Threats to model integrity (poisoning, adversarial examples, model theft)
    external_mappings:
      nist-ai-rmf:
        - MEASURE 2.6   # AI system performance in adversarial conditions
        - MEASURE 2.7   # Adversarial robustness
      mitre-atlas:
        - AML.T0018     # Backdoor ML model (data poisoning)
        - AML.T0005     # Backdoor attack via poisoned data
        - AML.T0006     # Create proxy ML model (model theft)
        - AML.T0043     # Craft adversarial data
      aiuc-1:
        - B001          # Adversarial testing program
        - B009          # Output limitations against model extraction
      eu-ai-act:
        - Article 15    # Cybersecurity — model integrity attacks
    confidence: high
    evidence:
      - MITRE ATLAS explicitly catalogs model integrity threats consistent with ISO 24028 taxonomy

  - threat_category: T.2
    title: Threats to data confidentiality and privacy (inference attacks, memorization)
    external_mappings:
      nist-ai-rmf:
        - MEASURE 2.10  # Privacy risks
      mitre-atlas:
        - AML.T0024     # Inference attack on ML model (membership inference)
        - AML.T0025     # Invert ML model (model inversion)
        - AML.T0048     # Model theft
      aiuc-1:
        - A001          # AI data policies
        - A006          # Prevent personal data leakage
    confidence: high
    evidence:
      - MITRE ATLAS T0024/T0025 directly address privacy threats cataloged in ISO 24028

  - threat_category: T.3
    title: Threats to fairness (bias in data, algorithm, and deployment)
    external_mappings:
      nist-ai-rmf:
        - MEASURE 2.11  # Fairness and bias
      eu-ai-act:
        - Article 10    # Data quality — training data bias
      aiuc-1:
        - C001          # Risk taxonomy including bias
    confidence: medium
    evidence:
      - Fairness threats in ISO 24028 align with NIST AI RMF bias measurement requirements

  - threat_category: T.4
    title: Threats to safety (unsafe AI behavior in critical applications)
    external_mappings:
      nist-ai-rmf:
        - MAP 1.5       # Safety impacts from AI systems
        - MANAGE 1.3    # Risk responses for safety impacts
      eu-ai-act:
        - Annex III     # High-risk AI categories (inherently safety-sensitive domains)
        - Article 9     # Risk management for safety
    confidence: high
    evidence:
      - ISO 24028 safety threat taxonomy aligns with EU AI Act high-risk AI system categorization

  - threat_category: T.5
    title: Threats to accountability and transparency (black-box models, missing audit trails)
    external_mappings:
      nist-ai-rmf:
        - GOVERN 2.2    # Accountability documentation
        - MEASURE 2.8   # Risk management practices communicated
      eu-ai-act:
        - Article 12    # Record-keeping for high-risk AI
        - Article 13    # Transparency requirements
      aiuc-1:
        - E015          # Logs of AI system processes
        - E016          # Disclosure mechanisms
    confidence: high
    evidence:
      - Accountability threats in ISO 24028 map directly to EU AI Act transparency and record-keeping requirements

  - threat_category: T.6
    title: Threats to availability and reliability (sponge attacks, distribution drift, degradation)
    external_mappings:
      nist-ai-rmf:
        - MEASURE 4.3   # AI risks monitored over time — includes degradation
        - MANAGE 4.1    # Post-deployment monitoring
      mitre-atlas:
        - AML.T0029     # Denial of ML service attack
    confidence: medium
    evidence:
      - MITRE ATLAS sponge/denial-of-service attacks align with ISO 24028 availability threats
