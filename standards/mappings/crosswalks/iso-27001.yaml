    title: Policies for information security
    external_mappings:
      nist-csf:
        - GV.PO-01
        - GV.PO-02
      nist-800-53:
        - PL-1
        - PL-2
        - PM-1
      pci-dss:
        - "12.1"
        - "12.2"
      hipaa:
        - "164.308(a)(1)(i)"
      soc2:
        - CC1.3
        - CC5.3
      aiuc-1:
        - E001
        - E010
      cis-v8:
        - "1.1"
    confidence: high
    evidence:
      - ISO/IEC 27001:2022 Annex A mapping documentation
      - crosswalk.yaml GOV-POLICY entry
    notes: Information security policy suite maps to governance controls across all frameworks

