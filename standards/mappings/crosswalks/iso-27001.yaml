framework: iso-27001
version: "2022"
description: >
  ISO/IEC 27001:2022 Information Security Management System cross-framework control mappings.
  Maps Annex A controls (A.5-A.8) to NIST CSF 2.0, NIST SP 800-53 Rev 5, PCI-DSS v4.0.1,
  HIPAA Security Rule, SOC 2 Trust Service Criteria, AIUC-1, and CIS Controls v8.
last_updated: 2026-02-22

# Mapping methodology:
# - confidence: high = direct equivalence, same intent and scope
# - confidence: medium = similar intent, minor scope differences
# - confidence: low = related but different scope or approach
# NIST CSF 2.0 uses GV/ID/PR/DE/RS/RC function prefix notation
# NIST 800-53 Rev 5 control families: AC, AT, AU, CA, CM, CP, IA, IR, MA, MP, PE, PL, PM, PS, PT, RA, SA, SC, SI, SR
# PCI-DSS v4.0.1 requirements 1-12
# HIPAA Security Rule: 164.308 (Administrative), 164.310 (Physical), 164.312 (Technical)
# SOC 2 Trust Service Criteria: CC1-CC9, A1 (Availability), C1 (Confidentiality), PI1 (Processing Integrity), P1-P8 (Privacy)

