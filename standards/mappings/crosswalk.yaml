# Cross-Framework Control Mappings (Crosswalk)
# Maps equivalent controls across compliance frameworks
#
# Purpose:
#   1. Control deduplication (one implementation satisfies multiple frameworks)
#   2. Gap analysis across frameworks
#   3. Unified compliance matrix generation
#
# Confidence levels:
#   high - Direct equivalence, controls have same intent and scope
#   medium - Similar intent, minor scope differences
#   low - Related but different scope or approach
#
# Last Updated: 2026-01-14

# Access Control Domain
access_control:

  - id: ACCESS-MFA
    description: "Multi-factor authentication requirement"
    mappings:
      nist-csf: "PR.AA-01"
      pci-dss: "8.3.1"
      hipaa: "§164.312(d)"
      iso-27001: "A.8.5"
      cis-v8: "6.3"
      soc2: "CC6.1"
      fedramp: "IA-2"
    confidence: high
    evidence:
      - "MFA configuration screenshots"
      - "Authentication policy"
      - "User access logs showing MFA enforcement"
    implementation_note: "Phishing-resistant MFA (FIDO2/WebAuthn) preferred"

  - id: ACCESS-LEAST-PRIVILEGE
    description: "Least privilege access enforcement"
    mappings:
      nist-csf: "PR.AA-05"
      pci-dss: "7.1"
      hipaa: "§164.312(a)(1)"
      iso-27001: "A.8.3"
      cis-v8: "6.8"
      soc2: "CC6.3"
      fedramp: "AC-6"
    confidence: high
    evidence:
      - "Access control policy"
      - "Role definitions"
      - "Access review records"

  - id: ACCESS-PASSWORD-POLICY
    description: "Password complexity and management"
    mappings:
      nist-csf: "PR.AA-03"
      pci-dss: "8.2.3"
      hipaa: "§164.308(a)(5)(ii)(D)"
      iso-27001: "A.8.5"
      cis-v8: "5.2"
      soc2: "CC6.1"
      fedramp: "IA-5"
    confidence: high
    evidence:
      - "Password policy document"
      - "System configuration showing enforcement"

  - id: ACCESS-PRIVILEGED-ACCOUNT
    description: "Privileged access management"
    mappings:
      nist-csf: "PR.AA-05"
      pci-dss: "8.6"
      hipaa: "§164.312(a)(2)(i)"
      iso-27001: "A.8.18"
      cis-v8: "5.4"
      soc2: "CC6.2"
      fedramp: "AC-2(7)"
    confidence: high
